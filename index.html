ores of each group.|showed;shows;has shown;is showing|1|Isi tabel: simple present.\nmc|The results ___ that the new method improved reading scores.|indicate;indicated;have indicate;indicating|1|Hasil temuan spesifik: simple past.\nmc|Water ___ at 0°C.|froze;freezes;has frozen;is freezing|1|Fakta umum: simple present.\nmc|These findings ___ that schools should start later.|suggested;suggest;have suggest;suggesting|1|Diskusi/implikasi: simple present.\nmc|Since 2010, the number of online courses ___ dramatically.|increased;has increased;increases;was increasing|1|Since + sampai sekarang: has increased.\nerr|Figure 1 [showed] the [growth] of exports [between] 2015 and [2020].|0|shows|Isi gambar memakai simple present.\nerr|In this study, [thirty] teachers [are interviewed] [last] [semester].|2|were interviewed|Metode yang sudah dilakukan: were interviewed.\nerr|Previous research [shows] [already] [that] [exercise] improves mood.|1|has already shown|Ringkasan penelitian sebelumnya: present perfect.\nord|Previous studies have examined this problem.\nord|The data were analysed using SPSS.\nord|Table 3 shows the results of the survey."},{"id":"g-k6","lv":"kuliah","en":"Inversion & Reduced Clauses","idn":"Inversi & Anak Kalimat yang Dipersingkat","rule":{"points":["Setelah kata negatif di awal kalimat terjadi <b>inversi</b>: Never <b>have I</b> seen...; Rarely <b>does</b> it snow...","Pengandaian tanpa if: <b>Had I known</b> = If I had known; <b>Should you need</b> = If you need","Anak kalimat relatif bisa dipersingkat: The man <i>who is standing</i> there → The man <b>standing</b> there","Anak kalimat pasif: The car <i>which was made</i> in Japan → The car <b>made</b> in Japan"],"formula":["Negative adverb + auxiliary + subject + verb","Had + subject + V3, ..."],"examples":[["Rarely do we see such dedication.","Jarang kita melihat dedikasi seperti itu."],["Had she known, she would have helped.","Seandainya dia tahu, dia pasti membantu."]],"trap":"Setelah \"Only after\", inversi terjadi di kalimat utama: Only after the test <b>did I</b> realise..."},"items":"mc|Never ___ such a beautiful sunset.|I have seen;have I seen;I saw;did I saw|1|Never di awal: inversi have I seen.\nmc|___ known about the traffic, I would have left earlier.|If I;Had I;Have I;Did I|1|Pengandaian tanpa if: Had I known.\nmc|The students ___ in the library are preparing for exams.|studying;studied;are studying;who studying|0|Relatif aktif dipersingkat: studying.\nmc|The products ___ in this factory are exported to Japan.|making;made;are made;which making|1|Relatif pasif dipersingkat: made.\nmc|Rarely ___ late for class.|she is;is she;she was;does she is|1|Rarely di awal: inversi is she.\nmc|___ you need any help, please contact the office.|If;Should;Would;Had|1|Should you need = If you need.\nmc|Only after the lecture ___ the importance of the topic.|I understood;did I understand;I did understand;understood I|1|Only after + inversi: did I understand.\nmc|Not until the 19th century ___ widely used.|electricity was;was electricity;electricity had;did electricity|1|Not until + inversi: was electricity.\nerr|Seldom [we have] [experienced] such [heavy] [rain].|0|have we|Seldom di awal kalimat: inversi have we.\nerr|The man [stood] [near] the door [is] my [supervisor].|0|standing|Relatif aktif dipersingkat: standing.\nerr|[Had] I [know] the answer, I [would have told] [you].|1|known|Had + V3: known.\nord|Never have I seen such a large crowd.\nord|Had I known, I would have helped you.\nord|The books written by this author are popular."}];

const READ=[{"id":"r-sd1","lv":"sd","en":"All About Me","idn":"Tentang Aku","texts":[{"title":"My Name Is Dina","type":"Teks deskripsi diri","p":["Hello! My name is Dina. I am nine years old. I live in Bandung with my mother, my father, and my little brother. I am in grade three. My favourite colour is purple. I like drawing and riding my bike."],"q":"main|What is the text about?|Dina's school;Dina and herself;Dina's bike;Dina's brother|1|-|Teks ini memperkenalkan Dina: umur, keluarga, dan kesukaannya.\ndetail|How old is Dina?|Seven;Eight;Nine;Ten|2|I am nine years old|Dina berkata \"I am nine years old\".\ndetail|Where does Dina live?|In Bandung;In Bogor;In Bali;In Jakarta|0|I live in Bandung|Dina tinggal di Bandung.\ndetail|What is Dina's favourite colour?|Pink;Blue;Green;Purple|3|My favourite colour is purple|Warna kesukaannya ungu (purple).\nev|Ketuk kalimat yang menunjukkan hobi Dina.||-|I like drawing and riding my bike|Hobi Dina: menggambar dan bersepeda."},{"title":"My Best Friend","type":"Teks deskripsi","p":["My best friend is Raka. He is tall and he has short black hair. Raka is very kind and funny. He always helps me with my maths homework. We play football together after school. I am happy to have a friend like Raka."],"q":"main|Who is the text about?|The writer's teacher;The writer's brother;The writer's best friend;A football player|2|My best friend is Raka|Teks ini menceritakan Raka, sahabat penulis.\ndetail|What does Raka look like?|Short with long hair;Tall with short black hair;Tall with curly hair;Short with black hair|1|He is tall and he has short black hair|Raka tinggi dan berambut hitam pendek.\ndetail|What does Raka help the writer with?|English homework;Drawing;Maths homework;Cooking|2|He always helps me with my maths homework|Raka membantu PR matematika.\nvocab|\"Raka is very <b>kind</b>.\" Kind means ...|baik hati;pintar;tinggi;cepat|0|-|Kind = baik hati.\nev|Ketuk kalimat yang menunjukkan kegiatan mereka sepulang sekolah.||-|We play football together after school|Mereka bermain sepak bola sepulang sekolah."}]},{"id":"r-sd2","lv":"sd","en":"Animals I Know","idn":"Hewan di Sekitarku","texts":[{"title":"My Cat Milo","type":"Teks deskripsi","p":["I have a cat. His name is Milo. Milo is orange and white. He has green eyes and a long tail. Milo likes to sleep on the sofa. He eats fish two times a day. When I come home from school, Milo runs to the door."],"q":"main|What is the text about?|A dog named Milo;The writer's cat;A fish;The writer's sofa|1|I have a cat|Teks ini tentang kucing penulis, Milo.\ndetail|What colour is Milo?|Black and white;Grey;Orange and white;Brown|2|Milo is orange and white|Milo berwarna oranye dan putih.\ndetail|Where does Milo like to sleep?|On the bed;On the sofa;In the kitchen;Under the table|1|Milo likes to sleep on the sofa|Milo suka tidur di sofa.\ndetail|How many times does Milo eat fish every day?|One;Two;Three;Four|1|He eats fish two times a day|Dua kali sehari.\ninfer|What can we guess about Milo?|He is afraid of the writer;He is happy to see the writer;He does not like fish;He lives outside|1|Milo runs to the door|Milo berlari ke pintu saat penulis pulang, jadi dia senang melihatnya."},{"title":"The Elephant","type":"Teks laporan sederhana","p":["The elephant is the biggest animal on land. It is grey and it has big ears. An elephant has a long nose. We call it a trunk. Elephants use their trunks to drink water and to pick up food. They eat grass, leaves, and fruit. In Indonesia, we can find elephants in Sumatra."],"q":"main|What is the text about?|Animals in the sea;Elephants;Grass and leaves;Sumatra|1|-|Seluruh teks menjelaskan gajah.\nref|\"We call <b>it</b> a trunk.\" What does \"it\" mean?|The elephant;The ear;The long nose;The water|2|We call it a trunk|\"It\" merujuk ke hidung panjang (long nose).\ndetail|What do elephants use their trunks for?|To run fast;To drink and pick up food;To sleep;To swim|1|Elephants use their trunks to drink water and to pick up food|Belalai dipakai untuk minum dan mengambil makanan.\ntfng|Elephants eat meat.|True;False;Not Given|1|They eat grass, leaves, and fruit|Gajah makan rumput, daun, dan buah, bukan daging.\nev|Ketuk kalimat yang menunjukkan tempat kita bisa menemukan gajah di Indonesia.||-|we can find elephants in Sumatra|Gajah ada di Sumatra."}]},{"id":"r-sd3","lv":"sd","en":"My Days","idn":"Hari-hariku","texts":[{"title":"My Sunday","type":"Teks recount sederhana","p":["Last Sunday, I went to the park with my family. We went there by car. In the park, my brother and I played on the swings. My mother made sandwiches for us. After lunch, we fed the ducks in the pond. We went home at four o'clock. I was tired but happy."],"q":"main|What is the text about?|The writer's school;A day at the park;How to make sandwiches;A trip to the zoo|1|-|Teks menceritakan hari Minggu di taman.\ndetail|How did they go to the park?|By bus;On foot;By car;By bike|2|We went there by car|Mereka naik mobil.\nseq|What did they do after lunch?|They played on the swings;They fed the ducks;They made sandwiches;They went to the park|1|After lunch, we fed the ducks in the pond|Setelah makan siang mereka memberi makan bebek.\ndetail|What time did they go home?|At two o'clock;At three o'clock;At four o'clock;At five o'clock|2|We went home at four o'clock|Pukul empat.\nev|Ketuk kalimat yang menunjukkan perasaan penulis di akhir hari.||-|I was tired but happy|Penulis lelah tetapi senang."},{"title":"A Day at the Beach","type":"Teks recount sederhana","p":["During the holiday, I visited my grandmother in Lombok. One morning, we went to the beach. The water was blue and clear. I built a big sandcastle with my cousin. Then we swam in the sea. Suddenly, it started to rain, so we ran to a small café and drank hot tea."],"q":"detail|Who did the writer visit?|An uncle;A grandmother;A teacher;A friend|1|I visited my grandmother in Lombok|Penulis mengunjungi nenek di Lombok.\ndetail|What did the writer build?|A house;A boat;A sandcastle;A kite|2|I built a big sandcastle with my cousin|Istana pasir.\nseq|What happened after they swam?|They built a sandcastle;It started to rain;They went to the beach;They visited grandmother|1|Suddenly, it started to rain|Setelah berenang, hujan turun.\nvocab|\"The water was blue and <b>clear</b>.\" Clear means ...|kotor;jernih;dingin;dalam|1|-|Clear = jernih.\ninfer|Why did they go to the café?|They were hungry;It was raining;The café was their home;They wanted to swim|1|it started to rain, so we ran to a small café|Mereka ke kafe karena hujan."}]},{"id":"r-sd4","lv":"sd","en":"Notes & Invitations","idn":"Undangan & Pengumuman","texts":[{"title":"A Birthday Invitation","type":"Undangan","p":["Dear Sinta,","Please come to my birthday party! It is on Saturday, 12 July, at 3 p.m. The party is at my house, Jalan Melati number 5. There will be games, cake, and a magic show. Please wear something blue.","See you there!","Bima"],"q":"purpose|Why did Bima write this text?|To say sorry;To invite Sinta to a party;To ask for help;To tell a story|1|Please come to my birthday party|Bima mengundang Sinta ke pesta ulang tahunnya.\ndetail|When is the party?|Friday at 3 p.m.;Saturday at 3 p.m.;Saturday at 5 p.m.;Sunday at 3 p.m.|1|It is on Saturday, 12 July, at 3 p.m.|Sabtu, pukul 3 sore.\ndetail|Where is the party?|At school;At a restaurant;At Bima's house;At Sinta's house|2|The party is at my house|Di rumah Bima.\ndetail|What colour should Sinta wear?|Red;Blue;Green;White|1|Please wear something blue|Biru.\ntfng|There will be a magic show at the party.|True;False;Not Given|0|There will be games, cake, and a magic show|Benar, ada pertunjukan sulap."},{"title":"School Notice","type":"Pengumuman","p":["ATTENTION, STUDENTS!","Our school will have a Clean Day on Friday. Please bring a broom, a rag, or a small bucket. We will clean our classrooms and the school garden. After cleaning, we will eat lunch together in the hall. Do not forget to wear your sports clothes."],"q":"main|What is the notice about?|A sports day;A Clean Day;A school trip;A birthday party|1|Our school will have a Clean Day on Friday|Pengumuman tentang hari bersih-bersih.\ndetail|When is the Clean Day?|Monday;Wednesday;Friday;Saturday|2|on Friday|Hari Jumat.\ndetail|What will students clean?|Their houses;The classrooms and the garden;The hall only;The street|1|We will clean our classrooms and the school garden|Kelas dan kebun sekolah.\ndetail|What should students wear?|School uniform;Sports clothes;Batik;A hat|1|wear your sports clothes|Baju olahraga.\nseq|What will students do after cleaning?|Go home;Play football;Eat lunch together;Plant trees|2|After cleaning, we will eat lunch together in the hall|Makan siang bersama di aula."}]},{"id":"r-smp1","lv":"smp","en":"Descriptive Texts","idn":"Teks Deskripsi","texts":[{"title":"Komodo National Park","type":"Descriptive text","p":["Komodo National Park is in East Nusa Tenggara, Indonesia. It includes three big islands, Komodo, Rinca, and Padar, and many small ones. The park is famous because it is the home of the Komodo dragon, the largest lizard in the world.","A Komodo dragon can grow up to three metres long. It has rough grey skin, strong legs, and a long yellow tongue. It is a dangerous hunter. It eats deer, wild pigs, and even buffalo.","The park is not only about dragons. It also has beautiful pink beaches and colourful coral reefs. In 1991, UNESCO made Komodo National Park a World Heritage Site. Today, thousands of tourists visit it every year."],"q":"main|What is the main topic of the text?|The life of tourists;Komodo National Park;Coral reefs in Indonesia;How to hunt deer|1|-|Semua paragraf menggambarkan Taman Nasional Komodo.\ndetail|How long can a Komodo dragon grow?|One metre;Two metres;Three metres;Five metres|2|can grow up to three metres long|Hingga tiga meter.\nhead|What is the best heading for paragraph 2?|The Islands of the Park;What a Komodo Dragon Is Like;Pink Beaches;Tourists in Komodo|1|-|Paragraf 2 menggambarkan ciri dan makanan komodo.\nvocab|\"It has <b>rough</b> grey skin.\" The opposite of rough is ...|smooth;dry;thick;dark|0|-|Rough (kasar) lawannya smooth (halus).\ntfng|Padar is one of the big islands in the park.|True;False;Not Given|0|It includes three big islands, Komodo, Rinca, and Padar|Benar, Padar termasuk tiga pulau besar.\nev|Ketuk kalimat yang menunjukkan bahwa taman ini diakui dunia.||-|UNESCO made Komodo National Park a World Heritage Site|UNESCO menetapkannya sebagai Situs Warisan Dunia."},{"title":"Pak Darto's Bakery","type":"Descriptive text","p":["There is a small bakery at the end of my street. It belongs to Pak Darto, a friendly man in his sixties. He always wears a white apron and a big smile.","The bakery opens at five in the morning. The smell of fresh bread fills the whole street, so people wake up hungry. Pak Darto sells soft white bread, banana cakes, and cheese rolls. My favourite is his chocolate bun, which is warm and sweet inside.","The bakery is not very big. It has only two tables and four chairs. However, it is always busy because the prices are cheap and the bread is delicious. Many people say it is the heart of our neighbourhood."],"q":"main|What does the writer mainly describe?|A big supermarket;A small bakery and its owner;How to bake bread;The writer's street|1|-|Teks menggambarkan toko roti kecil milik Pak Darto.\ndetail|What time does the bakery open?|At four;At five;At six;At seven|1|The bakery opens at five in the morning|Pukul lima pagi.\ninfer|Why do people \"wake up hungry\"?|They do not eat dinner;They smell the fresh bread;The bakery is noisy;Pak Darto calls them|1|The smell of fresh bread fills the whole street|Aroma roti membuat orang lapar.\nref|\"<b>It</b> has only two tables and four chairs.\" \"It\" refers to ...|the street;the bakery;the chocolate bun;the neighbourhood|1|It has only two tables and four chairs|\"It\" = the bakery.\ndetail|Why is the bakery always busy?|It is very big;It is open all night;It is cheap and the bread is delicious;It sells coffee|2|because the prices are cheap and the bread is delicious|Murah dan rotinya enak.\nev|Ketuk kalimat yang menyebut makanan kesukaan penulis.||-|My favourite is his chocolate bun|Roti cokelat (chocolate bun)."}]},{"id":"r-smp2","lv":"smp","en":"Recount Texts","idn":"Teks Recount","texts":[{"title":"A Trip to Yogyakarta","type":"Recount text","p":["Last December, my class went on a study tour to Yogyakarta. We left Semarang by bus at six in the morning and arrived at Borobudur Temple at about nine.","At Borobudur, our guide told us that the temple was built in the ninth century. We walked up to the top and looked at the beautiful stone reliefs. It was hot, but the view of the mountains was amazing.","In the afternoon, we visited Malioboro Street. I bought a batik shirt for my father and some bakpia for my mother. In the evening, we ate gudeg together.","We returned to Semarang late at night. I was very tired, but I learned a lot about history. It was one of the best trips of my life."],"q":"purpose|What is the purpose of the text?|To explain how to go to Yogyakarta;To tell about a past trip;To describe batik;To persuade people to visit Semarang|1|-|Recount menceritakan pengalaman masa lalu.\ndetail|How did the class travel to Yogyakarta?|By train;By plane;By bus;By car|2|We left Semarang by bus|Naik bus.\ndetail|When was Borobudur built, according to the guide?|In the seventh century;In the eighth century;In the ninth century;In the tenth century|2|the temple was built in the ninth century|Abad kesembilan.\nseq|What did the writer do after visiting Borobudur?|Ate gudeg;Went to Malioboro Street;Left Semarang;Climbed a mountain|1|In the afternoon, we visited Malioboro Street|Sore harinya ke Malioboro.\ndetail|What did the writer buy for his mother?|A batik shirt;Gudeg;Bakpia;A souvenir|2|some bakpia for my mother|Bakpia.\nev|Ketuk kalimat yang menunjukkan pendapat penulis tentang perjalanan itu.||-|It was one of the best trips of my life|Penulis menilai itu salah satu perjalanan terbaiknya."},{"title":"My First Day at Junior High","type":"Recount text","p":["I still remember my first day at junior high school. I woke up very early because I was nervous. My mother made my favourite breakfast, but I could not eat much.","When I arrived at school, I did not know anyone. I sat alone in the corner of the classroom. Then a girl with glasses sat next to me and said, \"Hi, I'm Laras. Is this your first day too?\" We talked about our old schools and our hobbies.","During the break, Laras introduced me to her friends. In the afternoon, our homeroom teacher asked us to make a name tag and to tell the class about ourselves. I was shy, but everyone clapped after I spoke.","By the end of the day, I was not nervous anymore. Laras is still my best friend today."],"q":"main|What is the text mainly about?|How to make a name tag;The writer's first day at a new school;Laras's hobbies;The writer's breakfast|1|-|Teks menceritakan hari pertama di SMP.\ninfer|Why could the writer not eat much at breakfast?|The food was bad;The writer was nervous;The writer was late;The writer was sick|1|I woke up very early because I was nervous|Penulis gugup.\nref|\"<b>We</b> talked about our old schools.\" \"We\" refers to ...|the writer and the teacher;the writer and Laras;all the students;the writer and the mother|1|We talked about our old schools and our hobbies|Penulis dan Laras.\ndetail|What did the homeroom teacher ask students to do?|Clean the class;Make a name tag and introduce themselves;Read a book;Draw a picture|1|our homeroom teacher asked us to make a name tag|Membuat papan nama dan memperkenalkan diri.\nvocab|\"I was <b>shy</b>, but everyone clapped.\" Shy means ...|malu;marah;senang;lapar|0|-|Shy = malu.\ntfng|Laras and the writer are still friends now.|True;False;Not Given|0|Laras is still my best friend today|Benar."}]},{"id":"r-smp3","lv":"smp","en":"Procedure Texts","idn":"Teks Prosedur","texts":[{"title":"How to Make Fried Rice","type":"Procedure text","p":["Fried rice is easy to make and delicious. Here is how to make it for two people.","Ingredients: two plates of cooked rice (it is better if the rice is from yesterday), one egg, two cloves of garlic, two shallots, sweet soy sauce, salt, and cooking oil.","Steps: First, chop the garlic and shallots. Next, heat two spoons of oil in a frying pan. Then, fry the garlic and shallots until they smell good. After that, add the egg and stir it quickly. Put in the rice and mix everything well. Finally, add sweet soy sauce and a little salt. Serve your fried rice with cucumber and crackers."],"q":"purpose|What is the purpose of the text?|To tell a story about rice;To describe a restaurant;To explain how to make fried rice;To compare two dishes|2|-|Teks prosedur menjelaskan cara membuat sesuatu.\ndetail|What kind of rice is better to use?|Uncooked rice;Rice from yesterday;Brown rice;Sticky rice|1|it is better if the rice is from yesterday|Nasi dari kemarin lebih baik.\nseq|What should you do right after heating the oil?|Add the egg;Fry the garlic and shallots;Put in the rice;Chop the garlic|1|Then, fry the garlic and shallots until they smell good|Setelah memanaskan minyak, tumis bawang.\nseq|What is the last step?|Chop the shallots;Add the egg;Add soy sauce and salt;Heat the oil|2|Finally, add sweet soy sauce and a little salt|\"Finally\" menandai langkah terakhir.\nvocab|\"First, <b>chop</b> the garlic.\" Chop means ...|mencuci;memotong kecil-kecil;menggoreng;merebus|1|-|Chop = memotong kecil-kecil.\nev|Ketuk kalimat yang menyebut makanan pendamping nasi goreng.||-|Serve your fried rice with cucumber and crackers|Disajikan dengan mentimun dan kerupuk."},{"title":"How to Plant Chilli Seeds","type":"Procedure text","p":["Do you want to grow your own chillies at home? You only need a few simple things.","Materials: chilli seeds, a small pot, soil, and water.","Steps: First, soak the seeds in warm water for about six hours. This helps them grow faster. Second, fill the pot with soil, but leave some space at the top. Third, make small holes in the soil with your finger, about one centimetre deep. Put one or two seeds in each hole and cover them with soil. Then, water the soil gently every morning. Keep the pot in a place that gets sunlight. In about two weeks, small green leaves will appear."],"q":"main|What does the text explain?|How to cook chillies;How to plant chilli seeds;Why chillies are hot;Where to buy seeds|1|-|Teks menjelaskan cara menanam biji cabai.\ndetail|How long should you soak the seeds?|One hour;Two hours;Six hours;Two weeks|2|soak the seeds in warm water for about six hours|Sekitar enam jam.\nref|\"<b>This</b> helps them grow faster.\" \"This\" refers to ...|watering every morning;soaking the seeds in warm water;the sunlight;the pot|1|This helps them grow faster|\"This\" = merendam biji dalam air hangat.\ndetail|How deep should the holes be?|One centimetre;Five centimetres;One metre;Ten centimetres|0|about one centimetre deep|Sekitar satu sentimeter.\ninfer|What will probably happen if the pot never gets sunlight?|The seeds will grow faster;The plant may not grow well;The soil will become hot;The leaves will turn red|1|Keep the pot in a place that gets sunlight|Tanaman butuh sinar matahari, jadi tanpa itu pertumbuhannya terganggu.\ntfng|The seeds need to be watered three times a day.|True;False;Not Given|1|water the soil gently every morning|Salah, cukup setiap pagi."}]},{"id":"r-smp4","lv":"smp","en":"Stories & Short Messages","idn":"Cerita & Pesan Singkat","texts":[{"title":"Malin Kundang","type":"Narrative text (folktale from West Sumatra)","p":["Long ago, in a fishing village in West Sumatra, there lived a poor widow and her son, Malin Kundang. Malin was a hardworking boy. One day, he decided to leave the village to find a better life. His mother cried, but she let him go.","Years later, Malin became a rich merchant. He married a beautiful woman and sailed with many ships. One day, his ship stopped at his old village. His mother heard the news and ran to the beach to see him.","However, Malin was ashamed of his poor, old mother. He said, \"I don't know you! My mother is not a poor woman like you.\" His mother was very sad. She prayed, \"If he is truly my son, punish him.\"","Soon, a big storm came. Malin's ship broke into pieces, and Malin slowly turned into stone. People believe that the stone is still on Air Manis Beach today."],"q":"main|What is the moral of the story?|Always work hard at sea;Never forget and respect your parents;Rich people are happy;Storms are dangerous|1|-|Malin dihukum karena durhaka pada ibunya.\ndetail|Why did Malin leave the village?|He was angry with his mother;He wanted a better life;He wanted to get married;The village was destroyed|1|he decided to leave the village to find a better life|Dia ingin hidup lebih baik.\nvocab|\"Malin was <b>ashamed</b> of his poor, old mother.\" Ashamed means ...|bangga;malu;takut;rindu|1|-|Ashamed = malu.\nseq|What happened right after his mother prayed?|Malin married a rich woman;A big storm came;Malin left the village;His mother ran to the beach|1|Soon, a big storm came|Badai datang setelah doa sang ibu.\ntfng|Malin's wife also turned into stone.|True;False;Not Given|2|-|Teks tidak menyebut apa yang terjadi pada istrinya.\nev|Ketuk kalimat yang menunjukkan Malin tidak mengakui ibunya.||-|I don't know you!|Malin berkata \"I don't know you!\""},{"title":"A Message from the Class Leader","type":"Short message / email","p":["To: All students of 8B","Subject: Change of plan for Thursday","Hi everyone,","Our English teacher, Bu Rina, is attending a training on Thursday, so she cannot teach us. Instead, we will have a library session from 10 to 11.30. Please bring your English workbook and a novel or a short story in English. We will read for 45 minutes and then write a short summary.","Also, the deadline for the poster project has moved from Friday to next Monday. Please send your poster to Bu Rina by email.","If you have questions, send me a message.","Thanks,","Fajar (class leader)"],"q":"purpose|Why did Fajar write this message?|To invite friends to a party;To tell about changes to the class schedule;To ask for a novel;To complain about the teacher|1|-|Pesan ini memberi tahu perubahan rencana kelas.\ndetail|Why can't Bu Rina teach on Thursday?|She is sick;She is on holiday;She is attending a training;She is in the library|2|is attending a training on Thursday|Bu Rina mengikuti pelatihan.\ndetail|What will the students do after reading?|Make a poster;Write a short summary;Send an email;Take a test|1|We will read for 45 minutes and then write a short summary|Menulis ringkasan.\ndetail|When is the new deadline for the poster?|Thursday;Friday;Next Monday;Next Thursday|2|has moved from Friday to next Monday|Senin depan.\nvocab|\"The <b>deadline</b> for the poster project has moved.\" Deadline means ...|batas waktu;hadiah;nilai;tema|0|-|Deadline = batas waktu.\nev|Ketuk kalimat yang menjelaskan cara mengirim poster.||-|Please send your poster to Bu Rina by email|Poster dikirim lewat email."}]},{"id":"r-sma1","lv":"sma","en":"Narrative Texts","idn":"Teks Naratif","texts":[{"title":"The Legend of Lake Toba","type":"Narrative text (legend from North Sumatra)","p":["Once upon a time, in North Sumatra, there lived a young farmer named Toba. He lived alone and worked hard in his fields. In his free time, he went fishing in the river.","One afternoon, he caught a large golden fish. When he got home, the fish suddenly turned into a beautiful woman. She agreed to marry Toba on one condition: he must never tell anyone that she had once been a fish. Toba promised to keep the secret.","A few years later, they had a son named Samosir. Samosir was a healthy boy, but he was often lazy and always hungry. One day, his mother asked him to take lunch to his father in the field. On the way, Samosir felt hungry and ate most of the food.","When Toba saw the empty lunch box, he became very angry. Without thinking, he shouted, \"You are a child of a fish!\" Samosir ran home crying and told his mother.","His wife was heartbroken because Toba had broken his promise. She told Samosir to climb a hill. Then the sky became dark, and heavy rain fell for days. Water came out of the ground and flooded the whole valley. The flood became a huge lake, now called Lake Toba, and the hill where Samosir stood became Samosir Island."],"q":"main|What does the legend mainly explain?|How to catch golden fish;How Lake Toba and Samosir Island were formed;Why farmers work hard;Why children must not be lazy|1|-|Legenda ini menjelaskan asal-usul Danau Toba dan Pulau Samosir.\ndetail|What condition did the woman give before marrying Toba?|He must stop fishing;He must never tell anyone she was once a fish;He must build a house;He must move to another village|1|he must never tell anyone that she had once been a fish|Toba tidak boleh membuka rahasia asal-usul istrinya.\nref|\"<b>She</b> agreed to marry Toba on one condition.\" \"She\" refers to ...|Toba's mother;the woman who had been a fish;Samosir's teacher;a neighbour|1|She agreed to marry Toba on one condition|\"She\" adalah wanita jelmaan ikan.\ninfer|What was the complication in the story?|Toba caught a fish;Samosir was born;Toba broke his promise;Samosir climbed a hill|2|Toba had broken his promise|Puncak konflik terjadi saat Toba melanggar janjinya.\nvocab|\"His wife was <b>heartbroken</b>.\" The closest meaning is ...|very sad;very angry;very hungry;very tired|0|-|Heartbroken = sangat sedih/patah hati.\nseq|What happened right after Samosir ate most of the lunch?|His mother turned into a fish;Toba saw the empty lunch box and got angry;Heavy rain fell;Samosir climbed a hill|1|When Toba saw the empty lunch box, he became very angry|Toba melihat kotak makan kosong lalu marah.\nev|Ketuk kalimat yang menjelaskan asal-usul Pulau Samosir.||-|the hill where Samosir stood became Samosir Island|Bukit tempat Samosir berdiri menjadi Pulau Samosir."},{"title":"Timun Mas","type":"Narrative text (folktale from Central Java)","p":["Long ago, an old widow named Mbok Srini lived alone at the edge of a forest. She wanted a child very much. One night, a giant appeared and gave her a cucumber seed. \"Plant this, and you will have a child,\" he said. \"But when she is seventeen, you must give her back to me.\" Mbok Srini agreed.","She planted the seed, and soon a big golden cucumber grew. Inside it was a baby girl. Mbok Srini named her Timun Mas, which means \"golden cucumber\". Timun Mas grew into a kind and clever girl, and her mother loved her deeply.","When Timun Mas turned seventeen, Mbok Srini was afraid. She asked a wise hermit for help. He gave her four small bags containing cucumber seeds, needles, salt, and shrimp paste.","When the giant came, Timun Mas ran into the forest. Each time the giant came close, she threw one bag behind her. The cucumber seeds became a field of cucumbers, and the giant stopped to eat them. The needles became a forest of bamboo that cut his feet. The salt became a wide sea. Finally, the shrimp paste became a hot, boiling mud lake. The giant sank into it and never came back.","Timun Mas returned home safely, and she and her mother lived happily ever after."],"q":"main|What is the story mainly about?|A giant who loved cucumbers;How Timun Mas escaped from a giant;How to grow cucumbers;A hermit who lived in a forest|1|-|Inti cerita: Timun Mas lolos dari raksasa.\ndetail|What did the giant want in return for the seed?|Gold;Mbok Srini's house;The child when she turned seventeen;Four small bags|2|when she is seventeen, you must give her back to me|Raksasa meminta anak itu saat berumur tujuh belas.\ndetail|Who gave Mbok Srini the four bags?|The giant;Timun Mas;A wise hermit;A neighbour|2|She asked a wise hermit for help|Seorang pertapa bijak.\nseq|Which bag did Timun Mas throw last?|Cucumber seeds;Needles;Salt;Shrimp paste|3|Finally, the shrimp paste became a hot, boiling mud lake|\"Finally\" menunjukkan terasi dilempar terakhir.\ninfer|Why did the giant stop when the cucumbers appeared?|He was tired;He wanted to eat them;He was afraid;He lost his way|1|the giant stopped to eat them|Raksasa berhenti untuk memakan mentimun.\ntfng|Timun Mas had a younger brother.|True;False;Not Given|2|-|Teks tidak menyebut saudara Timun Mas.\nev|Ketuk kalimat yang menunjukkan akhir dari raksasa itu.||-|The giant sank into it and never came back|Raksasa tenggelam di lumpur mendidih."}]},{"id":"r-sma2","lv":"sma","en":"Report Texts","idn":"Teks Laporan (Report)","texts":[{"title":"Orangutans","type":"Report text","p":["Orangutans are great apes that live only in the rainforests of Borneo and Sumatra. Their name comes from the Malay words orang and hutan, which mean \"person of the forest\". Scientists recognise three species: the Bornean, the Sumatran, and the Tapanuli orangutan.","Orangutans have long reddish-brown hair and very long arms. An adult male's arms can stretch more than two metres from hand to hand. Adult males also often have large cheek pads, which make their faces look wide.","Orangutans spend most of their lives in trees. They move from branch to branch and build a new nest of leaves almost every night. Their main food is fruit, such as figs and durian, but they also eat leaves, bark, and insects.","Young orangutans stay with their mothers for about seven or eight years. During this time, they learn which plants are safe to eat and how to build nests. This long childhood is one reason why orangutan populations grow very slowly.","Today, all three species are critically endangered. Forest clearing for plantations, illegal logging, and forest fires are destroying their habitat. Many organisations in Indonesia now work to protect forests and rescue orphaned orangutans."],"q":"main|What is the main purpose of the text?|To tell a story about an orangutan;To give general information about orangutans;To persuade people to keep orangutans as pets;To explain how to build a nest|1|-|Report text memberi informasi umum tentang sesuatu.\ndetail|What does \"orangutan\" mean in Malay?|Red ape;Person of the forest;Long arms;Tree climber|1|which mean \"person of the forest\"|Artinya \"orang hutan\".\nhead|What is the best heading for paragraph 3?|Physical Appearance;Life in the Trees;Threats to Orangutans;Three Species|1|-|Paragraf 3 menjelaskan kehidupan di pohon dan makanannya.\nref|\"During <b>this time</b>, they learn which plants are safe.\" \"This time\" refers to ...|the night;the seven or eight years with their mothers;the fruit season;the forest fires|1|During this time, they learn which plants are safe to eat|Masa tujuh atau delapan tahun bersama induk.\ninfer|Why do orangutan populations grow slowly?|They eat only durian;Young orangutans stay with their mothers for many years;They build nests every night;They live in trees|1|This long childhood is one reason why orangutan populations grow very slowly|Masa kanak-kanak yang panjang.\nvocab|\"All three species are <b>critically endangered</b>.\" This means they are ...|very common;at very high risk of disappearing;protected by law;living in zoos|1|-|Critically endangered = sangat terancam punah.\nev|Ketuk kalimat yang menyebut penyebab rusaknya habitat orangutan.||-|Forest clearing for plantations, illegal logging, and forest fires are destroying their habitat|Pembukaan hutan, pembalakan liar, dan kebakaran hutan."},{"title":"Volcanoes","type":"Report text","p":["A volcano is an opening in the Earth's surface through which hot melted rock, ash, and gases escape. The melted rock is called magma when it is underground and lava when it reaches the surface.","Most volcanoes form along the edges of tectonic plates. Indonesia sits where several plates meet, on part of the Pacific Ring of Fire. As a result, it has more than 120 active volcanoes, more than any other country.","Volcanoes are often grouped by their activity. Active volcanoes have erupted recently or show signs that they may erupt. Dormant volcanoes have not erupted for a long time but could erupt again. Extinct volcanoes are not expected to erupt ever again.","Eruptions can be extremely dangerous. Hot clouds of ash and gas, called pyroclastic flows, can move down a mountain at more than 100 kilometres per hour. The 1883 eruption of Krakatau was so powerful that its sound was heard thousands of kilometres away.","However, volcanoes also bring benefits. Volcanic ash makes soil very fertile, which is why many farms in Java and Bali grow well near volcanoes. Volcanic areas can also produce geothermal energy, a clean source of electricity."],"q":"main|What is the text mainly about?|The eruption of Krakatau;Volcanoes in general;Farming in Java and Bali;Geothermal energy|1|-|Teks membahas gunung api secara umum.\ndetail|What is lava?|Gas from a volcano;Melted rock under the ground;Melted rock that reaches the surface;Ash that falls on farms|2|lava when it reaches the surface|Lava = batuan cair di permukaan.\ndetail|Why does Indonesia have so many volcanoes?|It has many mountains;It is on the Pacific Ring of Fire where plates meet;It has fertile soil;It is near the equator|1|Indonesia sits where several plates meet, on part of the Pacific Ring of Fire|Indonesia berada di pertemuan lempeng (Cincin Api).\nvocab|\"<b>Dormant</b> volcanoes have not erupted for a long time.\" Dormant means ...|sleeping but able to wake;dead forever;very active;under the sea|0|-|Dormant = \"tidur\", bisa meletus lagi.\ntfng|Krakatau erupted again in 1990.|True;False;Not Given|2|-|Teks hanya menyebut letusan 1883.\npurpose|Why does the writer mention farms in Java and Bali?|To show that volcanoes can be useful;To explain how lava moves;To compare two islands;To describe a disaster|0|Volcanic ash makes soil very fertile|Contoh manfaat gunung api: tanah subur.\nev|Ketuk kalimat yang menunjukkan betapa cepatnya awan panas bergerak.||-|can move down a mountain at more than 100 kilometres per hour|Lebih dari 100 km per jam."}]},{"id":"r-sma3","lv":"sma","en":"Exposition & Discussion","idn":"Teks Eksposisi & Diskusi","texts":[{"title":"Every Teenager Should Learn to Cook","type":"Analytical exposition","p":["Many teenagers today depend on instant noodles, fast food, and online delivery apps. In my opinion, every teenager should learn how to cook basic meals. There are at least three reasons for this.","Firstly, cooking is good for health. When we cook our own food, we know exactly what goes into it. We can use less salt, sugar, and oil than restaurants usually do, and we can add more vegetables.","Secondly, cooking saves money. A plate of fried rice from a delivery app can cost three times more than the same dish made at home. Students who live away from their families, such as university students in boarding houses, can save a lot each month.","Thirdly, cooking builds important life skills. It teaches us to plan, to manage time, and to be responsible. Cooking for family or friends is also a way to show care and to build closer relationships.","In conclusion, learning to cook makes teenagers healthier, saves money, and prepares them for independent life. Schools and parents should encourage young people to spend time in the kitchen."],"q":"main|What is the writer's main opinion?|Fast food is cheap;Every teenager should learn to cook;Schools should open restaurants;Delivery apps are useful|1|every teenager should learn how to cook basic meals|Tesis penulis ada di paragraf 1.\ndetail|According to the writer, how is home cooking healthier?|It is faster;We control the salt, sugar, and oil;It uses more oil;It has no vegetables|1|We can use less salt, sugar, and oil than restaurants usually do|Kita bisa mengurangi garam, gula, dan minyak.\ndetail|How much more can delivery fried rice cost?|Twice as much;Three times as much;Four times as much;The same|1|can cost three times more than the same dish made at home|Tiga kali lipat.\nhead|What is the best heading for paragraph 4?|Saving Money;Healthy Food;Learning Life Skills;Fast Food Problems|2|-|Paragraf 4 membahas keterampilan hidup.\npurpose|What is the function of the last paragraph?|To give a new argument;To restate the opinion and give a recommendation;To tell a story;To describe a recipe|1|-|Paragraf penutup (reiteration) menegaskan ulang pendapat dan memberi saran.\ninfer|Which group would probably benefit most from the second argument?|Young children;Students living in boarding houses;Restaurant owners;Professional chefs|1|Students who live away from their families, such as university students in boarding houses, can save a lot each month|Mahasiswa yang tinggal di kos bisa banyak berhemat.\nev|Ketuk kalimat yang menunjukkan bahwa memasak bisa mempererat hubungan.||-|Cooking for family or friends is also a way to show care and to build closer relationships|Memasak untuk keluarga atau teman."},{"title":"Should Schools Ban Smartphones?","type":"Discussion text","p":["Smartphones are now part of almost every student's life. Some schools have decided to ban them during school hours, while others allow them. Which approach is better?","Supporters of a ban argue that phones distract students. Notifications from games and social media can break concentration in class. They also point out that phones can be used for cheating during tests and may lead to cyberbullying among classmates. Without phones, students might talk and play with each other more during breaks.","On the other hand, people who oppose a ban say that smartphones are useful learning tools. Students can look up information, use dictionary apps, watch educational videos, and join online quizzes. Parents also want to contact their children in an emergency. Moreover, learning to use technology responsibly is an important skill that students need for the future.","A middle way is possible. Schools could allow phones only for learning activities, when a teacher gives permission, and ask students to keep them in their bags at other times. Clear rules, together with lessons on digital responsibility, may give the benefits of smartphones while reducing the problems."],"q":"purpose|What is the purpose of the text?|To persuade schools to ban phones;To present arguments for and against banning phones;To explain how smartphones work;To tell a story about cheating|1|-|Discussion text menyajikan dua sisi pendapat.\ndetail|Which is an argument FOR a ban?|Phones help students find information;Phones can distract students in class;Parents need to contact children;Students need digital skills|1|Supporters of a ban argue that phones distract students|Pendukung larangan: ponsel mengganggu konsentrasi.\ndetail|Which is an argument AGAINST a ban?|Phones cause cyberbullying;Phones are used for cheating;Phones can be useful learning tools;Students talk less|2|smartphones are useful learning tools|Penentang larangan: ponsel alat belajar.\nvocab|\"Notifications ... can break <b>concentration</b>.\" Concentration means ...|konsentrasi/fokus;koneksi;komunikasi;kompetisi|0|-|Concentration = fokus.\ninfer|What is the writer's own position?|Phones should be banned completely;Phones should be allowed at all times;Phones can be allowed with clear rules;The writer has no opinion|2|Clear rules, together with lessons on digital responsibility, may give the benefits|Penulis mengusulkan jalan tengah dengan aturan jelas.\nref|\"<b>They</b> also point out that phones can be used for cheating.\" \"They\" refers to ...|teachers;supporters of a ban;parents;notifications|1|They also point out that phones can be used for cheating|\"They\" = pendukung larangan.\nev|Ketuk kalimat yang berisi usulan jalan tengah.||-|Schools could allow phones only for learning activities|Ponsel boleh untuk kegiatan belajar saja."}]},{"id":"r-sma4","lv":"sma","en":"Explanation & News","idn":"Teks Eksplanasi & Berita","texts":[{"title":"How a Tsunami Happens","type":"Explanation text","p":["A tsunami is a series of very large ocean waves. Although people sometimes call them tidal waves, tsunamis have nothing to do with tides.","Most tsunamis are caused by strong earthquakes under the sea. When two tectonic plates suddenly move, the sea floor can rise or drop by several metres. This pushes a huge amount of water up or down, and waves spread out in all directions. Underwater landslides and volcanic eruptions can also cause tsunamis.","In the deep ocean, a tsunami can travel as fast as a jet plane, around 800 kilometres per hour, but its waves may be less than a metre high. Ships at sea often do not notice them. As the waves reach shallow water near the coast, they slow down. The water piles up, and the waves can grow taller than a building.","Sometimes, just before a tsunami arrives, the sea suddenly pulls back from the beach, showing the sea floor. This is a natural warning sign. People should move to high ground immediately instead of going to look.","The 2004 Indian Ocean tsunami, which struck Aceh very hard, showed how important early warning systems and public education are. Today, Indonesia uses sensors and alarms to warn coastal communities as quickly as possible."],"q":"main|What does the text mainly explain?|The history of Aceh;How tsunamis happen and how to stay safe;How tides work;How ships travel|1|-|Teks eksplanasi menjelaskan proses terjadinya tsunami.\ndetail|What is the most common cause of tsunamis?|Strong winds;Tides;Strong earthquakes under the sea;Heavy rain|2|Most tsunamis are caused by strong earthquakes under the sea|Gempa kuat di bawah laut.\ndetail|Why do ships at sea often not notice a tsunami?|The waves are very slow;The waves are low in deep water;Ships move too fast;It happens at night|1|its waves may be less than a metre high|Di laut dalam gelombangnya rendah.\nseq|What happens when tsunami waves reach shallow water?|They speed up and disappear;They slow down and grow taller;They turn into tides;They become colder|1|they slow down|Gelombang melambat dan meninggi.\ninfer|What should you do if the sea suddenly pulls back from the beach?|Walk out to see the sea floor;Take photos;Move to high ground quickly;Wait for a boat|2|People should move to high ground immediately|Segera ke tempat tinggi.\ntfng|Tsunamis are caused by the Moon, like tides.|True;False;Not Given|1|tsunamis have nothing to do with tides|Salah, tsunami tidak berhubungan dengan pasang surut.\nev|Ketuk kalimat yang menyebut tanda peringatan alami tsunami.||-|This is a natural warning sign|Laut tiba-tiba surut adalah tanda alami."},{"title":"Students Turn Plastic Waste into Paving Blocks","type":"News item (contoh berita)","p":["MAKASSAR — A group of high school students in Makassar has found a creative way to deal with plastic waste. The five students have developed paving blocks made from a mixture of melted plastic bags and sand.","The project began six months ago as part of a school science competition. \"We saw so much plastic in the canal near our school,\" said team leader Andi Putri, 17. \"We wanted to turn the problem into something useful.\"","According to the team, each paving block uses about 40 plastic bags. Tests in the school laboratory showed that the blocks are strong enough for footpaths and parking areas. The students have already used 300 blocks to make a new path in the school garden.","The local environment office has shown interest in the project. An official said the city might work with the school to test the blocks in public parks next year. However, the official also said that more tests are needed to make sure the blocks are safe in hot weather.","The team won first place in the provincial competition last week and will represent South Sulawesi at the national level in November."],"q":"main|What is the news mainly about?|A canal in Makassar;Students who make paving blocks from plastic waste;A science teacher;A new park|1|-|Inti berita: siswa membuat paving dari sampah plastik.\ndetail|What are the paving blocks made of?|Glass and cement;Plastic bags and sand;Wood and plastic;Stone and sand|1|made from a mixture of melted plastic bags and sand|Plastik leleh dan pasir.\ndetail|How many plastic bags does one block use?|About 4;About 14;About 40;About 300|2|each paving block uses about 40 plastic bags|Sekitar 40 kantong plastik.\npurpose|Why does the writer include Andi Putri's words?|To explain how the idea started;To describe the weather;To list the prices;To criticise the school|0|We wanted to turn the problem into something useful|Kutipan menjelaskan asal ide.\ninfer|Why are more tests needed according to the official?|The blocks are too expensive;The blocks might not be safe in hot weather;The students are too young;There is not enough plastic|1|more tests are needed to make sure the blocks are safe in hot weather|Perlu diuji ketahanannya di cuaca panas.\ntfng|The team will compete at the national level.|True;False;Not Given|0|will represent South Sulawesi at the national level in November|Benar.\nev|Ketuk kalimat yang menunjukkan paving sudah benar-benar dipakai.||-|The students have already used 300 blocks to make a new path in the school garden|300 paving dipakai di kebun sekolah."}]},{"id":"r-k1","lv":"kuliah","en":"Natural Sciences","idn":"Bacaan Sains Alam (TOEFL Reading)","texts":[{"title":"Coral Bleaching","type":"Academic passage","p":["Coral reefs cover less than one percent of the ocean floor, yet they support roughly a quarter of all known marine species. Indonesia lies at the heart of the Coral Triangle, the region with the highest coral diversity on Earth. These ecosystems, however, are increasingly threatened by a process known as coral bleaching.","Reef-building corals live in a close partnership with microscopic algae called zooxanthellae, which live inside the coral's tissues. Through photosynthesis, the algae supply the coral with most of its energy, and they also give corals their bright colours. In return, the coral provides the algae with shelter and the nutrients they need.","This relationship is highly sensitive to temperature. When sea temperatures rise only about one degree Celsius above the normal summer maximum and stay there for several weeks, the partnership begins to break down. Stressed corals expel the algae, and because the coral tissue is nearly transparent, the white limestone skeleton becomes visible. The coral appears \"bleached\".","Bleached corals are not dead, but they are starving. If temperatures return to normal quickly, the algae can recolonise the coral and it may recover. If the stress continues, the coral is likely to die, and the reef may become covered by seaweed. Repeated bleaching events leave reefs little time to recover between episodes.","Global warming has made mass bleaching events more frequent and more severe. Local pressures such as pollution, destructive fishing, and sediment from land clearing make reefs even less resilient. Scientists therefore argue that protecting reefs requires both global action on emissions and local efforts to reduce other forms of damage."],"q":"main|What is the passage mainly about?|The variety of fish in Indonesia;The causes and effects of coral bleaching;How algae perform photosynthesis;Fishing methods in the Coral Triangle|1|-|Paragraf 2–5 menjelaskan proses, akibat, dan penyebab pemutihan karang.\ndetail|According to paragraph 2, what do zooxanthellae give to corals?|Shelter and nutrients;Energy and colour;Limestone skeletons;Protection from fish|1|the algae supply the coral with most of its energy, and they also give corals their bright colours|Alga memberi energi dan warna.\nvocab|The word \"<b>expel</b>\" in paragraph 3 is closest in meaning to ...|absorb;push out;feed;protect|1|-|Expel = mengeluarkan/mengusir.\ninfer|Why does a bleached coral look white?|It is covered with salt;Its algae have left and the skeleton shows through;It has turned into seaweed;The water has become cloudy|1|the white limestone skeleton becomes visible|Jaringan karang transparan sehingga kerangka putih terlihat.\ntfng|All bleached corals die within a few days.|True;False;Not Given|1|Bleached corals are not dead, but they are starving|Salah: karang bisa pulih jika suhu cepat normal.\nref|The word \"<b>they</b>\" in \"they support roughly a quarter\" refers to ...|marine species;coral reefs;oceans;algae|1|yet they support roughly a quarter of all known marine species|\"They\" = coral reefs.\npurpose|Why does the author mention pollution and destructive fishing?|To show that reefs face local threats as well as warming;To explain how corals feed;To describe fishing in Indonesia;To prove that warming is not important|0|Local pressures such as pollution, destructive fishing, and sediment from land clearing make reefs even less resilient|Menunjukkan ancaman lokal selain pemanasan global.\nev|Ketuk kalimat yang menyebut syarat suhu yang memicu pemutihan karang.||-|rise only about one degree Celsius above the normal summer maximum|Kenaikan sekitar 1°C di atas maksimum musim panas selama beberapa minggu."},{"title":"The Language of Bees","type":"Academic passage","p":["Honeybees live in colonies that may contain tens of thousands of individuals, and the survival of the colony depends on finding enough nectar and pollen. Remarkably, a single forager that discovers a rich source of food can share its location with its nestmates. This form of communication was decoded in the twentieth century by the Austrian scientist Karl von Frisch, who received a Nobel Prize in 1973 for his work.","Von Frisch observed that returning foragers perform movements on the vertical surface of the honeycomb. When food is close to the hive, a bee performs a \"round dance\", moving in small circles. This dance tells other bees that food is nearby but gives little information about direction.","For more distant food sources, the bee performs the \"waggle dance\". It runs forward in a straight line while shaking its body from side to side, then circles back and repeats the movement. The angle of the straight run relative to vertical corresponds to the angle between the food source and the sun. For example, a run straight upward means \"fly toward the sun\". The duration of the waggle run indicates distance: the longer the waggle, the farther away the food.","The dancing bee also carries the scent of the flowers it visited, which helps recruits identify the right plants when they arrive. Later research using robotic bees and radar tracking has confirmed that recruits really do use the information in the dance.","The waggle dance is often cited as one of the most sophisticated examples of symbolic communication among animals, because it represents something—a distant location—that is not present at the moment of communication."],"q":"main|What is the passage mainly about?|The structure of a beehive;How honeybees communicate the location of food;The life of Karl von Frisch;Why bees need pollen|1|-|Seluruh bacaan membahas tarian lebah sebagai komunikasi lokasi makanan.\ndetail|What does the round dance communicate?|The exact direction of food;That food is close to the hive;That danger is near;The distance in kilometres|1|This dance tells other bees that food is nearby|Makanan ada di dekat sarang.\ndetail|In the waggle dance, what indicates distance?|The angle of the run;The speed of circling;The duration of the waggle run;The number of bees watching|2|The duration of the waggle run indicates distance|Lamanya goyangan menunjukkan jarak.\ninfer|If a bee's waggle run points straight downward, the food is probably ...|toward the sun;directly away from the sun;inside the hive;very close|1|a run straight upward means \"fly toward the sun\"|Jika ke atas = menuju matahari, maka ke bawah = membelakangi matahari.\nvocab|The word \"<b>recruits</b>\" in paragraph 4 refers to bees that ...|guard the hive;are newly sent to collect food;make honey;are sick|1|-|Recruits = lebah yang direkrut untuk mencari makanan.\npurpose|Why does the author mention robotic bees and radar tracking?|To show that later studies supported von Frisch's findings;To explain how bees make honey;To describe modern farming;To criticise von Frisch|0|has confirmed that recruits really do use the information in the dance|Penelitian lanjutan membuktikan temuan von Frisch.\ntfng|Von Frisch was the first scientist to keep bees.|True;False;Not Given|2|-|Teks tidak membahas siapa yang pertama memelihara lebah.\nev|Ketuk kalimat yang menjelaskan mengapa tarian lebah disebut komunikasi simbolis.||-|because it represents something—a distant location—that is not present|Tarian mewakili lokasi yang tidak ada di depan mata."}]},{"id":"r-k2","lv":"kuliah","en":"Social Sciences & History","idn":"Bacaan Sosial & Sejarah","texts":[{"title":"The Spice Islands and the World Economy","type":"Academic passage","p":["For centuries, a few small islands in eastern Indonesia shaped the history of global trade. The Banda Islands were once the only source in the world of nutmeg and mace, while cloves grew mainly on the northern Maluku islands of Ternate and Tidore. In Europe, these spices were valued not only for flavouring food but also as medicines and status symbols, and their prices were extremely high.","Before the sixteenth century, spices travelled to Europe through a long chain of Asian, Arab, and Venetian traders, and each intermediary added to the price. European powers therefore sought a direct sea route to the source. The Portuguese reached Maluku in 1512, followed later by the Spanish, the English, and the Dutch.","The Dutch East India Company, or VOC, founded in 1602, became the most powerful of these competitors. Often described as one of the first multinational corporations, it had the right to build forts, sign treaties, and wage war. The VOC aimed to establish a monopoly over the spice trade. In 1621, its forces conquered the Banda Islands, and a large part of the local population was killed or forced to leave.","The struggle over nutmeg even affected the map of North America. Under the Treaty of Breda in 1667, the English recognised Dutch control of the tiny island of Run in Banda, while the Dutch accepted English control of New Amsterdam, which was later renamed New York.","Eventually, nutmeg and clove seedlings were smuggled out and planted in other tropical colonies, and the Dutch monopoly collapsed. The history of the Spice Islands shows how the demand for a luxury product could drive exploration, colonialism, and violence on a global scale."],"q":"main|What is the main idea of the passage?|Nutmeg is used in medicine;The spice trade from Maluku shaped global history;The VOC was a small company;New York was founded by the English|1|-|Bacaan menjelaskan pengaruh perdagangan rempah Maluku terhadap sejarah dunia.\ndetail|Why were spices so expensive in Europe before the sixteenth century?|They were difficult to grow in Europe and passed through many traders;The VOC controlled all trade;The Portuguese taxed them;They were only used by doctors|0|each intermediary added to the price|Rempah melewati banyak perantara yang menaikkan harga.\ndetail|When did the Portuguese reach Maluku?|In 1512;In 1602;In 1621;In 1667|0|The Portuguese reached Maluku in 1512|Tahun 1512.\nvocab|The word \"<b>monopoly</b>\" in paragraph 3 means ...|complete control of a market by one group;a type of ship;a peace agreement;a small island|0|-|Monopoli = penguasaan pasar oleh satu pihak.\ninfer|What can be inferred about the Treaty of Breda?|The English valued Run more than New Amsterdam;Nutmeg was considered extremely valuable at that time;The Dutch lost the war;New York was part of Indonesia|1|the English recognised Dutch control of the tiny island of Run|Pulau kecil penghasil pala ditukar dengan wilayah di Amerika, menunjukkan betapa berharganya pala.\nseq|What eventually ended the Dutch spice monopoly?|The Treaty of Breda;Seedlings were planted in other colonies;The Portuguese arrived;The VOC was founded|1|nutmeg and clove seedlings were smuggled out and planted in other tropical colonies|Bibit diselundupkan dan ditanam di koloni lain.\ntfng|The VOC had the right to wage war.|True;False;Not Given|0|it had the right to build forts, sign treaties, and wage war|Benar.\nev|Ketuk kalimat yang menyebut dampak penaklukan Banda bagi penduduknya.||-|a large part of the local population was killed or forced to leave|Banyak penduduk dibunuh atau diusir."},{"title":"Urbanisation in Southeast Asia","type":"Academic passage","p":["Urbanisation, the movement of people from rural areas to towns and cities, is one of the defining trends of the modern world. According to the United Nations, about 55 percent of the world's population lived in urban areas in 2018, and this share is projected to reach 68 percent by 2050. Much of this growth is taking place in Asia and Africa.","In Southeast Asia, people move to cities mainly for economic reasons. Factories, offices, and services offer higher wages than farming, and cities provide better access to universities and hospitals. Young people in particular are attracted by these opportunities, and many send part of their income back to their families in villages.","Rapid urban growth, however, brings serious challenges. Housing often cannot keep up with demand, so informal settlements develop along rivers and railway lines. Traffic congestion wastes time and fuel, while air pollution harms public health. In Jakarta, heavy use of groundwater has caused parts of the city to sink, which makes flooding worse.","Governments have responded in different ways. Many cities have invested in mass transit, such as the MRT and LRT systems in Jakarta, Bangkok, and Manila. Indonesia has also begun building a new capital, Nusantara, in East Kalimantan, partly to reduce pressure on Jakarta. Critics, however, warn that such projects are expensive and may damage forests.","Urban planners increasingly argue that the goal should not be to stop urbanisation, which is largely driven by economic forces, but to manage it. Affordable housing, reliable public transport, green spaces, and careful water management can help cities become places where growth improves, rather than reduces, the quality of life."],"q":"main|What is the passage mainly about?|The history of Jakarta;Causes, problems, and responses to urbanisation in Southeast Asia;How to build an MRT system;Farming in rural Asia|1|-|Bacaan membahas penyebab, masalah, dan respons terhadap urbanisasi.\ndetail|According to the UN, what share of people will live in urban areas by 2050?|55 percent;60 percent;68 percent;75 percent|2|this share is projected to reach 68 percent by 2050|68 persen.\ndetail|What is the main reason people move to cities in Southeast Asia?|Better weather;Economic opportunities;Cheaper housing;Less traffic|1|people move to cities mainly for economic reasons|Alasan ekonomi.\ninfer|What does the passage suggest about land subsidence in Jakarta?|It is caused by earthquakes;It is linked to heavy groundwater use;It has stopped completely;It only affects new buildings|1|heavy use of groundwater has caused parts of the city to sink|Penggunaan air tanah berlebihan.\nvocab|The phrase \"<b>keep up with</b>\" in paragraph 3 is closest in meaning to ...|grow as fast as;stay away from;slow down;replace|0|-|Keep up with = mengimbangi.\npurpose|Why does the author mention critics of the new capital?|To present a different view of the project;To prove the project will fail;To describe East Kalimantan's forests in detail;To explain the MRT|0|Critics, however, warn that such projects are expensive and may damage forests|Menyajikan pandangan yang berbeda.\ntfng|Bangkok has stopped people from moving to the city.|True;False;Not Given|2|-|Teks tidak menyebut kebijakan seperti itu di Bangkok.\nev|Ketuk kalimat yang memuat pendapat para perencana kota tentang tujuan kebijakan.||-|the goal should not be to stop urbanisation|Tujuannya mengelola, bukan menghentikan urbanisasi."}]},{"id":"r-k3","lv":"kuliah","en":"Academic Argument (IELTS)","idn":"Bacaan Argumentatif (IELTS)","texts":[{"title":"Is Earlier Always Better? Children and Second Languages","type":"Academic passage","p":["It is widely believed that children learn foreign languages more easily than adults. Many parents therefore enrol their children in English classes at kindergarten age, and some countries have moved foreign-language instruction into the early years of primary school. Yet research suggests that the relationship between age and language learning is more complex than the popular saying \"the younger, the better\" implies.","The idea that there is a limited window for language acquisition is known as the Critical Period Hypothesis. Its supporters point to strong evidence about pronunciation: people who begin learning a second language in early childhood, especially through living in a country where it is spoken, are far more likely to develop a native-like accent than those who begin as adults.","However, studies in classroom settings show a different pattern. When older children and adults start learning at the same time as younger children, the older learners often make faster progress at first, particularly in grammar and vocabulary. They can use their knowledge of their first language, apply learning strategies, and understand explicit explanations.","The key difference may be the amount and quality of exposure. Young children who move to a new country hear the language for many hours every day, in meaningful situations. By contrast, a child who receives two hours of English lessons per week may not benefit much from starting early, especially if the teaching quality is low.","Most researchers now conclude that age is only one factor among many. Motivation, the amount of meaningful input, opportunities to communicate, and good teaching all play crucial roles. For policymakers, the lesson is that starting early is not a substitute for providing enough high-quality instruction."],"q":"main|What is the main point of the passage?|Children always learn languages better than adults;The effect of age on language learning is more complex than commonly believed;Adults cannot develop a good accent;English should be taught in kindergarten|1|-|Penulis menegaskan bahwa hubungan usia dan belajar bahasa itu kompleks.\ndetail|What evidence supports the Critical Period Hypothesis?|Adults learn grammar faster;Early learners are more likely to develop a native-like accent;Older children are more motivated;Classroom studies show no difference|1|are far more likely to develop a native-like accent|Bukti terkuat ada pada pelafalan.\ndetail|Why do older learners often progress faster at first in classrooms?|They have more free time;They can use first-language knowledge and learning strategies;They have better accents;They study abroad|1|They can use their knowledge of their first language, apply learning strategies, and understand explicit explanations|Mereka bisa memakai pengetahuan dan strategi belajar.\nvocab|The word \"<b>exposure</b>\" in paragraph 4 is closest in meaning to ...|contact with the language;fear of the language;a type of test;a teaching method|0|-|Exposure = paparan/kontak dengan bahasa.\ninfer|Which situation would the author probably consider LEAST effective?|A child living abroad and using the language daily;Adults in a well-taught intensive course;A young child with two hours of weak lessons a week;A teenager with many chances to communicate|2|a child who receives two hours of English lessons per week may not benefit much|Paparan sedikit dan pengajaran lemah.\npurpose|What is the function of the final paragraph?|To introduce a new study;To summarise the conclusion and give a recommendation;To tell a personal story;To describe the Critical Period Hypothesis|1|-|Paragraf terakhir menyimpulkan dan memberi pelajaran bagi pembuat kebijakan.\ntfng|The author believes that age has no effect on language learning.|True;False;Not Given|1|age is only one factor among many|Salah: usia tetap salah satu faktor.\nev|Ketuk kalimat yang memuat pesan untuk pembuat kebijakan.||-|starting early is not a substitute for providing enough high-quality instruction|Mulai dini bukan pengganti pengajaran yang cukup dan berkualitas."},{"title":"The Four-Day School Week","type":"Academic passage","p":["In a growing number of school districts in the United States, students attend classes only four days a week. Hundreds of districts, most of them in rural areas, have adopted this schedule, usually by making each of the four school days longer. The trend has prompted debate about whether a shorter week helps or harms students.","The most common reason for the change is financial. Districts hope to save money on transport, heating, and support staff. In practice, however, the savings are often modest, typically only a small percentage of a district's budget, because teachers' salaries make up the largest share of costs and usually remain unchanged.","A second motivation is recruitment. Rural districts often struggle to attract and keep teachers, and a four-day week is seen as an attractive benefit. Surveys suggest that many teachers and families like the schedule, and some schools report better attendance because medical appointments and family activities can be arranged on the free day.","The evidence on learning is more mixed. Several studies have found small negative effects on test scores, especially in mathematics and reading, and the effects may be larger when the free day is not used for structured activities. Researchers also raise concerns about younger children, who may find longer days tiring, and about families who must find childcare on the fifth day.","Overall, the four-day week appears to offer benefits for staff morale and family flexibility, while carrying potential risks for academic achievement. Its success seems to depend heavily on how schools use the remaining time and on what support is available to students on the day off."],"q":"main|What does the passage mainly discuss?|How to save money in schools;The advantages and disadvantages of the four-day school week;Teacher salaries in the United States;Rural childcare problems|1|-|Bacaan membahas manfaat dan risiko pekan sekolah empat hari.\ndetail|Why are the financial savings often small?|Buses are expensive;Teachers' salaries usually stay the same;Schools must pay for childcare;Heating costs increase|1|teachers' salaries make up the largest share of costs and usually remain unchanged|Gaji guru (porsi terbesar) tidak berubah.\ndetail|How does the schedule help with recruitment?|It increases salaries;Teachers see it as an attractive benefit;It reduces class sizes;It provides free housing|1|a four-day week is seen as an attractive benefit|Dianggap sebagai keuntungan yang menarik.\nvocab|The word \"<b>modest</b>\" in paragraph 2 is closest in meaning to ...|large;small;surprising;dishonest|1|-|Modest di sini berarti kecil/tidak besar.\ninfer|According to paragraph 4, when might negative effects on learning be larger?|When teachers are young;When the free day is not used for structured activities;When schools are in cities;When students like the schedule|1|the effects may be larger when the free day is not used for structured activities|Jika hari libur tidak diisi kegiatan terstruktur.\ntfng|Most four-day school districts are in large cities.|True;False;Not Given|1|most of them in rural areas|Salah, kebanyakan di daerah pedesaan.\npurpose|Why does the author mention medical appointments?|To explain why attendance may improve;To criticise doctors;To show that students are often ill;To describe a study on health|0|some schools report better attendance because medical appointments and family activities can be arranged on the free day|Menjelaskan mengapa kehadiran bisa membaik.\nev|Ketuk kalimat yang menunjukkan bahwa keberhasilan sistem ini bergantung pada pemakaian waktu.||-|Its success seems to depend heavily on how schools use the remaining time|Keberhasilannya bergantung pada cara sekolah memakai waktu."}]},{"id":"r-k4","lv":"kuliah","en":"Humanities & Learning Science","idn":"Bacaan Humaniora & Ilmu Belajar","texts":[{"title":"The Origins of Writing","type":"Academic passage","p":["Writing is so central to modern life that it is easy to forget it is a relatively recent invention. Humans have spoken languages for tens of thousands of years, but the earliest true writing appeared only around 3200 BCE, in Mesopotamia, the region between the Tigris and Euphrates rivers in present-day Iraq.","Interestingly, the first writing was not used to record poetry or history but to keep accounts. Sumerian temple officials needed to track goods such as grain, sheep, and beer. Some scholars believe that small clay tokens used for counting gradually developed into signs pressed into clay tablets. Over time, these signs became the wedge-shaped script now called cuneiform.","Early cuneiform signs were largely pictographic: a drawing of an ear of barley meant barley. Such a system, however, requires a vast number of signs and cannot easily express names or abstract ideas. Scribes therefore began to use signs for their sound value. This rebus principle allowed writers to spell words that were difficult to draw, and it was a crucial step toward representing spoken language fully.","Writing appears to have been invented independently in at least three other places: Egypt, where hieroglyphs emerged at about the same time as cuneiform; China, where inscriptions on oracle bones date from around 1200 BCE; and Mesoamerica, where several scripts developed later. The alphabet, by contrast, seems to have been invented only once. A Semitic alphabet used by the Phoenicians spread around the Mediterranean and was adapted by the Greeks, who added letters for vowels. Most alphabets used today, including the Latin alphabet, descend from it.","Because writing made it possible to store information outside human memory, many historians regard it as one of the foundations of complex states, long-distance trade, written law, and, eventually, science."],"q":"main|What is the passage mainly about?|The life of Sumerian scribes;The origin and early development of writing;The Greek language;Trade in Mesopotamia|1|-|Bacaan menjelaskan asal-usul dan perkembangan awal tulisan.\ndetail|What was the earliest writing mainly used for?|Recording poetry;Keeping accounts of goods;Writing laws;Telling history|1|the first writing was not used to record poetry or history but to keep accounts|Untuk pencatatan barang.\nvocab|The word \"<b>crucial</b>\" in paragraph 3 is closest in meaning to ...|very important;very difficult;unexpected;temporary|0|-|Crucial = sangat penting.\ninfer|Why did scribes start using signs for their sound value?|Clay became expensive;Pictures could not easily express names or abstract ideas;The Greeks asked them to;They wanted to write faster|1|cannot easily express names or abstract ideas|Gambar sulit mengungkapkan nama dan ide abstrak.\ndetail|What did the Greeks add to the Phoenician alphabet?|Pictures;Numbers;Letters for vowels;Wedge-shaped signs|2|who added letters for vowels|Huruf vokal.\ntfng|The alphabet was invented independently in several places.|True;False;Not Given|1|The alphabet, by contrast, seems to have been invented only once|Salah, alfabet tampaknya ditemukan hanya sekali.\nref|The word \"<b>it</b>\" in \"Most alphabets used today ... descend from it\" refers to ...|the Latin alphabet;the Phoenician (Semitic) alphabet;cuneiform;Chinese writing|1|including the Latin alphabet, descend from it|\"It\" = alfabet Semit/Fenisia.\nev|Ketuk kalimat yang menjelaskan mengapa tulisan dianggap fondasi negara yang kompleks.||-|Because writing made it possible to store information outside human memory|Tulisan memungkinkan informasi disimpan di luar ingatan."},{"title":"Sleep and Learning","type":"Academic passage","p":["Students preparing for examinations often sacrifice sleep in order to study longer. Research in neuroscience and psychology, however, suggests that this strategy may be counterproductive. Sleep is not simply a period of rest; it plays an active role in turning new experiences into lasting memories.","Memory researchers commonly distinguish three stages: encoding, when information is first taken in; consolidation, when it is stabilised and strengthened; and retrieval, when it is recalled later. Sleep appears to be especially important for consolidation. During deep, slow-wave sleep, the brain seems to replay patterns of activity that occurred during learning, and information is gradually transferred from the hippocampus, a short-term store, to the cortex for long-term storage.","Experimental studies support this view. In a typical design, participants learn a list of word pairs or a motor task and are then tested after a period of either sleep or wakefulness of the same length. Those who sleep usually remember more than those who stay awake. Sleep before learning also matters: people who are sleep-deprived tend to encode new information less effectively, as if the brain's capacity to take in new memories has been reduced.","Different stages of sleep may contribute in different ways. Slow-wave sleep has been linked mainly to memory for facts and events, whereas REM sleep, the stage most associated with vivid dreaming, may help with emotional memories and with finding creative connections between ideas. These findings are still being refined, and researchers caution against oversimplified claims.","For students, the practical implications are nevertheless clear. Spreading study sessions over several days and protecting a regular night's sleep is likely to produce better results than a single all-night session before an exam."],"q":"main|What is the main idea of the passage?|Students should study all night before exams;Sleep plays an important role in learning and memory;Dreams are always about emotions;The hippocampus is a long-term store|1|-|Gagasan utama: tidur berperan penting dalam belajar dan ingatan.\ndetail|According to the passage, which stage of memory is sleep especially important for?|Encoding;Consolidation;Retrieval;Forgetting|1|Sleep appears to be especially important for consolidation|Konsolidasi.\ndetail|Where is information transferred to for long-term storage?|The hippocampus;The cortex;The heart;The eyes|1|transferred from the hippocampus, a short-term store, to the cortex for long-term storage|Ke korteks.\nvocab|The word \"<b>counterproductive</b>\" in paragraph 1 means ...|having the opposite of the intended effect;very productive;expensive;easy to do|0|-|Counterproductive = justru merugikan tujuan.\ninfer|What happens to sleep-deprived people before learning?|They remember more;They encode new information less effectively;They dream more;They need fewer study sessions|1|people who are sleep-deprived tend to encode new information less effectively|Mereka kurang efektif menyerap informasi baru.\npurpose|Why does the author say \"researchers caution against oversimplified claims\"?|To show the findings about sleep stages are not yet final;To reject all sleep research;To criticise students;To introduce a new experiment|0|These findings are still being refined|Temuan tentang tahap tidur masih disempurnakan.\ntfng|REM sleep is the stage most associated with vivid dreaming.|True;False;Not Given|0|REM sleep, the stage most associated with vivid dreaming|Benar.\nev|Ketuk kalimat yang berisi saran praktis untuk mahasiswa.||-|Spreading study sessions over several days and protecting a regular night's sleep|Menyebar sesi belajar dan menjaga tidur teratur."}]}];
