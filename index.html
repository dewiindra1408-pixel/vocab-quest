<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: single centered column; screens swap (peta → wilayah → unit → babak → hasil). */
  --bg:#EDF0F7; --surface:#FFFFFF; --ink:#141B2E; --muted:#5B6479;
  --accent:#2B4BDB; --accent-ink:#FFFFFF; --hi:#FFC83D; --good:#17895B; --bad:#C8423B;
  --line:#D6DBE8; --soft:#E3E8F5;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1424; --surface:#182036; --ink:#E9EDF7; --muted:#9AA3B8;
    --accent:#7D93FF; --accent-ink:#0F1424; --hi:#FFC83D; --good:#3CC48A; --bad:#F07068;
    --line:#2A3450; --soft:#202a45; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1424; --surface:#182036; --ink:#E9EDF7; --muted:#9AA3B8;
  --accent:#7D93FF; --accent-ink:#0F1424; --hi:#FFC83D; --good:#3CC48A; --bad:#F07068;
  --line:#2A3450; --soft:#202a45; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.hidden{display:none !important}
.muted{color:var(--muted)}
.small{font-size:.88rem}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.brand h1 span{background:var(--hi);color:#141B2E;padding:0 .2em;border-radius:6px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:11px 20px;font-family:var(--display);font-weight:700;font-size:1rem;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:.92rem}
.tag{font-size:.78rem;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--muted);font-weight:700}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* map */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.region{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:120px;position:relative}
.region .emo{font-size:1.8rem;line-height:1}
.region strong{font-family:var(--display);font-size:1.05rem}
.region.open{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.region.locked{opacity:.55;cursor:not-allowed}
.region .badge{position:absolute;top:10px;right:10px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side .panel{gap:10px}

/* units */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.unit{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.unit .num{font-family:var(--display);font-weight:800;font-size:.85rem;color:var(--muted)}
.unit strong{font-family:var(--display);font-size:1.1rem}
.unit .stars{letter-spacing:2px;color:var(--hi);font-size:1.1rem}
.stars .off{color:var(--line)!important}
.unit.locked{opacity:.5;cursor:not-allowed}
.unit:not(.locked):hover{border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* learn */
.catblock{display:flex;flex-direction:column;gap:8px}
.catblock h3{font-size:1rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:96px}
.card .emo{font-size:1.6rem;line-height:1.1;min-height:1.8rem}
.card .noemo{font-family:var(--display);font-weight:800;color:var(--muted);font-size:1.1rem;min-height:1.8rem}
.card b{font-family:var(--display);font-size:1.05rem}
.card span{font-size:.85rem;color:var(--muted)}
.card:hover{border-color:var(--accent)}

/* play */
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.stat strong{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qhead h2{font-size:1.25rem}
.instr{color:var(--muted)}
.lvcard{min-height:190px}.lvcard.current{outline:4px solid var(--hi)}
body.lv-sd{font-size:1.08rem}
body.lv-sd .opt{min-height:62px;font-size:1.12rem}
body.lv-sd .prompt .emo,body.lv-sd .card .emo{font-size:2.6rem}
body.lv-sd .btn{font-size:1.08rem;padding:12px 22px}
.bigword{font-size:1.8rem;font-weight:800;letter-spacing:.01em}
.flash-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.flash-card{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--accent);border-radius:14px;padding:14px;text-align:center}
.flash-card .emo{font-size:1.8rem}
.tok.letter{min-width:2.4em;font-size:1.2rem;font-weight:800;text-transform:lowercase}
.howlist{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.howlist li::marker{color:var(--accent)}
.memo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.memo-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;color:var(--ink);font:inherit}
.memo-card .emo{font-size:1.8rem}.memo-card.done{cursor:default;border-color:var(--accent)}
.memo-hint{font-family:ui-monospace,Menlo,monospace;font-size:1.3rem;letter-spacing:.08em;margin:6px 0}
.buildline{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;border-bottom:3px solid var(--accent);padding:6px 2px;align-items:center}
.buildline button{border:1px solid var(--accent);background:var(--soft);border-radius:8px;padding:4px 10px;font-weight:700;color:var(--ink);font:inherit;font-weight:700}
.buildline button.key,.tok.key{background:var(--hi);color:#141B2E;border-color:#141B2E}
.blitz-time{font-family:var(--display,inherit);font-size:2.4rem;font-weight:800;color:var(--accent)}
.blitz-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-size:1.5rem;padding:22px;border:2px dashed var(--line);border-radius:16px;text-align:center}
.blitz-card .emo{font-size:2rem}.blitz-mean{color:var(--accent);font-weight:700}
.flash-ok{animation:fok .35s}.flash-no{animation:fno .35s}
@keyframes fok{from{background:rgba(59,165,92,.25)}to{background:transparent}}
@keyframes fno{from{background:rgba(214,69,69,.25)}to{background:transparent}}
.instr i{font-style:normal;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;display:block;color:var(--muted);opacity:.85}
.example{border:2px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:.95rem}
.example b{font-family:var(--display)}
.prompt{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--display);font-weight:700;font-size:1.5rem}
.prompt .emo{font-size:3.4rem;line-height:1}
.prompt .cue-txt{font-size:1.4rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:center;min-height:56px;font-size:1.05rem}
.opt kbd{font-family:var(--display);font-size:.78rem;background:var(--soft);border-radius:6px;padding:1px 7px;color:var(--muted);flex:none}
.opt .emo{font-size:1.8rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;border:2px solid;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.fb.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.fb.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.fb b{font-family:var(--display)}
.fb.ok .v{color:var(--good)} .fb.no .v{color:var(--bad)}
.letters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.letters .fixed,.letters input{width:42px;height:50px;border-radius:10px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.35rem;text-transform:lowercase}
.letters .fixed{display:grid;place-items:center;background:var(--soft)}
.letters .gap{width:16px}
.letters input{border:2px solid var(--accent);background:var(--surface);color:var(--ink)}
.letters input.bad{border-color:var(--bad)} .letters input.good{border-color:var(--good)}
.typed{font-family:var(--display);font-size:1.3rem;padding:10px 14px;border-radius:12px;border:2px solid var(--accent);background:var(--surface);color:var(--ink);width:100%;max-width:360px}
.misspelt{font-family:var(--display);font-weight:800;font-size:2rem;text-decoration:underline wavy var(--bad);text-underline-offset:6px}

/* sort */
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.chip[aria-pressed="true"]{background:var(--hi);color:#141B2E}
.chip.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.bucket{border:2px dashed var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:120px;background:var(--surface)}
.bucket.ready{border-color:var(--accent);border-style:solid}
.bucket h3{font-size:.98rem}
.bucket .placed{display:flex;flex-wrap:wrap;gap:6px}
.bucket .placed span{background:color-mix(in srgb,var(--good) 15%,var(--surface));border:1px solid var(--good);border-radius:999px;padding:2px 10px;font-size:.9rem}
.bucket .placed span.ex{border-style:dashed}

/* search */
.search-wrap{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.grid{display:grid;gap:3px;user-select:none;touch-action:manipulation}
.cell{width:34px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700;font-size:1.05rem;text-transform:uppercase;padding:0}
.cell.sel{background:var(--hi);color:#141B2E;border-color:var(--hi)}
.cell.found{background:color-mix(in srgb,var(--good) 25%,var(--surface));border-color:var(--good)}
.cell.ex{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.cell.flash{background:color-mix(in srgb,var(--bad) 25%,var(--surface))}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.clues li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.clues li .emo{font-size:1.5rem;width:1.8rem;text-align:center}
.clues li.done{border-color:var(--good)}
.clues li.done b{color:var(--good)}
.clues li.miss b{color:var(--bad)}

/* result */
.bigstars{font-size:2.6rem;letter-spacing:6px;color:var(--hi)}
.bigstars .off{color:var(--line)}
.miss-list{display:flex;flex-wrap:wrap;gap:8px}
.miss-list .chip{box-shadow:none;font-weight:400;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;text-align:left}
.miss-list b{font-family:var(--display)}
select{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
footer{color:var(--muted);font-size:.82rem;text-align:center}
.explist{display:flex;flex-direction:column;gap:8px}
.exprow{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;text-align:left;display:grid;grid-template-columns:minmax(150px,1fr) 2fr;gap:4px 14px}
.exprow:hover{border-color:var(--accent)}
.exprow b{font-family:var(--display);font-size:1.05rem}
.exprow .m{color:var(--muted);font-size:.88rem}
.exprow .s{font-size:.92rem}
.exprow mark,.sent mark,.fb mark{background:var(--hi);color:#141B2E;border-radius:4px;padding:0 3px}
.defn{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.35;margin:0}
.sent{font-size:1.3rem;line-height:1.7}
.sent .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);margin:0 4px}
.sent u{text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px;font-weight:700}
.xopt{border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:2px 10px;font-weight:700;margin:2px}
.xopt.struck{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--bad);opacity:.7}
.xopt.keep{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.build{display:inline-flex;flex-wrap:wrap;gap:6px;min-width:120px;min-height:40px;border-bottom:3px solid var(--accent);padding:2px 4px;vertical-align:middle}
.build button{border:1px solid var(--accent);background:var(--soft);border-radius:8px;padding:2px 10px;font-weight:700}
.toks{display:flex;flex-wrap:wrap;gap:8px}
.tok{border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:6px 14px;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.tok:disabled{opacity:.2;box-shadow:none}
.matchgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;align-items:start}
.mcol{display:flex;flex-direction:column;gap:8px}
.mitem{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left}
.mitem[aria-pressed="true"]{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 22%,var(--surface))}
.mitem.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface));cursor:default}
.mitem .n{font-family:var(--display);font-weight:800;color:var(--good);margin-right:6px}
.note{border-left:4px solid var(--hi);padding:6px 12px;background:var(--soft);border-radius:6px;font-size:.92rem}


.xwrap{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.xscroll{overflow-x:auto;max-width:100%}
.xgrid{display:grid;gap:2px;--xc:34px}
.xcell{position:relative;width:var(--xc);height:var(--xc)}
.xcell input{width:100%;height:100%;border:2px solid var(--ink);border-radius:4px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.05rem;text-transform:uppercase;background:var(--surface);color:var(--ink);padding:0}
.xcell input.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.xcell input.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.xn{position:absolute;top:1px;left:3px;font-size:.6rem;font-weight:700;pointer-events:none;color:var(--muted)}
.xblank{width:var(--xc);height:var(--xc)}
.xclues h3{font-size:.95rem;margin:4px 0}
.xclues li{cursor:pointer}
.xclues li b:first-child{font-family:var(--display);min-width:1.4em}
.chainrow{display:flex;flex-wrap:wrap;gap:3px}

.labelwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.dg{width:100%;height:auto;max-height:440px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.dg .f{fill:var(--soft);stroke:var(--ink);stroke-width:2}
.dg .l{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dg .k,.dg .t{fill:var(--ink)}
.dg .g{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dg .lo{stroke:var(--ink);stroke-width:20;stroke-linecap:round}
.dg .li{stroke:var(--soft);stroke-width:16;stroke-linecap:round}
.dg .c{fill:var(--hi);opacity:.35}
.dg .fr{fill:none;stroke:var(--accent);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.dg .w{stroke-width:6}
.dg .ch{fill:none;stroke:var(--muted);stroke-width:3;stroke-dasharray:4 3}
.dg .rf{fill:var(--bad)}
.dg .hl{fill:var(--hi);stroke:var(--ink);stroke-width:2}
.dg .ind{fill:#F29F2B}
.dg .dash{stroke-dasharray:6 4}
.dg .gr{fill:color-mix(in srgb,var(--good) 16%,var(--surface))}
.dg .tree{fill:var(--good)}
.dg .trunk{fill:var(--muted)}
.dg .thin{stroke-width:1.2}
.dg .cord{fill:none;stroke:var(--ink);stroke-width:3}
.dg .pad{fill:var(--line)}
.dg .mk{cursor:pointer;outline:none}
.dg .mk circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.dg .mk text{fill:var(--accent-ink);font:700 13px var(--display);pointer-events:none}
.dg .mk.ready circle{fill:var(--hi);stroke:var(--ink)}
.dg .mk.ready text{fill:#141B2E}
.dg .mk.ok circle{fill:var(--good)}
.dg .mk:focus-visible circle{stroke:var(--hi);stroke-width:4}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.legend li{display:flex;gap:8px;align-items:baseline;border-bottom:1px dashed var(--line);padding:3px 0}
.legend li b{font-family:var(--display);min-width:1.4em}
.legend li.done{color:var(--good)}
@media (max-width:620px){
  .labelwrap{grid-template-columns:1fr}
  .xwrap{grid-template-columns:1fr}
  .xgrid{--xc:27px}
  .xcell input{font-size:.9rem}
  .exprow{grid-template-columns:1fr}
  .matchgrid{grid-template-columns:1fr}
  .side{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .search-wrap{grid-template-columns:1fr}
  .cell{width:29px;height:29px;font-size:.92rem}
  .letters .fixed,.letters input{width:34px;height:44px;font-size:1.15rem}
  .prompt .emo{font-size:2.8rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
.ico{width:1.15em;height:1.15em;vertical-align:-0.15em;fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}.ico .f{fill:var(--soft)}.ico .k{fill:var(--ink);stroke:none}.ico .t{stroke-width:1.4}.ico .w{stroke-width:4}.ico .fl{fill:#F2C14E}

const GRAM=[{"id":"g-sd1","lv":"sd","en":"This, That, These, Those","idn":"Ini & Itu","rule":{"points":["<b>This</b> = ini (dekat, satu benda)","<b>That</b> = itu (jauh, satu benda)","<b>These</b> = ini (dekat, banyak benda)","<b>Those</b> = itu (jauh, banyak benda)"],"formula":["This / That + is + a + benda","These / Those + are + benda-s"],"examples":[["This is a book.","Ini sebuah buku."],["Those are birds.","Itu burung-burung."]],"trap":"Untuk banyak benda, pakai <b>are</b>, bukan is: These <b>are</b> pens."},"items":"mc|___ is my bag. (dekat, satu)|This;These;Those;They|0|Satu benda yang dekat memakai \"This\".\nmc|___ are my shoes. (dekat, banyak)|This;That;These;It|2|Banyak benda yang dekat memakai \"These\".\nmc|___ is a plane in the sky. (jauh, satu)|These;That;Those;They|1|Satu benda yang jauh memakai \"That\".\nmc|___ are stars in the sky. (jauh, banyak)|This;That;Those;It|2|Banyak benda yang jauh memakai \"Those\".\nmc|This ___ a cat.|is;are;am;be|0|\"This\" untuk satu benda, jadi memakai \"is\".\nmc|These ___ my books.|is;am;are;be|2|\"These\" untuk banyak benda, jadi memakai \"are\".\nmc|That is ___ apple.|a;an;the;two|1|\"Apple\" diawali bunyi vokal, jadi memakai \"an\".\nmc|Those are my ___.|friend;friends;a friend;friendes|1|Setelah \"Those are\", bendanya jamak: friends.\nmc|Is ___ your pencil? Yes, it is.|these;those;this;they|2|Pertanyaan untuk satu benda dekat: \"Is this...?\"\nmc|Are ___ your socks? Yes, they are.|this;that;these;it|2|Jawaban \"they are\" berarti banyak benda: these.\nord|This is my new bag.\nord|Those are big trees.\nord|Is that your house?\nord|These are my friends."},{"id":"g-sd2","lv":"sd","en":"I am, You are, He is","idn":"Aku, Kamu, Dia (to be)","rule":{"points":["<b>I</b> → am","<b>You, We, They</b> → are","<b>He, She, It</b> → is","Dipakai untuk menyebut nama, umur, perasaan, dan keadaan"],"formula":["I am happy.","She is a teacher.","They are students."],"examples":[["I am ten years old.","Aku berumur sepuluh tahun."],["He is hungry.","Dia lapar."]],"trap":"Jangan lupa to be: She <b>is</b> happy, bukan \"She happy\"."},"items":"mc|I ___ a student.|is;am;are;be|1|\"I\" selalu memakai \"am\".\nmc|She ___ my sister.|am;are;is;be|2|\"She\" memakai \"is\".\nmc|They ___ in the garden.|is;am;are;be|2|\"They\" memakai \"are\".\nmc|We ___ happy today.|is;are;am;be|1|\"We\" memakai \"are\".\nmc|My cat ___ black.|are;am;is;be|2|\"My cat\" = it, jadi memakai \"is\".\nmc|You ___ my best friend.|am;is;are;be|2|\"You\" memakai \"are\".\nmc|___ is a doctor. (Ayahku)|He;She;They;I|0|Ayah = laki-laki, jadi \"He\".\nmc|___ are my parents.|He;She;It;They|3|Orang tua = banyak orang, jadi \"They\".\nmc|Rina and Budi ___ friends.|is;am;are;be|2|Dua orang = they, jadi \"are\".\nmc|___ you hungry? Yes, I am.|Is;Am;Are;Do|2|Pertanyaan untuk \"you\" memakai \"Are\".\nord|I am ten years old.\nord|She is my teacher.\nord|They are very happy.\nord|Are you tired?"},{"id":"g-sd3","lv":"sd","en":"One and Many (Plurals)","idn":"Satu & Banyak (Jamak)","rule":{"points":["Banyak benda: tambahkan <b>-s</b>: cat → cats","Akhiran s, sh, ch, x, o: tambahkan <b>-es</b>: box → boxes","Akhiran konsonan + y: ganti jadi <b>-ies</b>: baby → babies","Ada kata khusus: child → children, foot → feet, tooth → teeth, man → men"],"formula":["one + benda","two/three/many + benda-s"],"examples":[["I have two cats.","Aku punya dua kucing."],["There are three boxes.","Ada tiga kotak."]],"trap":"Setelah angka lebih dari satu, benda harus jamak: two <b>apples</b>."},"items":"mc|I have two ___.|cat;cats;cates;caties|1|Lebih dari satu: tambah -s.\nmc|There are three ___ on the table.|box;boxs;boxes;boxies|2|Akhiran -x ditambah -es.\nmc|Look at the ___! They are sleeping.|baby;babys;babies;babyes|2|Konsonan + y menjadi -ies.\nmc|My grandmother has five ___.|child;childs;children;childrens|2|Bentuk jamak \"child\" adalah \"children\".\nmc|I brush my ___ every morning.|tooth;tooths;teeth;teeths|2|Bentuk jamak \"tooth\" adalah \"teeth\".\nmc|She has one ___.|brother;brothers;brotheres;brotheries|0|Satu orang: tanpa -s.\nmc|We need four ___.|chair;chairs;chaires;chairies|1|Empat kursi: chairs.\nmc|There are many ___ in the zoo.|animal;animals;animales;animalies|1|Many + jamak: animals.\nmc|I have ten ___ and ten toes.|finger;fingers;fingeres;fingeries|1|Ten fingers.\nmc|The farmer has two ___.|bus;buss;buses;busies|2|Akhiran -s ditambah -es: buses.\nord|I have three red balloons.\nord|There are two dogs in the park.\nord|My sister has five dolls."},{"id":"g-sd4","lv":"sd","en":"There is, There are","idn":"Ada (There is/are)","rule":{"points":["<b>There is</b> = ada (satu benda)","<b>There are</b> = ada (banyak benda)","Pertanyaan: <b>Is there</b> ...? / <b>Are there</b> ...?"],"formula":["There is + a/an + benda","There are + angka/many + benda-s"],"examples":[["There is a cat under the table.","Ada seekor kucing di bawah meja."],["There are two books on my desk.","Ada dua buku di mejaku."]],"trap":"Banyak benda memakai <b>are</b>: There <b>are</b> three apples."},"items":"mc|There ___ a pen in my bag.|is;are;am;be|0|Satu benda: There is.\nmc|There ___ five students in the room.|is;are;am;be|1|Banyak benda: There are.\nmc|There is ___ orange on the plate.|a;an;two;many|1|\"Orange\" diawali vokal: an.\nmc|There are many ___ in the sky.|star;stars;a star;an star|1|There are + jamak.\nmc|___ there a library near your house?|Are;Is;Am;Do|1|Satu library: Is there...?\nmc|___ there any cookies in the jar?|Is;Are;Am;Does|1|Cookies jamak: Are there...?\nmc|There ___ a big tree in the garden.|are;is;am;have|1|Satu pohon: There is.\nmc|There are two ___ on the bed.|pillow;pillows;a pillow;pillowes|1|Two + jamak.\nmc|There ___ some milk in the fridge.|are;is;am;be|1|Milk tidak bisa dihitung, jadi memakai \"is\".\nord|There is a cat under the chair.\nord|There are three birds in the tree.\nord|Is there a park near your school?"},{"id":"g-sd5","lv":"sd","en":"Can and Can't","idn":"Bisa & Tidak Bisa (can)","rule":{"points":["<b>can</b> = bisa","<b>can't</b> (cannot) = tidak bisa","Setelah can, kata kerja tetap bentuk dasar (tanpa -s)","Pertanyaan: <b>Can</b> you swim?"],"formula":["Subjek + can + kata kerja","Can + subjek + kata kerja?"],"examples":[["I can swim.","Aku bisa berenang."],["A fish can't walk.","Ikan tidak bisa berjalan."]],"trap":"Bukan \"She can swims\". Yang benar: She can <b>swim</b>."},"items":"mc|A bird ___ fly.|can;can't;cans;canning|0|Burung bisa terbang.\nmc|A fish ___ walk.|can;can't;is;are|1|Ikan tidak bisa berjalan.\nmc|She can ___ very well.|sings;sing;singing;to sing|1|Setelah can, kata kerja bentuk dasar.\nmc|___ you ride a bike? Yes, I can.|Are;Do;Can;Is|2|Pertanyaan kemampuan: Can you...?\nmc|My baby brother ___ talk yet.|can;can't;cans;is|1|Bayi belum bisa bicara.\nmc|Can he play football? No, he ___.|can;can't;isn't;don't|1|Jawaban negatif singkat: No, he can't.\nmc|An elephant ___ swim, but it can't fly.|can;can't;cans;cannot|0|Gajah bisa berenang.\nmc|I can ___ a picture of a cat.|draws;draw;drawing;drew|1|Can + bentuk dasar: draw.\nmc|Penguins can't ___.|fly;flies;flying;flew|0|Can't + bentuk dasar: fly.\nord|I can speak English.\nord|My cat can't swim.\nord|Can you play the guitar?"},{"id":"g-sd6","lv":"sd","en":"I like, I don't like","idn":"Suka & Tidak Suka","rule":{"points":["<b>I like</b> ... = aku suka ...","<b>I don't like</b> ... = aku tidak suka ...","Untuk he/she/it: <b>likes</b> dan <b>doesn't like</b>","Pertanyaan: <b>Do</b> you like ...? / <b>Does</b> she like ...?"],"formula":["I / You / We / They + like","He / She / It + likes"],"examples":[["I like bananas.","Aku suka pisang."],["She doesn't like spicy food.","Dia tidak suka makanan pedas."]],"trap":"He/She memakai <b>likes</b>: She <b>likes</b> cats."},"items":"mc|I ___ ice cream.|like;likes;liking;am like|0|\"I\" memakai like.\nmc|She ___ cats.|like;likes;liking;is like|1|\"She\" memakai likes.\nmc|We don't ___ rainy days.|likes;like;liking;liked|1|Setelah don't, bentuk dasar: like.\nmc|He ___ like vegetables.|don't;doesn't;isn't;not|1|\"He\" memakai doesn't.\nmc|___ you like football? Yes, I do.|Are;Does;Do;Is|2|Pertanyaan untuk \"you\": Do you...?\nmc|___ your sister like dolls? Yes, she does.|Do;Does;Is;Are|1|Pertanyaan untuk she: Does...?\nmc|My father ___ coffee every morning.|like;likes;liking;is liking|1|My father = he: likes.\nmc|They ___ playing in the park.|likes;like;is like;liking|1|\"They\" memakai like.\nmc|Does he like fish? No, he ___.|don't;doesn't;isn't;can't|1|Jawaban singkat untuk he: doesn't.\nord|I like reading books.\nord|My brother doesn't like milk.\nord|Do you like apples?"},{"id":"g-sd7","lv":"sd","en":"In, On, Under","idn":"Di Dalam, Di Atas, Di Bawah","rule":{"points":["<b>in</b> = di dalam","<b>on</b> = di atas (menempel di permukaan)","<b>under</b> = di bawah","<b>next to</b> = di sebelah, <b>behind</b> = di belakang"],"formula":["Benda + is + in/on/under + the + tempat"],"examples":[["The cat is under the table.","Kucing di bawah meja."],["My book is in my bag.","Bukuku di dalam tasku."]],"trap":"Buku di permukaan meja = <b>on</b> the table, bukan in the table."},"items":"mc|The fish is ___ the water.|in;on;under;behind|0|Ikan berada di dalam air.\nmc|The book is ___ the table.|in;on;under;behind|1|Di permukaan meja: on.\nmc|The cat is sleeping ___ the bed.|in;on;under;at|2|Di bawah tempat tidur: under.\nmc|My pencils are ___ my pencil case.|on;under;in;at|2|Di dalam kotak pensil: in.\nmc|The picture is ___ the wall.|in;on;under;behind|1|Menempel di dinding: on.\nmc|The ball is ___ the chair. (di bawah)|on;in;under;next to|2|Di bawah: under.\nmc|The bank is ___ the school. (di sebelah)|next to;in;under;on|0|Di sebelah: next to.\nmc|The dog is hiding ___ the door. (di belakang)|behind;on;in;under|0|Di belakang: behind.\nord|The cat is under the table.\nord|My shoes are next to the door.\nord|The keys are in my bag."},{"id":"g-smp1","lv":"smp","en":"Simple Present Tense","idn":"Simple Present (kebiasaan & fakta)","rule":{"points":["Untuk <b>kebiasaan</b>, <b>rutinitas</b>, dan <b>fakta umum</b>","He/She/It: kata kerja + <b>-s/-es</b> (go → goes, watch → watches, study → studies)","Negatif: <b>don't / doesn't</b> + kata kerja dasar","Tanya: <b>Do / Does</b> + subjek + kata kerja dasar?","Kata keterangan: always, usually, often, sometimes, never, every day"],"formula":["I/You/We/They + V1","He/She/It + V1-s/es","Does + he/she/it + V1?"],"examples":[["She walks to school every day.","Dia berjalan ke sekolah setiap hari."],["Water boils at 100°C.","Air mendidih pada 100°C."]],"trap":"Setelah doesn't, kata kerja kembali ke bentuk dasar: She doesn't <b>like</b> (bukan likes)."},"items":"mc|My father ___ to work by bus.|go;goes;going;is go|1|He + V1-es: goes.\nmc|The sun ___ in the east.|rise;rises;rising;is rise|1|Fakta umum, subjek tunggal: rises.\nmc|They ___ football every Saturday.|plays;play;playing;is play|1|They + V1: play.\nmc|She ___ her homework after dinner.|do;does;doing;is do|1|She + does.\nmc|My brother ___ English at university.|study;studys;studies;studying|2|Konsonan + y: studies.\nmc|I ___ like horror movies.|doesn't;don't;not;isn't|1|I + don't.\nmc|___ your mother cook every day?|Do;Does;Is;Are|1|Your mother = she: Does.\nmc|He doesn't ___ coffee.|drinks;drink;drinking;drank|1|Setelah doesn't: bentuk dasar.\nmc|Cats ___ fish.|likes;like;liking;is like|1|Cats (jamak) + V1.\nmc|We usually ___ breakfast at six.|has;have;having;haves|1|We + have.\nerr|My sister [watch] TV [every] evening [after] she [finishes] her homework.|0|watches|My sister = she, jadi kata kerjanya watches.\nerr|[Does] your brother [plays] the guitar [in] a [band]?|1|play|Setelah does, kata kerja bentuk dasar: play.\nerr|Tom [don't] [eat] meat because he [is] a [vegetarian].|0|doesn't|Tom = he, jadi negatifnya doesn't.\nerr|Water [boil] at [100 degrees] [Celsius] at [sea level].|0|boils|Water (tunggal) + boils.\ntime|She always drinks tea in the morning.|habit\ntime|The earth goes around the sun.|habit\ntime|I usually walk to school.|habit\nord|My mother usually cooks dinner at six.\nord|Does your brother play badminton?\nord|We don't have class on Sunday."},{"id":"g-smp2","lv":"smp","en":"Present Continuous Tense","idn":"Present Continuous (sedang terjadi)","rule":{"points":["Untuk kegiatan yang <b>sedang terjadi sekarang</b>","Juga untuk rencana pasti di masa dekat: I'm meeting Rina tomorrow.","Bentuk: <b>am/is/are + V-ing</b>","Kata keterangan: now, right now, at the moment, Look!, Listen!","Kata kerja keadaan (like, know, want) biasanya tidak memakai -ing"],"formula":["I am + V-ing","He/She/It is + V-ing","You/We/They are + V-ing"],"examples":[["Look! The baby is sleeping.","Lihat! Bayinya sedang tidur."],["They are playing football now.","Mereka sedang bermain sepak bola sekarang."]],"trap":"Jangan lupa am/is/are: She <b>is</b> reading (bukan \"She reading\")."},"items":"mc|Look! The children ___ in the rain.|play;plays;are playing;is playing|2|Sedang terjadi + they: are playing.\nmc|I ___ my homework right now.|do;am doing;does;is doing|1|I + am + V-ing.\nmc|Listen! Someone ___ the piano.|plays;is playing;are playing;play|1|Someone (tunggal) + is playing.\nmc|She ___ a red dress today.|wear;wears;is wearing;are wearing|2|Sedang dipakai hari ini: is wearing.\nmc|We ___ for the bus at the moment.|wait;are waiting;is waiting;waits|1|We + are + V-ing.\nmc|What ___ you doing now?|is;am;are;do|2|You + are.\nmc|He ___ watching TV; he's sleeping.|isn't;aren't;doesn't;don't|0|He + isn't.\nmc|My parents ___ dinner in the kitchen now.|cooks;is cooking;are cooking;cook|2|My parents = they: are cooking.\nmc|I ___ the answer to this question.|am knowing;know;knowing;am know|1|\"Know\" kata kerja keadaan, tidak memakai -ing.\nmc|Be quiet! The baby ___.|sleeps;is sleeping;sleep;are sleeping|1|Sedang terjadi: is sleeping.\nerr|Look! The dog [is] [run] [after] the [cat].|1|running|Present continuous: is + running.\nerr|They [is] [studying] in the library [at the] [moment].|0|are|They + are.\nerr|I [am wanting] a [glass] of water, [please], I'm [thirsty].|0|want|\"Want\" kata kerja keadaan: I want.\nerr|She [reading] a [novel] in her [room] [right now].|0|is reading|Perlu \"is\": She is reading.\ntime|Look! It is raining outside.|now\ntime|The students are taking a test right now.|now\ntime|She usually wears a uniform, but today she is wearing a jacket.|now\ntime|My father reads the newspaper every morning.|habit\nord|The children are playing in the garden now.\nord|What are you doing at the moment?\nord|She isn't watching TV right now."},{"id":"g-smp3","lv":"smp","en":"Simple Past Tense","idn":"Simple Past (sudah terjadi)","rule":{"points":["Untuk kejadian yang <b>sudah selesai di masa lalu</b>","Kata kerja beraturan: + <b>-ed</b> (play → played, study → studied)","Kata kerja tidak beraturan: bentuk khusus (go → went, eat → ate, see → saw, buy → bought)","Negatif & tanya: <b>did / didn't</b> + kata kerja <b>dasar</b>","Kata keterangan: yesterday, last week, two days ago, in 2020"],"formula":["Subjek + V2","Subjek + didn't + V1","Did + subjek + V1?"],"examples":[["I visited my grandmother last Sunday.","Aku mengunjungi nenek Minggu lalu."],["We went to Bali in 2023.","Kami pergi ke Bali tahun 2023."]],"trap":"Setelah did/didn't, pakai bentuk dasar: Did you <b>go</b>? (bukan \"Did you went?\")."},"items":"mc|We ___ to the zoo last Sunday.|go;went;goes;going|1|Last Sunday = masa lalu: went.\nmc|She ___ a new bag yesterday.|buy;buys;bought;buyed|2|Bentuk lampau \"buy\" adalah bought.\nmc|I ___ my homework two hours ago.|finish;finished;finishing;finishes|1|Kata kerja beraturan + -ed.\nmc|They didn't ___ the film.|watched;watch;watching;watches|1|Setelah didn't: bentuk dasar.\nmc|___ you see the rainbow yesterday?|Do;Does;Did;Were|2|Pertanyaan lampau: Did.\nmc|He ___ very tired last night.|is;was;were;be|1|He + was (lampau).\nmc|My friends ___ at the party.|was;were;is;are|1|Friends (jamak) + were.\nmc|Edison ___ the light bulb.|invent;invents;invented;inventing|2|Fakta sejarah: invented.\nmc|I ___ a strange noise at midnight.|hear;heard;heared;hearing|1|Bentuk lampau \"hear\" adalah heard.\nmc|We ___ breakfast at seven this morning.|have;had;has;haved|1|Bentuk lampau \"have\" adalah had.\nerr|Yesterday I [go] to the market [and] [bought] some [fruit].|0|went|Yesterday: bentuk lampau went.\nerr|[Did] she [called] you [last] [night]?|1|call|Setelah did: bentuk dasar call.\nerr|We [was] very [happy] when we [won] the [match].|0|were|We + were.\nerr|He [didn't] [came] to school [because] he was [sick].|1|come|Setelah didn't: bentuk dasar come.\ntime|I visited Yogyakarta last year.|past\ntime|She broke her arm two weeks ago.|past\ntime|We watched a movie last night.|past\ntime|They play badminton every weekend.|habit\nord|We went to the beach last weekend.\nord|Did you finish your homework yesterday?\nord|She didn't come to the party."},{"id":"g-smp4","lv":"smp","en":"Future: will and be going to","idn":"Masa Depan (will & going to)","rule":{"points":["<b>will</b> + V1: keputusan spontan, janji, dan perkiraan","<b>be going to</b> + V1: rencana yang sudah dipikirkan, atau tanda yang terlihat sekarang","Negatif: won't / am not going to","Kata keterangan: tomorrow, next week, soon, in 2030"],"formula":["Subjek + will + V1","Subjek + am/is/are + going to + V1"],"examples":[["I'm thirsty. I'll get some water.","Aku haus. Aku akan ambil air (spontan)."],["We are going to visit Bali next month.","Kami akan ke Bali bulan depan (sudah direncanakan)."]],"trap":"Setelah will, kata kerja tetap bentuk dasar: She will <b>come</b> (bukan comes)."},"items":"mc|Look at those dark clouds! It ___ rain.|is going to;will;goes to;going|0|Ada tanda yang terlihat: is going to.\nmc|The phone is ringing. I ___ answer it.|am going to;will;am;going to|1|Keputusan spontan: will.\nmc|We ___ visit our grandparents next week. We bought the tickets yesterday.|will;are going to;go;going|1|Rencana yang sudah diatur: are going to.\nmc|I promise I ___ tell anyone.|won't;am not going;don't;not|0|Janji: won't.\nmc|She will ___ the results tomorrow.|knows;know;knew;knowing|1|Setelah will: bentuk dasar.\nmc|What ___ you going to do after school?|is;am;are;will|2|You + are going to.\nmc|I think Indonesia ___ win the match.|will;is going;going to;is|0|Perkiraan berdasarkan pendapat: will.\nmc|He's going to ___ a doctor when he grows up.|becomes;become;became;becoming|1|Going to + bentuk dasar.\nerr|I [will] [helps] you [with] your [homework].|1|help|Setelah will: bentuk dasar help.\nerr|They [are going] [study] in Japan [next] [year].|0|are going to|Bentuknya be going to + V1.\nerr|Don't worry, I [am going to] [carry] that bag [for you], it [looks] heavy.|0|will|Tawaran spontan memakai will.\ntime|We are going to move to Bandung next year.|future\ntime|I will call you tomorrow.|future\ntime|Watch out! You are going to fall!|future\ntime|He is reading a comic now.|now\nord|I will call you tonight.\nord|We are going to visit Lombok next month.\nord|Will you come to my party?"},{"id":"g-smp5","lv":"smp","en":"Pronouns and Possessives","idn":"Kata Ganti & Kepemilikan","rule":{"points":["Subjek: I, you, he, she, it, we, they","Objek: me, you, him, her, it, us, them","Kepemilikan + benda: my, your, his, her, its, our, their","Kepemilikan tanpa benda: mine, yours, his, hers, ours, theirs","Kepemilikan nama: Rina<b>'s</b> bag, the students<b>'</b> books"],"formula":["She likes him.","This is her bag. The bag is hers."],"examples":[["Can you help me?","Bisakah kamu membantuku?"],["That pen is mine.","Pulpen itu milikku."]],"trap":"<b>its</b> = miliknya (benda/hewan); <b>it's</b> = it is."},"items":"mc|Please give ___ the book.|I;me;my;mine|1|Setelah kata kerja: objek \"me\".\nmc|This is Rina. ___ is my classmate.|Her;She;Hers;Him|1|Subjek untuk perempuan: She.\nmc|I don't know ___. What's his name?|he;his;him;himself|2|Objek untuk laki-laki: him.\nmc|Is this your phone? No, it isn't ___.|my;mine;me;I|1|Tanpa benda setelahnya: mine.\nmc|The dog is wagging ___ tail.|it's;its;his;their|1|Milik hewan: its.\nmc|We love ___ teacher.|us;our;ours;we|1|Diikuti benda: our.\nmc|That is ___ car. (milik Budi)|Budi;Budis;Budi's;Budis'|2|Kepemilikan: Budi's.\nmc|They invited ___ to their party. (kami)|we;our;us;ours|2|Objek: us.\nmc|These books are ___. (milik mereka)|their;theirs;them;they|1|Tanpa benda: theirs.\nerr|[Me] and my sister [went] to the [cinema] [yesterday].|0|My sister and I|Sebagai subjek memakai \"I\": My sister and I.\nerr|The cat [is] licking [it's] [paw] [slowly].|1|its|Milik kucing: its (tanpa apostrof).\nerr|This umbrella [isn't] [my], it [belongs] to [my brother].|1|mine|Tanpa benda setelahnya: mine.\nord|Can you help me with my homework?\nord|That bicycle is hers.\nord|Our teacher gave us a quiz."},{"id":"g-smp6","lv":"smp","en":"Countable & Uncountable; some, any, much, many","idn":"Benda Terhitung & Tak Terhitung","rule":{"points":["Terhitung (bisa diberi angka): apple, book, chair → a/an, many, a few","Tak terhitung: water, rice, sugar, money, information → much, a little","<b>some</b> untuk kalimat positif dan tawaran","<b>any</b> untuk kalimat negatif dan pertanyaan","How many + jamak? / How much + tak terhitung?"],"formula":["many books / much water","some apples (+) / any apples (−/?)"],"examples":[["How much sugar do you need?","Berapa banyak gula yang kamu perlukan?"],["There aren't any eggs.","Tidak ada telur sama sekali."]],"trap":"Kata tak terhitung tidak diberi -s: <b>information</b>, bukan informations."},"items":"mc|How ___ students are in your class?|much;many;a little;any|1|Students terhitung: many.\nmc|How ___ water do you drink every day?|many;much;a few;few|1|Water tak terhitung: much.\nmc|There isn't ___ milk in the fridge.|some;any;many;a few|1|Kalimat negatif: any.\nmc|Would you like ___ tea?|any;some;many;a|1|Tawaran memakai some.\nmc|I need ___ information about the trip.|an;many;some;a few|2|Information tak terhitung: some.\nmc|She has ___ friends in Jakarta.|a few;a little;much;any|0|Friends terhitung: a few.\nmc|Add ___ salt to the soup.|a few;many;a little;an|2|Salt tak terhitung: a little.\nmc|Are there ___ apples left?|some;any;much;a little|1|Pertanyaan: any.\nmc|I don't have ___ money with me.|many;much;a few;few|1|Money tak terhitung: much.\nerr|Can you give me [some] [advices] [about] [choosing] a university?|1|advice|Advice tak terhitung, tidak memakai -s.\nerr|There [aren't] [much] [chairs] in the [room].|1|many|Chairs terhitung: many.\nerr|How [many] [sugar] do you [want] in your [coffee]?|0|much|Sugar tak terhitung: much.\nord|There isn't any rice in the kitchen.\nord|How many books do you have?\nord|Could I have some water, please?"},{"id":"g-smp7","lv":"smp","en":"Comparatives & Superlatives","idn":"Perbandingan (lebih & paling)","rule":{"points":["Kata pendek: + <b>-er</b> / <b>the -est</b> (tall → taller → the tallest)","Kata panjang: <b>more</b> / <b>the most</b> (beautiful → more beautiful → the most beautiful)","Bentuk khusus: good → better → best, bad → worse → worst, far → farther","Perbandingan memakai <b>than</b>: Budi is taller <b>than</b> Andi."],"formula":["A + is + adj-er + than + B","A + is + the + adj-est + (in/of ...)"],"examples":[["An elephant is bigger than a horse.","Gajah lebih besar daripada kuda."],["This is the most interesting book.","Ini buku yang paling menarik."]],"trap":"Jangan menggabungkan dua bentuk: <b>bigger</b>, bukan \"more bigger\"."},"items":"mc|A cheetah is ___ than a lion.|fast;faster;fastest;more fast|1|Membandingkan dua: faster.\nmc|Mount Everest is ___ mountain in the world.|the higher;the highest;higher;most high|1|Paling: the highest.\nmc|This test is ___ than the last one.|difficult;more difficult;most difficult;difficulter|1|Kata panjang: more difficult.\nmc|My handwriting is ___ than yours.|bad;worse;worst;badder|1|Bentuk khusus: worse.\nmc|She is the ___ student in our class.|good;better;best;goodest|2|Paling: the best.\nmc|Jakarta is ___ than Bogor.|big;bigger;biggest;more big|1|Konsonan digandakan: bigger.\nmc|Today is ___ than yesterday.|hot;hotter;hottest;more hot|1|hot → hotter.\nmc|This is the ___ day of my life!|happy;happier;happiest;most happy|2|happy → the happiest.\nmc|A plane is faster ___ a train.|from;then;than;that|2|Perbandingan memakai than.\nerr|My brother is [more] [taller] [than] [me].|1|tall|Gunakan \"taller\" saja, tanpa more: more taller salah.\nerr|This is [the] [most cheap] phone [in] the [shop].|1|cheapest|Kata pendek: the cheapest.\nerr|Bali is [more] [beautiful] [then] [I expected].|2|than|Perbandingan memakai than, bukan then.\nord|Jupiter is bigger than Earth.\nord|This is the most expensive bag in the shop.\nord|My sister is taller than my mother."},{"id":"g-smp8","lv":"smp","en":"Prepositions of Time & Place: in, on, at","idn":"Kata Depan Waktu & Tempat","rule":{"points":["Waktu: <b>at</b> + jam (at 7 o'clock), <b>on</b> + hari/tanggal (on Monday, on 17 August), <b>in</b> + bulan/tahun/musim (in May, in 2025)","Tempat: <b>at</b> + titik/lokasi (at school, at the bus stop), <b>in</b> + ruang/kota/negara (in the room, in Jakarta), <b>on</b> + permukaan/jalan (on the table, on Jalan Sudirman)","Ungkapan tetap: in the morning, at night, at the weekend"],"formula":["at + jam","on + hari/tanggal","in + bulan/tahun"],"examples":[["The class starts at 7:30.","Kelas mulai pukul 7.30."],["I was born in 2011.","Aku lahir tahun 2011."]],"trap":"Malam hari: <b>at night</b>, tetapi pagi hari: <b>in the morning</b>."},"items":"mc|The movie starts ___ eight o'clock.|in;on;at;by|2|Jam: at.\nmc|We have English ___ Monday.|in;on;at;by|1|Hari: on.\nmc|My birthday is ___ June.|in;on;at;by|0|Bulan: in.\nmc|Indonesia became independent ___ 1945.|on;at;in;by|2|Tahun: in.\nmc|I usually study ___ night.|in;on;at;by|2|Ungkapan tetap: at night.\nmc|She lives ___ Surabaya.|at;on;in;by|2|Kota: in.\nmc|Wait for me ___ the bus stop.|in;at;on;by|1|Titik lokasi: at.\nmc|The keys are ___ the table.|in;at;on;by|2|Permukaan: on.\nmc|We celebrate Independence Day ___ 17 August.|in;at;on;by|2|Tanggal: on.\nmc|I always drink coffee ___ the morning.|at;on;in;by|2|Ungkapan tetap: in the morning.\nerr|The meeting [is] [on] [10 o'clock] in the [morning].|1|at|Jam memakai at.\nerr|We [will] go to Bali [in] [Christmas Day] [this year].|1|on|Hari tertentu memakai on.\nerr|My uncle [works] [in] a hospital [at] [Medan].|2|in|Kota memakai in.\nord|I go to school at seven o'clock.\nord|My birthday is on the fifth of May.\nord|She was born in 2010."},{"id":"g-smp9","lv":"smp","en":"Modals: can, must, should, have to","idn":"Kata Kerja Bantu Modal","rule":{"points":["<b>can</b> = bisa / boleh","<b>must</b> = harus (aturan atau keharusan kuat); <b>mustn't</b> = dilarang","<b>have to</b> = harus (keharusan dari luar); <b>don't have to</b> = tidak perlu","<b>should</b> = sebaiknya (saran)","Setelah modal, kata kerja selalu bentuk dasar"],"formula":["Subjek + modal + V1"],"examples":[["You must wear a helmet.","Kamu harus memakai helm."],["You should drink more water.","Sebaiknya kamu minum lebih banyak air."]],"trap":"<b>mustn't</b> = dilarang, sedangkan <b>don't have to</b> = tidak perlu. Maknanya berbeda!"},"items":"mc|You ___ smoke in the hospital. It's not allowed.|mustn't;don't have to;shouldn't to;can|0|Dilarang: mustn't.\nmc|You look tired. You ___ go to bed early.|must;should;can't;mustn't|1|Saran: should.\nmc|Tomorrow is a holiday, so we ___ go to school.|mustn't;don't have to;can't;shouldn't|1|Tidak perlu: don't have to.\nmc|___ I borrow your pen, please?|Must;Should;Can;Have|2|Meminta izin: Can I...?\nmc|All students ___ wear a uniform on Monday.|must;should to;can to;musts|0|Aturan sekolah: must.\nmc|She can ___ three languages.|speaks;speak;speaking;to speak|1|Setelah can: bentuk dasar.\nmc|You ___ eat so much sugar. It's bad for your teeth.|should;shouldn't;must;have to|1|Saran negatif: shouldn't.\nmc|My father ___ work on Saturdays. His office is open.|has to;have to;must to;should to|0|He + has to.\nerr|You [should] [to] [see] a [doctor].|1|(hapus \"to\")|Setelah should langsung V1: You should see a doctor.\nerr|She [must] [finishes] the [report] [today].|1|finish|Setelah must: bentuk dasar.\nerr|It's Sunday, you [mustn't] [wake] [up] early; [sleep] more!|0|don't have to|Maksudnya \"tidak perlu\", jadi don't have to.\nord|You must wear a seatbelt.\nord|You should eat more vegetables.\nord|We don't have to wear a uniform today."},{"id":"g-sma1","lv":"sma","en":"Present Perfect vs Simple Past","idn":"Present Perfect vs Simple Past","rule":{"points":["<b>Present perfect</b> (have/has + V3): pengalaman, kejadian yang hasilnya masih terasa sekarang, atau keadaan dari dulu sampai sekarang","Kata penanda present perfect: ever, never, already, yet, just, since, for, so far","<b>Simple past</b> (V2): kejadian selesai pada waktu tertentu di masa lalu","Kata penanda simple past: yesterday, last year, in 2019, ago","Jika waktunya disebut jelas di masa lalu, pakai simple past"],"formula":["have/has + V3","since + titik waktu (since 2020) / for + lama waktu (for three years)"],"examples":[["I have lived here since 2018.","Aku tinggal di sini sejak 2018 (sampai sekarang)."],["I lived in Medan in 2015.","Aku tinggal di Medan tahun 2015 (sudah selesai)."]],"trap":"Kesalahan umum: \"I have seen him yesterday\". Yesterday = waktu jelas, jadi pakai <b>I saw him yesterday</b>."},"items":"mc|I ___ to Japan twice.|went;have been;go;was going|1|Pengalaman tanpa waktu jelas: have been.\nmc|She ___ her keys yesterday.|has lost;lost;loses;have lost|1|Yesterday = waktu jelas: simple past.\nmc|We ___ each other since primary school.|knew;have known;know;are knowing|1|Since + sampai sekarang: have known.\nmc|___ you ever eaten durian?|Did;Have;Has;Do|1|Pengalaman: Have you ever...?\nmc|They moved to Bandung ___ 2019.|since;for;in;ago|2|Tahun tertentu dengan simple past: in.\nmc|I have worked here ___ five years.|since;for;in;ago|1|Lama waktu: for.\nmc|He ___ just finished his report.|have;has;did;was|1|He + has + V3.\nmc|I haven't finished my homework ___.|already;yet;just;ever|1|Kalimat negatif: yet.\nmc|When ___ you start learning English?|have;did;has;do|1|\"When\" menanyakan waktu jelas: did.\nmc|The train ___ already left. We missed it.|has;have;did;is|0|Hasil masih terasa sekarang: has left.\nerr|I [have seen] that film [last] [week] with [my cousins].|0|saw|Last week = waktu jelas: saw.\nerr|She [has lived] in Jakarta [since] [three years] [now].|2|for three years|Lama waktu memakai for.\nerr|[Did] you [ever] [visited] Lake Toba [before]?|0|Have|Pengalaman: Have you ever visited...?\nerr|We [have] [went] to that restaurant [many] [times].|1|gone|Present perfect: have + V3 (gone).\ntime|I have lived in this city since 2015.|uptonow\ntime|She has visited Bali three times.|uptonow\ntime|We graduated in 2020.|past\ntime|They have just arrived.|uptonow\ntime|He bought a new laptop last month.|past\nord|I have never been to Papua.\nord|She has worked here since 2021.\nord|We visited the museum last Saturday."},{"id":"g-sma2","lv":"sma","en":"Past Continuous & Past Perfect","idn":"Past Continuous & Past Perfect","rule":{"points":["<b>Past continuous</b> (was/were + V-ing): kegiatan yang <b>sedang berlangsung</b> pada suatu saat di masa lalu","Sering dipakai dengan <b>when</b> (kejadian singkat yang memotong) dan <b>while</b> (dua kegiatan bersamaan)","<b>Past perfect</b> (had + V3): kejadian yang terjadi <b>lebih dulu</b> sebelum kejadian lain di masa lalu","Penanda: before, after, by the time, already"],"formula":["was/were + V-ing","had + V3"],"examples":[["I was cooking when the lights went out.","Aku sedang memasak ketika lampu padam."],["When we arrived, the film had started.","Saat kami tiba, film sudah dimulai."]],"trap":"Kejadian singkat yang memotong memakai simple past: I was sleeping when the phone <b>rang</b>."},"items":"mc|I ___ a shower when the phone rang.|took;was taking;had taken;take|1|Sedang berlangsung lalu dipotong: was taking.\nmc|While she was reading, her brother ___ TV.|watched;was watching;had watched;watches|1|Dua kegiatan bersamaan: was watching.\nmc|When we got to the station, the train ___.|left;was leaving;had left;has left|2|Kereta berangkat lebih dulu: had left.\nmc|They ___ football at 4 p.m. yesterday.|played;were playing;had played;play|1|Sedang berlangsung pada jam tertentu: were playing.\nmc|She was tired because she ___ all night.|studied;was studying;had studied;studies|2|Belajar terjadi lebih dulu: had studied.\nmc|What ___ you doing at 9 last night?|was;were;did;had|1|You + were + V-ing.\nmc|By the time the police arrived, the thief ___.|escaped;had escaped;was escaping;escapes|1|Lebih dulu dari kedatangan polisi: had escaped.\nmc|I ___ my wallet, so I couldn't pay.|lost;had lost;was losing;have lost|1|Lebih dulu sebelum tidak bisa membayar: had lost.\nerr|I [was walking] home when it [was starting] [to] [rain].|1|started|Kejadian singkat yang memotong: started.\nerr|After she [has finished] her homework, she [went] out [with] her [friends].|0|had finished|Lebih dulu di masa lalu: had finished.\nerr|They [was] [having] dinner [when] I [called].|0|were|They + were.\ntime|I was watching TV when you called.|pastprog\ntime|At 8 p.m. yesterday, we were having dinner.|pastprog\ntime|When I arrived, everyone had already left.|beforepast\ntime|She had never seen snow before she went to Japan.|beforepast\nord|I was sleeping when the earthquake happened.\nord|The film had started before we arrived.\nord|What were you doing at nine last night?"},{"id":"g-sma3","lv":"sma","en":"Present Perfect Continuous","idn":"Present Perfect Continuous","rule":{"points":["Bentuk: <b>have/has been + V-ing</b>","Untuk kegiatan yang <b>dimulai di masa lalu dan masih berlangsung</b> sampai sekarang, dengan menekankan lamanya","Juga untuk kegiatan yang baru berhenti dan hasilnya masih terlihat: I'm tired because I've been running.","Penanda: for, since, all day, how long"],"formula":["I/You/We/They have been + V-ing","He/She/It has been + V-ing"],"examples":[["I have been learning English for six years.","Aku sudah belajar bahasa Inggris selama enam tahun (dan masih)."],["It has been raining since morning.","Hujan turun terus sejak pagi."]],"trap":"Kata kerja keadaan (know, like, own) tetap memakai present perfect biasa: I <b>have known</b> her for years."},"items":"mc|She ___ for the bus for twenty minutes.|waits;has been waiting;waited;is wait|1|Masih berlangsung sampai sekarang: has been waiting.\nmc|How long ___ you been studying here?|have;has;did;are|0|You + have been.\nmc|I'm out of breath because I ___.|ran;have been running;run;had run|1|Baru saja berhenti, hasilnya terlihat: have been running.\nmc|They have been working on the project ___ January.|for;since;ago;during|1|Titik waktu: since.\nmc|We ___ each other for ten years.|have been knowing;have known;are knowing;knew|1|\"Know\" kata kerja keadaan: have known.\nmc|It ___ all day. The streets are flooded.|has been raining;rains;rained;is raining|0|Berlangsung lama dan hasilnya terlihat: has been raining.\nerr|I [have been] [know] my best friend [since] [2015].|1|known|\"Know\" tidak memakai -ing: I have known.\nerr|He [has] [been] [play] games [for three hours].|2|playing|Bentuknya has been + V-ing.\nerr|She [have] been [living] here [since] [2019].|0|has|She + has.\ntime|I have been waiting here for an hour.|uptonow\ntime|She has been teaching at this school since 2010.|uptonow\ntime|They are playing chess right now.|now\nord|I have been studying for three hours.\nord|How long have you been living here?\nord|It has been raining since this morning."},{"id":"g-sma4","lv":"sma","en":"Passive Voice","idn":"Kalimat Pasif","rule":{"points":["Bentuk: <b>be + V3</b>. To be mengikuti tense-nya","Present: is/are + V3; Past: was/were + V3; Perfect: has/have been + V3; Future: will be + V3; Modal: can/must be + V3","Dipakai saat pelakunya tidak penting, tidak diketahui, atau saat fokusnya pada hasil","Pelaku boleh ditambahkan dengan <b>by</b>"],"formula":["Objek aktif + be + V3 + (by + pelaku)"],"examples":[["The bridge was built in 1990.","Jembatan itu dibangun pada 1990."],["English is spoken in many countries.","Bahasa Inggris digunakan di banyak negara."]],"trap":"Pasif selalu memakai V3: The letter was <b>written</b> (bukan was wrote)."},"items":"mc|This house ___ in 1985.|built;was built;is building;has built|1|Lampau pasif: was built.\nmc|Rice ___ in many Asian countries.|grows;is grown;grew;growing|1|Present pasif: is grown.\nmc|The results ___ next week.|will announce;will be announced;announced;are announcing|1|Future pasif: will be announced.\nmc|My bike ___. I can't find it anywhere!|has stolen;has been stolen;stole;was stealing|1|Perfect pasif: has been stolen.\nmc|The windows ___ every Friday.|clean;are cleaned;cleaned;are cleaning|1|Present pasif, jamak: are cleaned.\nmc|The letter was ___ by the principal.|write;wrote;written;writing|2|Pasif memakai V3: written.\nmc|This medicine must ___ after meals.|take;be taken;taken;to take|1|Modal pasif: must be taken.\nmc|Borobudur ___ in the 9th century.|built;was built;is built;has been built|1|Peristiwa sejarah: was built.\nerr|The new library [was] [open] by the mayor [last] [month].|1|opened|Pasif memakai V3: was opened.\nerr|English [is] [speak] [in] many [countries].|1|spoken|Pasif: is spoken.\nerr|The cake [was] [ate] [by] the [children].|1|eaten|V3 dari eat adalah eaten.\ntr|Ubah ke kalimat pasif.|The students cleaned the classroom.|The classroom was cleaned by the students.\ntr|Ubah ke kalimat pasif.|People speak Javanese in Central Java.|Javanese is spoken in Central Java.\ntr|Ubah ke kalimat pasif.|The government will build a new hospital.|A new hospital will be built by the government.\ntr|Ubah ke kalimat pasif.|Someone has stolen my wallet.|My wallet has been stolen."},{"id":"g-sma5","lv":"sma","en":"Conditionals (0, 1, 2, 3)","idn":"Kalimat Pengandaian (Conditionals)","rule":{"points":["<b>Type 0</b> (fakta): If + present, present. <i>If you heat ice, it melts.</i>","<b>Type 1</b> (mungkin terjadi): If + present, will + V1. <i>If it rains, I will stay home.</i>","<b>Type 2</b> (khayalan sekarang): If + past, would + V1. <i>If I were rich, I would travel.</i>","<b>Type 3</b> (penyesalan masa lalu): If + had + V3, would have + V3. <i>If I had studied, I would have passed.</i>","Pada type 2, <b>were</b> dipakai untuk semua subjek: If I were you..."],"formula":["If + present → will","If + past → would","If + had V3 → would have V3"],"examples":[["If you study hard, you will pass.","Jika kamu belajar keras, kamu akan lulus."],["If I had known, I would have helped you.","Seandainya aku tahu (dulu), aku pasti sudah membantumu."]],"trap":"Jangan memakai will di anak kalimat if: If it <b>rains</b> (bukan if it will rain)."},"items":"mc|If you heat water to 100°C, it ___.|boils;will boiled;would boil;boiled|0|Fakta (type 0): present.\nmc|If it rains tomorrow, we ___ the match.|cancel;will cancel;would cancel;cancelled|1|Type 1: will + V1.\nmc|If I ___ a bird, I would fly to the mountains.|am;was;were;be|2|Type 2: were.\nmc|If she had left earlier, she ___ the bus.|would catch;would have caught;will catch;caught|1|Type 3: would have + V3.\nmc|I would buy a house if I ___ more money.|have;had;will have;would have|1|Type 2: if + past.\nmc|If you ___ me, I will help you.|call;will call;called;would call|0|Type 1: if + present.\nmc|If they ___ harder, they would have won.|trained;had trained;train;would train|1|Type 3: if + had + V3.\nmc|If I were you, I ___ apologize.|will;would;am;had|1|Saran (type 2): would.\nerr|If it [will rain] tomorrow, we [will stay] [at] [home].|0|rains|Anak kalimat if tidak memakai will: if it rains.\nerr|If I [was] you, I [would] [accept] the [offer].|0|were|Type 2 memakai were.\nerr|If he [had studied], he [would pass] the [exam] [last week].|1|would have passed|Type 3: would have passed.\ntr|Gabungkan menjadi kalimat type 2.|I don't have a car. I can't drive you home.|If I had a car, I could drive you home.\ntr|Gabungkan menjadi kalimat type 3.|She didn't study. She failed the test.|If she had studied, she would not have failed the test.\nord|If it rains, we will stay at home.\nord|If I were rich, I would build a school.\nord|If you had told me, I would have come."},{"id":"g-sma6","lv":"sma","en":"Reported Speech","idn":"Kalimat Tidak Langsung","rule":{"points":["Tense biasanya mundur satu langkah: am/is → was, do → did, did → had done, will → would, can → could","Kata ganti dan keterangan menyesuaikan: I → he/she, now → then, today → that day, tomorrow → the next day, here → there","Pertanyaan Ya/Tidak: <b>asked if/whether</b> + subjek + kata kerja (tanpa do/does)","Pertanyaan WH: <b>asked where/what</b> + subjek + kata kerja","Perintah: <b>told someone to</b> + V1"],"formula":["She said (that) + kalimat mundur satu tense","He asked if + subjek + kata kerja"],"examples":[["\"I am tired,\" she said. → She said that she was tired.","Dia bilang bahwa dia lelah."],["\"Where do you live?\" he asked. → He asked where I lived.","Dia bertanya di mana aku tinggal."]],"trap":"Urutan pertanyaan tidak langsung seperti kalimat biasa: He asked where I <b>lived</b> (bukan where did I live)."},"items":"mc|\"I am hungry,\" Tom said. → Tom said that he ___ hungry.|is;was;were;has been|1|am → was.\nmc|\"I will call you,\" she said. → She said she ___ call me.|will;would;can;shall|1|will → would.\nmc|\"Do you like coffee?\" he asked. → He asked ___ I liked coffee.|that;if;what;do|1|Pertanyaan ya/tidak: if.\nmc|\"Where do you live?\" she asked. → She asked where I ___.|live;lived;did live;do live|1|Tanpa do; tense mundur: lived.\nmc|\"Close the door,\" the teacher said. → The teacher told us ___ the door.|close;to close;closing;closed|1|Perintah: told + to + V1.\nmc|\"I can swim,\" he said. → He said he ___ swim.|can;could;may;will|1|can → could.\nmc|\"I saw her yesterday,\" he said. → He said he had seen her ___.|yesterday;the day before;tomorrow;today|1|yesterday → the day before.\nmc|\"Don't be late,\" Mum said. → Mum told me ___ late.|don't be;not to be;to not;didn't be|1|Larangan: told + not to + V1.\nerr|She asked me where [did I] [live] [and] what I [did].|0|I lived|Pertanyaan tidak langsung memakai urutan biasa: where I lived.\nerr|He said [that] he [will] [come] [the next day].|1|would|Will mundur menjadi would.\nerr|The teacher [told] us [don't] [run] in the [corridor].|1|not to|Larangan: told us not to run.\ntr|Ubah ke kalimat tidak langsung.|\"I am studying,\" Rina said.|Rina said that she was studying.\ntr|Ubah ke kalimat tidak langsung.|\"Are you ready?\" he asked me.|He asked me if I was ready.\ntr|Ubah ke kalimat tidak langsung.|\"Please sit down,\" the doctor said to me.|The doctor told me to sit down."},{"id":"g-sma7","lv":"sma","en":"Relative Clauses","idn":"Anak Kalimat Relatif","rule":{"points":["<b>who</b> untuk orang, <b>which</b> untuk benda/hewan, <b>that</b> untuk orang atau benda","<b>whose</b> untuk kepemilikan, <b>where</b> untuk tempat, <b>when</b> untuk waktu","Defining (tanpa koma): memberi informasi penting","Non-defining (dengan koma): informasi tambahan, dan tidak boleh memakai that"],"formula":["Benda/orang + who/which/that + kata kerja"],"examples":[["The woman who lives next door is a doctor.","Wanita yang tinggal di sebelah adalah dokter."],["Bali, which is famous for its beaches, attracts many tourists.","Bali, yang terkenal dengan pantainya, menarik banyak wisatawan."]],"trap":"Setelah koma tidak boleh memakai <b>that</b>: Jakarta, <b>which</b> is the capital, ..."},"items":"mc|The man ___ fixed my car is very friendly.|which;who;where;whose|1|Orang: who.\nmc|This is the book ___ I told you about.|who;which;where;whose|1|Benda: which.\nmc|That's the girl ___ father is a pilot.|who;which;whose;whom|2|Kepemilikan: whose.\nmc|This is the restaurant ___ we had our first dinner.|which;who;where;when|2|Tempat: where.\nmc|I remember the day ___ we first met.|which;when;where;who|1|Waktu: when.\nmc|Lake Toba, ___ is in North Sumatra, is the largest lake in Indonesia.|that;which;who;where|1|Non-defining (koma) untuk benda: which.\nmc|Students ___ study hard usually succeed.|which;who;whose;where|1|Orang: who.\nmc|The phone ___ I bought last week is broken.|who;that;where;whose|1|Benda (defining): that atau which.\nerr|My sister, [that] [lives] in Bali, [is] a [teacher].|0|who|Non-defining tidak boleh memakai that; untuk orang: who.\nerr|The house [who] [we] [bought] is very [old].|0|which|Benda: which/that.\nerr|This is the student [which] [won] the [competition] [yesterday].|0|who|Orang: who.\nord|The teacher who teaches us English is from Medan.\nord|This is the house where I was born.\nord|I have a friend whose mother is a doctor."},{"id":"g-sma8","lv":"sma","en":"Gerunds & Infinitives","idn":"Gerund & To-Infinitive","rule":{"points":["Setelah enjoy, finish, avoid, mind, keep, suggest → <b>V-ing</b>","Setelah want, decide, hope, plan, need, agree, promise → <b>to + V1</b>","Setelah kata depan (in, at, of, about, without) → <b>V-ing</b>","Gerund bisa menjadi subjek: <b>Swimming</b> is good exercise.","Beberapa kata kerja maknanya berubah: stop doing (berhenti melakukan) vs stop to do (berhenti untuk melakukan)"],"formula":["enjoy + V-ing","want + to V1","preposisi + V-ing"],"examples":[["I enjoy reading novels.","Aku menikmati membaca novel."],["She decided to study abroad.","Dia memutuskan untuk kuliah di luar negeri."]],"trap":"Setelah kata depan selalu V-ing: interested in <b>learning</b> (bukan in learn)."},"items":"mc|I enjoy ___ to music.|listen;to listen;listening;listened|2|Enjoy + V-ing.\nmc|She wants ___ a doctor.|become;to become;becoming;became|1|Want + to V1.\nmc|He finished ___ his report at midnight.|write;to write;writing;written|2|Finish + V-ing.\nmc|We decided ___ the museum.|visit;to visit;visiting;visited|1|Decide + to V1.\nmc|I'm interested in ___ Korean.|learn;to learn;learning;learned|2|Setelah kata depan: V-ing.\nmc|___ too much sugar is bad for you.|Eat;To eating;Eating;Eaten|2|Gerund sebagai subjek.\nmc|Would you mind ___ the window?|open;to open;opening;opened|2|Mind + V-ing.\nmc|They promised ___ on time.|arrive;to arrive;arriving;arrived|1|Promise + to V1.\nmc|He left without ___ goodbye.|say;to say;saying;said|2|Without + V-ing.\nerr|I am [looking forward] [to] [meet] you [next week].|2|meeting|Look forward to + V-ing.\nerr|She [avoids] [to eat] [fast food] [nowadays].|1|eating|Avoid + V-ing.\nerr|They [hope] [winning] the [competition] [this year].|1|to win|Hope + to V1.\nord|I enjoy playing badminton with my friends.\nord|She decided to study medicine.\nord|He is good at solving problems."},{"id":"g-sma9","lv":"sma","en":"Subject–Verb Agreement & Articles","idn":"Kesesuaian Subjek–Kata Kerja & Artikel","rule":{"points":["Subjek tunggal + kata kerja tunggal: The <b>list</b> of names <b>is</b> long.","Kata keterangan di antara subjek dan kata kerja tidak mengubah subjeknya: The students in my class <b>are</b>...","Everyone, each, every, somebody → kata kerja tunggal","<b>a</b> sebelum bunyi konsonan, <b>an</b> sebelum bunyi vokal (an hour, a university)","<b>the</b> untuk sesuatu yang sudah jelas atau satu-satunya (the sun, the president)"],"formula":["Subjek tunggal → is/was/V-s","Subjek jamak → are/were/V1"],"examples":[["Each student has a locker.","Setiap siswa punya loker."],["She is an honest person.","Dia orang yang jujur."]],"trap":"Pilih a/an berdasarkan <b>bunyi</b>, bukan huruf: <b>an</b> hour, <b>a</b> university."},"items":"mc|The box of chocolates ___ on the table.|are;is;were;have|1|Subjeknya \"the box\" (tunggal): is.\nmc|Everyone ___ excited about the trip.|are;is;were;have been|1|Everyone memakai kata kerja tunggal.\nmc|The students in my class ___ very friendly.|is;are;was;has|1|Subjeknya \"the students\" (jamak).\nmc|She waited for ___ hour.|a;an;the;-|1|\"Hour\" diawali bunyi vokal: an.\nmc|He studies at ___ university in Yogyakarta.|a;an;the;-|0|\"University\" diawali bunyi /ju/: a.\nmc|___ sun rises in the east.|A;An;The;-|2|Satu-satunya: the.\nmc|Each of the players ___ a medal.|get;gets;are getting;have got|1|Each of + kata kerja tunggal.\nmc|Mathematics ___ my favourite subject.|are;is;were;have|1|Nama mata pelajaran berakhiran -s tetap tunggal.\nerr|The quality of these products [are] [very] [good] [for] the price.|0|is|Subjeknya \"the quality\" (tunggal).\nerr|She is [a] [honest] [and] hardworking [student].|0|an|Honest diawali bunyi vokal: an honest.\nerr|Every [students] [has] [to] bring [a] dictionary.|0|student|Every + kata benda tunggal.\nord|Each student has a different idea.\nord|The price of these shoes is too high.\nord|She is an English teacher."},{"id":"g-k1","lv":"kuliah","en":"Sentence Structure: Subjects, Verbs & Clauses","idn":"Struktur Kalimat (TOEFL Structure)","rule":{"points":["Setiap kalimat lengkap butuh <b>subjek</b> dan <b>kata kerja utama</b>. Soal TOEFL sering menghilangkan salah satunya","Anak kalimat (diawali because, although, when, which, that) butuh subjek dan kata kerjanya sendiri","Dua kalimat lengkap tidak boleh hanya dipisah koma. Gunakan titik, titik koma, atau kata sambung","Frasa pembuka (participial phrase) harus merujuk ke subjek kalimat utama"],"formula":["Subjek + Kata kerja + (Objek)","Anak kalimat + , + Kalimat utama"],"examples":[["Although it was raining, the match continued.","Walaupun hujan, pertandingan tetap berlanjut."],["The scientist who discovered penicillin was Alexander Fleming.","Ilmuwan yang menemukan penisilin adalah Alexander Fleming."]],"trap":"\"Walking home, the rain started\" salah karena hujan tidak berjalan. Yang benar: <b>Walking home, I</b> got caught in the rain."},"items":"mc|___ the largest archipelago in the world.|Indonesia;Indonesia is;Indonesia being;That Indonesia|1|Kalimat butuh kata kerja utama: Indonesia is.\nmc|The Constitution gave the legislative branch ___ to pass laws.|the power;has the power;the power is;of the power|0|Butuh objek: the power.\nmc|___ coffee is grown in many regions, Indonesia exports a lot of it.|Because;Because of;Due to;Despite|0|Diikuti subjek + kata kerja: Because.\nmc|The museum, ___ in 1868, is the oldest in the country.|founded;was founded;which founded;it was founded|0|Frasa pasif yang dipersingkat: founded.\nmc|___ the exam, the students felt relieved.|Finished;Having finished;To finish;Have finished|1|Kejadian lebih dulu: Having finished.\nmc|It was in 1928 ___ the Youth Pledge was declared.|when;that;which;where|1|Kalimat cleft \"It was ... that\".\nmc|Not only ___ the test, but she also got the highest score.|she passed;did she pass;she did pass;passed she|1|Setelah \"Not only\" di awal kalimat, terjadi inversi: did she pass.\nmc|The book ___ on the table belongs to my professor.|lies;lying;is lying;lay|1|Frasa penjelas: lying.\nerr|[Because of] the road [was] closed, we [took] a [different] route.|0|Because|Diikuti subjek + kata kerja, jadi pakai because.\nerr|[Running] to catch the bus, [my bag] [fell] [into] a puddle.|1|I dropped my bag|Frasa pembuka harus merujuk ke pelakunya (orang yang berlari).\nerr|The data [were] [collected], [it was] analysed [using] SPSS.|2|and then it was|Dua kalimat lengkap tidak boleh hanya dipisah koma.\nerr|Many students [who] [they] [live] far away [take] the bus.|1|(hapus \"they\")|Who sudah menjadi subjek; jangan mengulang subjek.\nord|Although the test was difficult, most students passed.\nord|The researcher who conducted the study is from Bandung.\nord|Having finished the report, she went home."},{"id":"g-k2","lv":"kuliah","en":"Subject–Verb Agreement (Advanced)","idn":"Kesesuaian Subjek–Kata Kerja (Lanjut)","rule":{"points":["Abaikan frasa penyisip: The effects of the new policy <b>are</b>...","<b>Either/neither ... or/nor</b>: kata kerja mengikuti subjek yang terdekat","<b>The number of</b> + jamak → tunggal; <b>a number of</b> + jamak → jamak","Kata benda kolektif (team, government) biasanya tunggal dalam bahasa Inggris Amerika","Data, criteria, phenomena = jamak (datum, criterion, phenomenon = tunggal)"],"formula":["The number of ... is","A number of ... are"],"examples":[["The number of applicants has increased.","Jumlah pelamar telah meningkat."],["Neither the students nor the teacher was ready.","Baik siswa maupun guru tidak siap."]],"trap":"Dalam tulisan akademik, <b>the data are</b> lebih baku daripada \"the data is\"."},"items":"mc|The number of international students ___ increased this year.|have;has;are;were|1|The number of + kata kerja tunggal.\nmc|A number of studies ___ shown similar results.|has;have;is;was|1|A number of + kata kerja jamak.\nmc|Neither the manager nor the employees ___ aware of the change.|was;were;is;has been|1|Mengikuti subjek terdekat (employees): were.\nmc|The results of the survey ___ surprising.|was;were;is;has been|1|Subjeknya \"the results\" (jamak).\nmc|These phenomena ___ difficult to explain.|is;are;was;has been|1|Phenomena = jamak.\nmc|Either the teacher or the students ___ to clean the lab.|has;have;is;was|1|Subjek terdekat \"students\": have.\nmc|The team ___ training for the final match.|are being;is;were;have|1|Kata benda kolektif (AmE): is.\nmc|One of the main reasons for the delays ___ the weather.|were;are;was;have been|2|Subjeknya \"one\": was.\nerr|The increase in prices [have] [caused] [many] families [to struggle].|0|has|Subjeknya \"the increase\" (tunggal).\nerr|Each of the participants [were] [given] [a] [consent form].|0|was|Each of + kata kerja tunggal.\nerr|The criteria for selection [is] [explained] [in] [Section 3].|0|are|Criteria = jamak.\nerr|A number of factors [contributes] [to] [this] [problem].|0|contribute|A number of + kata kerja jamak.\nord|The number of smartphone users has grown rapidly.\nord|Neither the students nor the lecturer was late.\nord|The data were collected through interviews."},{"id":"g-k3","lv":"kuliah","en":"Parallel Structure","idn":"Struktur Paralel","rule":{"points":["Unsur yang dihubungkan dengan <b>and, or, but</b> harus berbentuk sama (sama-sama kata benda, V-ing, to V1, atau anak kalimat)","Pasangan korelatif juga harus paralel: both...and, either...or, neither...nor, not only...but also","Perbandingan dengan than/as harus membandingkan hal yang setara"],"formula":["V-ing, V-ing, and V-ing","to V1, to V1, and to V1"],"examples":[["She likes reading, writing, and swimming.","Dia suka membaca, menulis, dan berenang."],["The job requires not only skill but also patience.","Pekerjaan itu membutuhkan bukan hanya keterampilan tetapi juga kesabaran."]],"trap":"\"I like swimming, to read, and dance\" salah. Yang benar: swimming, <b>reading</b>, and <b>dancing</b>."},"items":"mc|The course teaches students how to read, write, and ___ critically.|thinking;to think;think;thought|2|Paralel dengan read, write: think.\nmc|She is intelligent, hardworking, and ___.|honesty;honest;honestly;with honesty|1|Paralel kata sifat: honest.\nmc|The researcher not only collected the data but also ___ it.|analysing;analysed;to analyse;analysis|1|Paralel dengan collected: analysed.\nmc|You can pay either in cash or ___.|by card;with using a card;card paying;to pay by card|0|Paralel dengan \"in cash\": by card.\nmc|Swimming is better exercise than ___.|to jog;jogging;jog;you jog|1|Paralel dengan swimming: jogging.\nmc|The hotel is comfortable, affordable, and ___ to the beach.|closely;close;closeness;closing|1|Paralel kata sifat: close.\nerr|The new policy aims [to reduce] costs, [improving] services, and [to increase] [efficiency].|1|to improve|Paralel to + V1: to improve.\nerr|He likes [hiking], [to swim], and [cycling] [on weekends].|1|swimming|Paralel V-ing: swimming.\nerr|The professor is [known] for his [knowledge], [patience], and [he is kind].|3|kindness|Paralel kata benda: kindness.\nerr|She [both] speaks English [and] [French] [fluently and accurately].|0|speaks both|Both harus diletakkan tepat sebelum unsur paralel: speaks both English and French.\nord|The project was challenging, interesting, and rewarding.\nord|She not only passed the test but also won a scholarship.\nord|Students should read carefully, think critically, and write clearly."},{"id":"g-k4","lv":"kuliah","en":"Word Forms","idn":"Bentuk Kata (Kata Benda, Kerja, Sifat, Keterangan)","rule":{"points":["Setelah artikel (a, the) atau kata sifat: <b>kata benda</b> (the <i>development</i>)","Sebelum kata benda: <b>kata sifat</b> (a <i>significant</i> increase)","Menjelaskan kata kerja atau kata sifat: <b>kata keterangan</b> (-ly) (increase <i>significantly</i>)","Akhiran umum: kata benda -tion, -ment, -ness, -ity; kata sifat -ful, -ous, -ive, -al, -able; kata kerja -ize, -en, -ify"],"formula":["the + Noun","Adj + Noun","Verb + Adverb"],"examples":[["The economy grew rapidly.","Ekonomi tumbuh dengan cepat."],["There was a rapid growth in exports.","Terjadi pertumbuhan ekspor yang cepat."]],"trap":"Kata keterangan (rapidly) tidak boleh menjelaskan kata benda: a <b>rapid</b> growth."},"items":"mc|The ___ of the new bridge took three years.|construct;construction;constructive;constructively|1|Setelah \"the\": kata benda.\nmc|There has been a ___ increase in tourism.|significant;significance;significantly;signify|0|Sebelum kata benda: kata sifat.\nmc|Prices rose ___ after the announcement.|sharp;sharpen;sharply;sharpness|2|Menjelaskan kata kerja \"rose\": kata keterangan.\nmc|The results were ___ different from our predictions.|complete;completely;completion;completed|1|Menjelaskan kata sifat: kata keterangan.\nmc|The government should ___ public transport.|improvement;improve;improved;improving|1|Setelah should: kata kerja.\nmc|Her ___ to the project was very valuable.|contribute;contributor;contribution;contributive|2|Setelah \"her\": kata benda (kontribusi).\nmc|This method is more ___ than the old one.|effect;effective;effectively;effectiveness|1|Setelah \"more\": kata sifat.\nmc|We need to ___ our understanding of the problem.|deep;deeply;deepen;depth|2|Setelah \"to\": kata kerja (deepen).\nerr|The [develop] of [renewable] energy is [crucial] [for the future].|0|development|Setelah \"the\": kata benda.\nerr|The population has grown [rapid] [in] [recent] [decades].|0|rapidly|Menjelaskan kata kerja: rapidly.\nerr|She gave a very [clearly] [explanation] [of] the [theory].|0|clear|Sebelum kata benda: kata sifat.\nerr|Students must [analysis] the data [carefully] [before] [writing].|0|analyse|Setelah must: kata kerja.\nord|The economy grew rapidly last year.\nord|There was a significant improvement in the results.\nord|The researchers carefully analysed the data."},{"id":"g-k5","lv":"kuliah","en":"Tense Review for Academic Writing","idn":"Tenses dalam Tulisan Akademik","rule":{"points":["<b>Simple present</b>: fakta umum, teori, isi tabel/gambar (Table 1 <i>shows</i>...), dan pendapat penulis","<b>Simple past</b>: apa yang dilakukan dalam penelitianmu (Data <i>were collected</i>...) dan hasil temuan spesifik","<b>Present perfect</b>: ringkasan penelitian sebelumnya sampai sekarang (Many studies <i>have examined</i>...)","Bagian metode biasanya memakai past passive"],"formula":["Literature review → present perfect","Method & results → simple past","Discussion & conclusion → simple present"],"examples":[["Previous studies have shown that sleep affects memory.","Penelitian sebelumnya telah menunjukkan bahwa tidur memengaruhi ingatan."],["Fifty students participated in this study.","Lima puluh siswa berpartisipasi dalam penelitian ini."]],"trap":"Tabel dan gambar memakai simple present: Figure 2 <b>shows</b> (bukan showed)."},"items":"mc|Many researchers ___ the effects of social media on teenagers.|examine;have examined;examining;had examine|1|Ringkasan penelitian sampai sekarang: have examined.\nmc|In this study, data ___ through online questionnaires.|are collecting;were collected;collect;have collected|1|Metode penelitianmu: past passive.\nmc|Table 2 ___ the average sc
