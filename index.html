    <div><button type="button" class="btn" id="go">Lanjut</button></div></section></div>`);
  $("#go").onclick=nextRound;$("#go").focus({preventScroll:true});
}
function showResult(){
  const acc=RUN.total?RUN.correct/RUN.total:0;
  const stars=acc>=.9?3:acc>=.7?2:acc>=.4?1:0;
  let unlockMsg="";
  if(RUN.mode==="level"){
    const prev=progress[RUN.unit]||0;
    if(stars>prev)progress[RUN.unit]=stars;
    const nx=sectionOf(RUN.unit).units[sectionOf(RUN.unit).units.indexOf(RUN.unit)+1];if(stars>=1&&prev<1&&nx)unlockMsg=`Unit ${nx} terbuka!`;
    saveAll();
  }
  const missed=[...RUN.missed.values()];
  const nxs=RUN.mode==="level"?sectionOf(RUN.unit).units[sectionOf(RUN.unit).units.indexOf(RUN.unit)+1]:null;
  const nextU=nxs&&unlocked(nxs)?nxs:null;
  setCrumbs([{label:"Peta",go:showMap},{label:"Hasil",go:()=>{}}]);
  mount(`<section class="panel">
    ${RUN.mode==="level"?`<div class="bigstars" aria-label="${stars} dari 3 bintang">${starsHtml(stars)}</div>`:""}
    <h2>${acc>=.9?"Luar biasa!":acc>=.7?"Bagus sekali!":acc>=.4?"Lumayan, terus berlatih!":"Ayo coba lagi!"}</h2>
    <p>${RUN.correct} dari ${RUN.total} jawaban benar (${Math.round(acc*100)}%). ${unlockMsg?`<b>${unlockMsg}</b>`:""}</p>
    ${RUN.mode==="level"?`<p class="muted small">3 bintang ≥ 90% · 2 bintang ≥ 70% · 1 bintang ≥ 40%</p>`:""}
    ${missed.length?`<div><h3 style="font-size:1rem;margin-bottom:8px">${missed.every(o=>o.g)?"Jawaban benar untuk soal yang terlewat":"Yang perlu diulang (kosakata masuk Kotak ulang)"}</h3><div class="miss-list">${missed.map(o=>`<span class="chip">${o.e?`<span class="emo">${o.e}</span> `:""}<b>${esc(o.w)}</b> · ${esc(o.idn)}</span>`).join("")}</div></div>`:`<p>Tidak ada kata yang salah.</p>`}
    <div class="row">
      ${nextU?`<button type="button" class="btn" id="nextU">Lanjut ke Unit ${nextU}</button>`:""}
      ${RUN.mode==="level"?`<button type="button" class="btn ${nextU?"ghost":""}" id="again">Ulangi unit ini</button>`:`<button type="button" class="btn" id="again">Main lagi</button>`}
      <button type="button" class="btn ghost" id="toMap">Ke peta</button>
    </div></section>`);
  if(nextU)$("#nextU").onclick=()=>showUnit(nextU);
  $("#again").onclick=()=>{if(RUN.mode==="level")startLevel(RUN.unit);else if(RUN.mode==="free")startFree(RUN.model,RUN.arg);else startReview();};
  $("#toMap").onclick=showMap;
}


// ---------- babak baru: Hafalan Kilat, Bentuk Kalimat, Tantangan 60 Detik ----------
const normAns=v=>v.trim().toLowerCase().replace(/\s+/g," ").replace(/[’‘]/g,"'");
function buildMemo(pool){
  let p=pool.filter(o=>o.w.length<=40);if(p.length<4)return null;
  const ch=sample(p,Math.min(7,p.length));const ex=ch.pop();
  return {type:"memo",words:ch.slice(0,6),ex:{o:ex}};
}
function tilesFor(o){
  const s=o.s;let toks=s.split(" ");
  const key=(isExp(o)?o.f:o.w).toLowerCase();const kw=key.split(" ").length;
  let ki=-1;
  for(let i=0;i+kw<=toks.length;i++){const seg=toks.slice(i,i+kw).join(" ").toLowerCase().replace(/[.,!?;:"“”]/g,"");if(seg===key||(kw===1&&seg.startsWith(key))){ki=i;break;}}
  let tiles=[];
  for(let i=0;i<toks.length;i++){
    if(i===ki){tiles.push({t:toks.slice(i,i+kw).join(" "),key:true});i+=kw-1;}
    else tiles.push({t:toks[i],key:false});
  }
  // gabungkan kepingan pendek bila terlalu banyak
  let guard=0;
  while(tiles.length>9&&guard++<20){
    let best=-1,len=1e9;
    for(let i=0;i<tiles.length-1;i++){if(tiles[i].key||tiles[i+1].key)continue;const L=tiles[i].t.length+tiles[i+1].t.length;if(L<len){len=L;best=i;}}
    if(best<0)break;tiles.splice(best,2,{t:tiles[best].t+" "+tiles[best+1].t,key:false});
  }
  const answer=tiles.map(x=>x.t).join(" ");
  let sh=shuffle(tiles),g=0;while(sh.map(x=>x.t).join(" ")===answer&&g++<12)sh=shuffle(tiles);
  return {o,toks:sh,answer};
}
function buildSentence(pool){
  const p=pool.filter(o=>o.s);if(p.length<7)return null;
  const ch=sample(p,Math.min(8,p.length));const ex=ch.length>7?ch.pop():ch[0];
  return {type:"build",items:ch.slice(0,7).map(tilesFor),ex:tilesFor(ex)};
}
function buildBlitz(pool){
  const p=pool.filter(o=>o.idn);if(p.length<4)return null;
  const R={type:"blitz",pool:p,secs:60};R.ex=blitzPair(R);return R;
}
function blitzPair(R){
  const o=pick(R.pool);const match=Math.random()<.5;
  let shown=o.idn;
  if(!match){const others=R.pool.filter(x=>x.idn!==o.idn&&!sameSyn(x,o));shown=others.length?pick(others).idn:o.idn;}
  return {o,shown,match:shown===o.idn};
}

// Hafalan Kilat
function renderMemo(){
  const R=RUN.R;R.phase="study";
  mount(`<div style="display:flex;flex-direction:column;gap:12px">${hud()}<section class="qcard">${head()}
    <p class="muted small">Langkah 1 dari 2 · Pelajari ${R.words.length} kartu ini</p>
    <div class="memo-grid">${R.words.map((o,k)=>`<div class="memo-card">
      ${o.e?`<span class="emo" aria-hidden="true">${o.e}</span>`:""}<b>${esc(o.w)}</b><span class="muted">${esc(o.idn)}</span>${isExp(o)?`<span class="small muted">${esc(o.d)}</span>`:""}</div>`).join("")}</div>
    <ul class="howlist small"><li>Baca setiap kata dengan suara keras sambil melihat gambarnya.</li><li>Bayangkan gambarnya, atau buat kalimat sendiri di kepala.</li><li>Tutup mata dan coba sebutkan keenam kata sebelum lanjut.</li></ul>
    <div class="row"><button type="button" class="btn" id="memoGo">Aku sudah siap, uji aku</button></div></section></div>`);
  $("#memoGo").onclick=()=>{R.queue=shuffle(R.words.slice());R.tried=new Set();R.firstOk=0;renderMemoAsk();};
  $("#memoGo").focus({preventScroll:true});
}
function memoHint(w){return [...w].map((c,i)=>c===" "?"   ":/[a-z]/i.test(c)?(i===0||w[i-1]===" "?c:"_"):c).join(" ");}
function renderMemoAsk(){
  const R=RUN.R;if(!R.queue.length)return memoDone();
  const o=R.queue[0];RUN.answered=false;
  mount(`<div style="display:flex;flex-direction:column;gap:12px">${hud()}<section class="qcard">${head()}
    <div class="row between"><span class="muted small">Langkah 2 dari 2 · Sisa ${R.queue.length} kata</span><span class="muted small">Benar sekali coba: ${R.firstOk}/${R.words.length}</span></div>
    <div class="prompt">${cue(o,true)}</div>${isExp(o)?`<p class="defn">“${esc(o.d)}”</p>`:""}
    <p class="memo-hint" aria-label="Petunjuk huruf awal">${esc(memoHint(o.w))}</p>
    <div class="row"><input class="typed" id="typed" aria-label="Ketik kata dari ingatan" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ketik dari ingatan"><button type="button" class="btn" id="check">Cek</button></div>
    <div id="fb"></div></section></div>`);
  const inp=$("#typed");inp.focus();inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();memoCheck();}};$("#check").onclick=memoCheck;
}
function memoCheck(){
  const R=RUN.R;if(RUN.answered)return;const o=R.queue[0];const v=normAns($("#typed").value);
  if(!v){$("#typed").focus();return;}
  RUN.answered=true;const ok=v===normAns(o.w);const first=!R.tried.has(o);
  if(first){R.tried.add(o);record(o,ok);if(ok)R.firstOk++;}
  $("#typed").disabled=true;$("#check").disabled=true;
  if(ok)R.queue.shift();else{R.queue.shift();R.queue.splice(Math.min(2,R.queue.length),0,o);}
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><div><span class="v"><b>${ok?"Hafal!":"Belum tepat."}</b></span> <b>${esc(o.w)}</b> · ${esc(o.idn)}${ok?"":`<div class="small muted">Jawabanmu: ${esc(v)}. Kata ini akan muncul lagi sebentar lagi.</div>`}</div>
    <div class="row"><button type="button" class="btn sm" id="mnext">${R.queue.length?"Lanjut":"Selesai"}</button></div></div>`;
  
  $("#mnext").onclick=renderMemoAsk;$("#mnext").focus({preventScroll:true});
}
function memoDone(){
  const R=RUN.R;
  mount(`<div style="display:flex;flex-direction:column;gap:12px">${hud()}<section class="qcard">${head()}
    <p>Semua ${R.words.length} kata sudah kamu ingat. <b>${R.firstOk}</b> di antaranya benar pada percobaan pertama.</p>
    <div class="memo-grid">${R.words.map(o=>`<div class="memo-card done">${o.e?`<span class="emo" aria-hidden="true">${o.e}</span>`:""}<b>${esc(o.w)}</b><span class="muted">${esc(o.idn)}</span></div>`).join("")}</div>
    <div class="row"><button type="button" class="btn" id="mnext">${RUN.mode==="level"?"Lanjut":"Selesai"}</button></div></section></div>`);
  $("#mnext").onclick=roundDone;$("#mnext").focus({preventScroll:true});
}

// Bentuk Kalimat
function renderBuildItem(){
  const it=RUN.R.items[RUN.qi];it.built=[];RUN.answered=false;
  mount(shell(`<div class="prompt">${cue(it.o,true)}</div>
    <p class="muted small">Kata kunci: <b>${esc(isExp(it.o)?it.o.f:it.o.w)}</b>. Susun kepingan menjadi satu kalimat utuh.</p>
    <div class="buildline" id="bsent"></div><div class="toks" id="toks"></div>
    <div class="row"><button type="button" class="btn ghost" id="oclear">Hapus</button><button type="button" class="btn" id="check" disabled>Cek jawaban</button></div>`));
  drawBuild();
}
function drawBuild(){
  const it=RUN.R.items[RUN.qi];
  $("#bsent").innerHTML=it.built.length?it.built.map((k,j)=>`<button type="button" class="${it.toks[k].key?"key":""}" data-j="${j}" ${RUN.answered?"disabled":""} aria-label="Hapus ${esc(it.toks[k].t)}">${esc(it.toks[k].t)}</button>`).join(""):`<span class="muted small">Ketuk kepingan di bawah…</span>`;
  $("#toks").innerHTML=it.toks.map((x,k)=>`<button type="button" class="tok ${x.key?"key":""}" data-k="${k}" ${it.built.includes(k)||RUN.answered?"disabled":""}>${esc(x.t)}</button>`).join("");
  SCR().querySelectorAll("#toks .tok").forEach(b=>b.onclick=()=>{it.built.push(+b.dataset.k);drawBuild();SCR().querySelector("#toks .tok:not(:disabled)")?.focus({preventScroll:true});});
  SCR().querySelectorAll("#bsent button").forEach(b=>b.onclick=()=>{it.built.splice(+b.dataset.j,1);drawBuild();});
  $("#check").disabled=RUN.answered||it.built.length!==it.toks.length;$("#oclear").disabled=RUN.answered;
  $("#oclear").onclick=()=>{it.built=[];drawBuild();};
  $("#check").onclick=()=>{if(RUN.answered)return;const v=it.built.map(k=>it.toks[k].t).join(" ");const ok=v===it.answer;record(it.o,ok);drawBuild();
    const extra=(ok?"":`Susunanmu: ${esc(v)}<br>`)+(isExp(it.o)||it.o.g?"":`Kalimat: <i>${esc(it.answer)}</i>`);feedback(ok,it.o,extra);};
  if(!RUN.answered&&!SCR().querySelector("#toks .tok:not(:disabled)"))$("#check").focus({preventScroll:true});
}

// Tantangan 60 Detik
function renderBlitz(){
  const R=RUN.R;R.left=R.secs;R.ok=0;R.bad=0;R.cur=blitzPair(R);R.started=Date.now();
  mount(`<div style="display:flex;flex-direction:column;gap:12px">${hud()}<section class="qcard">${head()}
    <div class="row between"><span class="blitz-time" id="btime">${R.secs}</span><span class="muted small">✓ <b id="bok">0</b> · ✗ <b id="bbad">0</b></span></div>
    <div class="blitz-card" id="bcard"></div>
    <div class="tfrow"><button type="button" class="opt" id="byes"><kbd>1</kbd><span>✓ Cocok</span></button><button type="button" class="opt" id="bno"><kbd>2</kbd><span>✗ Tidak cocok</span></button></div>
    <div id="fb"></div></section></div>`);
  const draw=()=>{const c=R.cur;$("#bcard").innerHTML=`${c.o.e?`<span class="emo" aria-hidden="true">${c.o.e}</span>`:""}<b>${esc(c.o.w)}</b><span>=</span><span class="blitz-mean">${esc(c.shown)}</span>`;};
  const answer=yes=>{if(R.over)return;const c=R.cur;const ok=yes===c.match;
    if(ok)R.ok++;else{R.bad++;RUN.missed.set(c.o.u+"|"+c.o.w,c.o);addReview(c.o);}
    STATS.answered++;if(ok)STATS.correct++;
    const card=$("#bcard");card.classList.remove("flash-ok","flash-no");void card.offsetWidth;card.classList.add(ok?"flash-ok":"flash-no");
    $("#bok").textContent=R.ok;$("#bbad").textContent=R.bad;R.cur=blitzPair(R);draw();};
  $("#byes").onclick=()=>answer(true);$("#bno").onclick=()=>answer(false);
  R.key=e=>{if(RUN.R!==R||R.over)return;if(e.key==="1"||e.key==="ArrowLeft"){e.preventDefault();answer(true);}if(e.key==="2"||e.key==="ArrowRight"){e.preventDefault();answer(false);}};
  document.addEventListener("keydown",R.key);
  draw();$("#byes").focus({preventScroll:true});
  R.timer=setInterval(()=>{
    if(RUN.R!==R||!document.getElementById("btime")){clearInterval(R.timer);document.removeEventListener("keydown",R.key);return;}
    R.left=Math.max(0,R.secs-Math.floor((Date.now()-R.started)/1000));$("#btime").textContent=R.left;
    if(R.left<=0)blitzEnd();
  },250);
}
function blitzEnd(){
  const R=RUN.R;R.over=true;clearInterval(R.timer);document.removeEventListener("keydown",R.key);saveAll();
  const pts=Math.max(0,Math.min(10,R.ok-R.bad));
  RUN.total+=10;RUN.rt+=10;RUN.correct+=pts;RUN.rc+=pts;
  SCR().querySelectorAll("#byes,#bno").forEach(b=>b.disabled=true);
  $("#fb").innerHTML=`<div class="fb ${pts>=7?"ok":"no"}"><div><span class="v"><b>Waktu habis!</b></span> ${R.ok} benar, ${R.bad} salah dalam 60 detik.
    <div class="small muted">Nilai babak: ${pts}/10 (jumlah benar dikurangi salah, maksimal 10).</div></div>
    <div class="row"><button type="button" class="btn sm" id="mnext">${RUN.mode==="level"?"Lanjut":"Selesai"}</button></div></div>`;
  $("#mnext").onclick=roundDone;$("#mnext").focus({preventScroll:true});
}


// ---------- pengganti babak suara: Tebak Arti, Ingat Urutan, Acak Huruf ----------
function buildMean(pool){
  const p=pool.filter(o=>o.idn);if(p.length<5)return null;
  const chosen=sample(p,itemsN()+1);const ex=chosen.pop();
  const make=o=>{const opts=shuffle([o].concat(distract(o,p,3,"idn")));return {o,opts,ans:opts.indexOf(o)};};
  return {type:"mean",items:chosen.map(make),ex:make(ex)};
}
function buildFlash(pool){
  const p=pool.filter(o=>o.w.length<=24);if(p.length<8)return null;
  const n=RUN&&RUN.mode==="free"?5:3;const items=[];const used=new Set();
  for(let i=0;i<n;i++){const grp=sample(p.filter(o=>!used.has(o)),4);if(grp.length<4)break;grp.forEach(o=>used.add(o));
    let cards=shuffle(grp),g=0;while(cards.every((c,k)=>c===grp[k])&&g++<8)cards=shuffle(grp);items.push({words:grp,cards});}
  return items.length?{type:"flash",items,ex:{words:sample(p,3)}}:null;
}
function scrambleOf(w){const L=[...w];let s=shuffle(L),g=0;while(s.join("")===w&&g++<12)s=shuffle(L);return s;}
function buildScramble(pool){
  let p=pool.filter(o=>/^[A-Za-z]{4,11}$/.test(o.w));if(p.length<4)return null;
  const f=p.filter(o=>o.idn.toLowerCase().split(" (")[0]!==o.w.toLowerCase());if(f.length>=4)p=f;
  const ch=sample(p,Math.min(itemsN()+1,p.length));const ex=ch.pop();
  return {type:"scramble",items:ch.map(o=>({o,letters:scrambleOf(o.w.toLowerCase())})),ex:{o:ex,letters:scrambleOf(ex.w.toLowerCase())}};
}
function renderFlash(){
  const R=RUN.R,it=R.items[RUN.qi];it.picked=[];RUN.answered=false;const secs=Math.max(4,it.words.length+1);
  mount(shell(`<p class="muted small" id="flashMsg">Ingat urutan keempat kata ini. Kata akan disembunyikan dalam <b id="fcount">${secs}</b> detik.</p>
    <div class="flash-row" id="flashShow">${it.words.map((o,k)=>`<div class="flash-card"><span class="tag">${k+1}</span>${o.e?`<span class="emo" aria-hidden="true">${o.e}</span>`:""}<b>${esc(o.w)}</b></div>`).join("")}</div>
    <div class="row"><button type="button" class="btn ghost sm" id="fready">Aku sudah ingat</button></div>
    <div id="flashPlay" hidden><div class="opts" id="seqcards"></div><div class="row"><button type="button" class="btn ghost sm" id="reset">Ulang pilihan</button><button type="button" class="btn" id="check" disabled>Cek urutan</button></div></div>`));
  let left=secs;const tick=setInterval(()=>{if(RUN.R!==R||RUN.R.items[RUN.qi]!==it||!document.getElementById("fcount")){clearInterval(tick);return;}left--;$("#fcount").textContent=left;if(left<=0){clearInterval(tick);hide();}},1000);
  const hide=()=>{clearInterval(tick);if(!document.getElementById("flashShow"))return;$("#flashShow").hidden=true;$("#fready").hidden=true;
    $("#flashMsg").innerHTML="Ketuk kata-kata ini sesuai <b>urutan kemunculannya tadi</b>.";$("#flashPlay").hidden=false;draw();SCR().querySelector(".seqc")?.focus({preventScroll:true});};
  $("#fready").onclick=hide;$("#fready").focus({preventScroll:true});
  const draw=()=>{
    $("#seqcards").innerHTML=it.cards.map((o,k)=>{const n=it.picked.indexOf(k);return `<button type="button" class="opt seqc" data-k="${k}" ${n>=0||RUN.answered?"disabled":""}><kbd>${n>=0?n+1:"·"}</kbd><span>${o.e?o.e+" ":""}${esc(o.w)}</span></button>`;}).join("");
    SCR().querySelectorAll(".seqc").forEach(b=>b.onclick=()=>{if(RUN.answered)return;it.picked.push(+b.dataset.k);draw();SCR().querySelector(".seqc:not(:disabled)")?.focus({preventScroll:true});if(it.picked.length===it.cards.length)$("#check").focus({preventScroll:true});});
    $("#check").disabled=RUN.answered||it.picked.length!==it.cards.length;
  };
  $("#reset").onclick=()=>{if(RUN.answered)return;it.picked=[];draw();};
  $("#check").onclick=()=>{
    if(RUN.answered)return;let all=true;
    it.words.forEach((o,pos)=>{const ok=it.cards[it.picked[pos]]===o;if(!ok)all=false;record(o,ok);});
    RUN.answered=true;draw();const last=RUN.qi>=R.items.length-1;
    $("#fb").innerHTML=`<div class="fb ${all?"ok":"no"}"><div><b class="v">${all?"Urutan benar!":"Belum tepat."}</b> Urutan yang benar: ${it.words.map(o=>`<b>${esc(o.w)}</b>`).join(" → ")}</div><div class="row"><button type="button" class="btn sm" id="next">${last?"Selesai babak":"Lanjut"}</button></div></div>`;
    $("#next").onclick=()=>{if(last)roundDone();else{RUN.qi++;renderFlash();}};$("#next").focus({preventScroll:true});
  };
}
function renderScramble(){
  const R=RUN.R,it=R.items[RUN.qi];it.built=[];RUN.answered=false;
  mount(shell(`<div class="prompt">${cue(it.o,true)}</div><p class="muted small">Susun ${it.letters.length} huruf ini menjadi kata yang tepat.</p>
    <div class="buildline" id="bsent"></div><div class="toks" id="toks"></div>
    <div class="row"><button type="button" class="btn ghost" id="oclear">Hapus</button><button type="button" class="btn" id="check" disabled>Cek jawaban</button></div>`));
  const draw=()=>{
    $("#bsent").innerHTML=it.built.length?it.built.map((k,j)=>`<button type="button" data-j="${j}" ${RUN.answered?"disabled":""}>${esc(it.letters[k])}</button>`).join(""):`<span class="muted small">Ketuk huruf di bawah…</span>`;
    $("#toks").innerHTML=it.letters.map((c,k)=>`<button type="button" class="tok letter" data-k="${k}" ${it.built.includes(k)||RUN.answered?"disabled":""}>${esc(c)}</button>`).join("");
    SCR().querySelectorAll("#toks .tok").forEach(b=>b.onclick=()=>{it.built.push(+b.dataset.k);draw();SCR().querySelector("#toks .tok:not(:disabled)")?.focus({preventScroll:true});});
    SCR().querySelectorAll("#bsent button").forEach(b=>b.onclick=()=>{it.built.splice(+b.dataset.j,1);draw();});
    $("#check").disabled=RUN.answered||it.built.length!==it.letters.length;$("#oclear").disabled=RUN.answered;
    if(!RUN.answered&&it.built.length===it.letters.length)$("#check").focus({preventScroll:true});
  };
  $("#oclear").onclick=()=>{it.built=[];draw();};
  $("#check").onclick=()=>{if(RUN.answered)return;const v=it.built.map(k=>it.letters[k]).join("");const ok=v===it.o.w.toLowerCase();record(it.o,ok);draw();
    feedback(ok,it.o,ok?"":`Susunanmu: ${esc(v)}`);};
  draw();SCR().querySelector("#toks .tok")?.focus({preventScroll:true});
}

document.addEventListener("keydown",e=>{
  if(!RUN||e.ctrlKey||e.metaKey||e.altKey)return;
