t yang menjelaskan rasa jusnya.||-|The juice is sweet and cold|Manis dan dingin."},{"region":"sd-hewan","title":"A Rainy Day at the Farm","type":"Teks cerita pendek","p":["Today I am at my uncle's farm. It is raining and the sky is grey. The cows are in the barn. The ducks are happy because they like water. A small cat is sleeping under the table. My uncle says the rain is good for the trees and the flowers. After the rain, I see a rainbow in the sky. It is beautiful!"],"q":"main|Where is the writer?|At school;At the zoo;At an uncle's farm;At the beach|2|Today I am at my uncle's farm|Di peternakan paman.\ndetail|What is the weather like?|Sunny;Rainy;Windy;Snowy|1|It is raining and the sky is grey|Hujan.\ninfer|Why are the ducks happy?|They are eating;They like water;They are sleeping;They see the cat|1|they like water|Bebek suka air.\ndetail|What does the writer see after the rain?|A rainbow;A bird;A plane;The sun only|0|I see a rainbow in the sky|Pelangi.\nev|Ketuk kalimat yang menyebut di mana sapi-sapi berada.||-|The cows are in the barn|Di kandang."},{"region":"sd-kota","title":"My Hobby","type":"Teks deskripsi","p":["My name is Arif. My hobby is swimming. I go to the swimming pool every Saturday with my father. The pool is near the post office and the library. We go there by bus. My father is a doctor, but on Saturday he is free. I want to be a swimming champion one day."],"q":"main|What is the text mainly about?|Arif's school;Arif's hobby;Arif's father's job;The library|1|My hobby is swimming|Hobi Arif berenang.\ndetail|When does Arif go swimming?|Every Sunday;Every Saturday;Every Monday;Every day|1|every Saturday|Setiap Sabtu.\ndetail|What is near the swimming pool?|A hospital and a school;The post office and the library;A market;A park|1|The pool is near the post office and the library|Kantor pos dan perpustakaan.\ndetail|What is Arif's father's job?|A teacher;A pilot;A doctor;A farmer|2|My father is a doctor|Dokter.\nev|Ketuk kalimat yang menunjukkan cita-cita Arif.||-|I want to be a swimming champion one day|Ingin jadi juara renang."},{"region":"diri","title":"Meet My Cousin Nadia","type":"Descriptive text","p":["My cousin Nadia is fifteen years old. She is slim and quite tall, with long wavy hair and a round face. She usually wears jeans, a T-shirt, and white sneakers, but on special days she likes to wear a batik dress.","Nadia is a cheerful and confident person. She always smiles when she meets people, and she is never afraid to give her opinion in class. However, she can be a little stubborn. When she believes she is right, it is hard to change her mind.","When Nadia feels stressed, she listens to music or writes in her diary. In my opinion, she is the funniest person in our family. As the saying goes, she can \"break the ice\" in any situation."],"q":"main|What is the text mainly about?|Nadia's clothes;The writer's cousin, Nadia;How to write a diary;A family party|1|-|Teks menggambarkan Nadia: penampilan dan kepribadian.\ndetail|What does Nadia usually wear?|A batik dress;Jeans, a T-shirt, and sneakers;A school uniform;A long skirt|1|She usually wears jeans, a T-shirt, and white sneakers|Jeans, kaus, dan sepatu kets.\nvocab|\"She can be a little <b>stubborn</b>.\" Stubborn means ...|keras kepala;pemalu;rajin;ceroboh|0|-|Stubborn = keras kepala.\ninfer|What does \"break the ice\" probably mean here?|To make people feel relaxed;To break something;To feel cold;To be angry|0|she is the funniest person in our family|Nadia lucu, jadi ia bisa mencairkan suasana.\nev|Ketuk kalimat yang menunjukkan apa yang Nadia lakukan saat stres.||-|When Nadia feels stressed, she listens to music or writes in her diary|Mendengarkan musik atau menulis diary."},{"region":"relasi","title":"Grandma's Old Stories","type":"Recount text","p":["Last weekend, my whole family gathered at my grandmother's house. My aunts, uncles, and cousins came from different cities. After dinner, we sat together in the living room, and Grandma told us stories about her childhood.","She said that when she was a little girl, she had no toys from shops. She and her friends made dolls from banana leaves and played traditional games like congklak and hide-and-seek. She also told us about an old superstition: if you sweep the floor at night, your luck will go away. We all laughed, but my little cousin looked worried.","That night, I realised that family time is precious. Even without phones, we talked and laughed for hours."],"q":"purpose|What is the purpose of the text?|To explain a game;To tell about a family gathering;To describe a house;To give advice about luck|1|-|Recount menceritakan pengalaman berkumpul keluarga.\ndetail|What did Grandma's toys come from?|Shops;Banana leaves;Plastic;Wood from a factory|1|made dolls from banana leaves|Daun pisang.\ndetail|What is the superstition about?|Eating at night;Sweeping the floor at night;Playing congklak;Cutting hair|1|if you sweep the floor at night, your luck will go away|Menyapu di malam hari.\ninfer|Why did the little cousin look worried?|He was hungry;He believed the superstition;He lost a game;He wanted to go home|1|my little cousin looked worried|Sepupu kecil percaya pada takhayul itu.\nvocab|\"Family time is <b>precious</b>.\" Precious means ...|sangat berharga;membosankan;singkat;mahal sekali|0|-|Precious = berharga."},{"region":"rumah","title":"Moving to a New Boarding House","type":"Recount text","p":["When I started senior high school, I moved to a boarding house near the school. My room was small but bright. It had a single bed, a desk, a wardrobe, and a small fan. The bathroom was shared with three other students.","On the first day, I unpacked my clothes and swept the floor. Then I bought a bucket, detergent, and a few hangers from the shop downstairs. Doing my own laundry was difficult at first. I once put a red shirt in with my white uniform, and the uniform turned pink!","Now I have a routine. I wake up at five, make my bed, and tidy my desk before school. Living alone has taught me to be independent."],"q":"main|What is the text mainly about?|The writer's school;Living in a boarding house;How to wash clothes;A shop downstairs|1|-|Teks tentang pengalaman tinggal di kos.\ndetail|What was shared with other students?|The bedroom;The desk;The bathroom;The fan|2|The bathroom was shared with three other students|Kamar mandi.\ninfer|Why did the uniform turn pink?|It was old;It was washed with a red shirt;The detergent was pink;It was dried in the sun|1|I once put a red shirt in with my white uniform|Dicuci bersama kaus merah.\nseq|What does the writer do right after waking up?|Tidies the desk;Makes the bed;Goes to school;Does laundry|1|I wake up at five, make my bed|Merapikan tempat tidur.\nev|Ketuk kalimat yang menunjukkan pelajaran yang didapat penulis.||-|Living alone has taught me to be independent|Hidup sendiri mengajarkan kemandirian."},{"region":"makan","title":"Smart Shopping at the Market","type":"Procedure / tips text","p":["Shopping for food can be cheap and healthy if you plan well. Here are some tips for shopping at a traditional market.","First, make a shopping list before you leave home. This stops you from buying things you do not need. Second, go early in the morning, when vegetables and fish are fresh. Check that vegetables are bright and firm, and that fish has clear eyes. Third, compare prices at a few stalls before you buy. Many sellers will give a discount if you buy a kilo or more. Finally, bring your own shopping bag to reduce plastic waste.","By following these tips, you can save money, eat better, and help the environment at the same time."],"q":"main|What is the text about?|A recipe;Tips for shopping at a traditional market;The history of markets;How to catch fish|1|-|Teks berisi tips berbelanja di pasar tradisional.\nref|\"<b>This</b> stops you from buying things you do not need.\" \"This\" refers to ...|going early;making a shopping list;comparing prices;bringing a bag|1|This stops you from buying things you do not need|Membuat daftar belanja.\ndetail|How can you tell that fish is fresh?|It smells strong;It has clear eyes;It is very cheap;It is soft|1|fish has clear eyes|Mata ikan jernih.\ndetail|When might sellers give a discount?|When you buy a kilo or more;When you come late;When you pay by card;When you bring a friend|0|Many sellers will give a discount if you buy a kilo or more|Membeli satu kilo atau lebih.\npurpose|Why should you bring your own shopping bag?|To carry more food;To reduce plastic waste;To get a discount;To look stylish|1|bring your own shopping bag to reduce plastic waste|Mengurangi sampah plastik."},{"region":"alam","title":"When the River Flooded","type":"Recount text","p":["Last February, heavy rain fell for three days in our village. On the third night, the river overflowed and the water entered our houses. By morning, the water was knee-deep in our living room.","My family moved our things to the second floor. Volunteers came with rubber boats to help elderly people move to the village hall. We stayed there for two nights. The volunteers gave us blankets, clean water, and rice.","After the flood, everyone worked together to clean the mud from the streets. The village head said that the flood happened partly because people threw rubbish into the river and many trees on the hills had been cut down. Since then, our village has organised a monthly river clean-up and planted hundreds of trees."],"q":"main|What is the text mainly about?|A holiday in a village;A flood and what the village learned from it;How to use a rubber boat;Planting trees in the city|1|-|Teks menceritakan banjir dan pelajaran dari kejadian itu.\ndetail|How deep was the water in the morning?|Ankle-deep;Knee-deep;Waist-deep;Above the roof|1|the water was knee-deep in our living room|Setinggi lutut.\ndetail|Where did elderly people go?|To the hospital;To the village hall;To the school;To the hills|1|help elderly people move to the village hall|Ke balai desa.\ninfer|According to the village head, what made the flood worse?|Strong winds;Rubbish in the river and cut trees;An earthquake;Old houses|1|people threw rubbish into the river and many trees on the hills had been cut down|Sampah dan penebangan pohon.\nev|Ketuk kalimat yang menunjukkan tindakan desa setelah banjir.||-|our village has organised a monthly river clean-up and planted hundreds of trees|Bersih sungai bulanan dan menanam pohon."},{"region":"hobi","title":"A Film Review: The Little Drummer","type":"Review text","p":["The Little Drummer is a family film about Bayu, a boy from a small town who dreams of playing drums in a national music competition. His family is poor, so he practises on old buckets and pans.","The actor who plays Bayu gives an amazing performance. The soundtrack is energetic, and the scenes of the competition are exciting. I especially liked the moment when the whole town comes to support him.","However, the film is a little too long, and some scenes in the middle are slow. The ending is also easy to guess.","Overall, I recommend The Little Drummer for families and anyone who loves music. I give it four out of five stars."],"q":"purpose|What is the purpose of the text?|To tell a true story;To review a film;To explain how to play drums;To advertise a music shop|1|-|Teks ini adalah ulasan film.\ndetail|What does Bayu practise on?|A new drum set;Old buckets and pans;A guitar;A piano|1|he practises on old buckets and pans|Ember dan panci bekas.\ndetail|What does the writer criticise?|The soundtrack;The actor;The length and slow middle scenes;The competition scenes|2|the film is a little too long, and some scenes in the middle are slow|Terlalu panjang dan bagian tengah lambat.\nvocab|\"The soundtrack is <b>energetic</b>.\" Energetic means ...|penuh semangat;sedih;pelan;sunyi|0|-|Energetic = penuh energi/semangat.\ndetail|How many stars does the writer give?|Two;Three;Four;Five|2|I give it four out of five stars|Empat dari lima."},{"region":"sehat","title":"A Visit to the Doctor","type":"Dialogue","p":["Doctor: Good morning. What seems to be the problem?","Sari: Good morning, Doctor. I've had a sore throat and a high temperature since yesterday. I also have a headache.","Doctor: Let me check. Open your mouth, please. Your throat is red. Do you have a cough?","Sari: Yes, a little, especially at night.","Doctor: You have a throat infection. I'll give you some medicine. Take one tablet three times a day after meals. Drink plenty of warm water and get enough rest.","Sari: Should I go to school tomorrow?","Doctor: It's better to stay at home for two days. Come back if your fever doesn't go down."],"q":"main|What is the conversation about?|Sari's school;Sari's visit to the doctor;A cooking lesson;A sports event|1|-|Percakapan antara Sari dan dokter.\ndetail|How long has Sari been sick?|Since last week;Since yesterday;Since this morning;For a month|1|since yesterday|Sejak kemarin.\ndetail|What does the doctor say Sari has?|A stomach ache;A throat infection;A broken arm;An allergy|1|You have a throat infection|Infeksi tenggorokan.\ndetail|How often should Sari take the medicine?|Once a day;Twice a day;Three times a day;Every hour|2|Take one tablet three times a day after meals|Tiga kali sehari.\nev|Ketuk kalimat yang menunjukkan kapan Sari harus kembali ke dokter.||-|Come back if your fever doesn't go down|Jika demamnya tidak turun."},{"region":"kampus","title":"How I Improved My English Score","type":"Recount / personal essay","p":["In my first year of senior high school, my English score was only 62. I could understand simple texts, but I panicked whenever I saw long passages or unfamiliar words in exams.","My teacher suggested a different approach. Instead of memorising long word lists, I started reading one short article every day and writing down five new words with example sentences. I also joined the school English club, where we practised giving short presentations every Friday. At first, I was so nervous that my hands shook, but after a few months I could speak for three minutes without notes.","I also learned to manage my time in exams. I read the questions first, then looked for the answers in the text. By the end of the year, my score had risen to 85. More importantly, I no longer saw English as a subject to fear but as a tool to discover new ideas."],"q":"main|What is the text mainly about?|The writer's English teacher;How the writer improved in English;The school English club;How to give presentations|1|-|Teks menceritakan cara penulis meningkatkan kemampuan bahasa Inggris.\ndetail|What did the writer do every day?|Memorised long word lists;Read a short article and wrote down five new words;Took a practice test;Watched English films|1|I started reading one short article every day|Membaca satu artikel pendek dan mencatat lima kata baru.\ninfer|Why did the writer's hands shake at first?|It was cold;The writer was nervous about speaking;The writer was sick;The room was noisy|1|At first, I was so nervous that my hands shook|Gugup saat presentasi.\ndetail|What exam strategy did the writer learn?|Reading the text twice;Reading the questions first;Guessing every answer;Skipping long passages|1|I read the questions first, then looked for the answers in the text|Membaca soal lebih dulu.\ndetail|What was the writer's final score?|62;75;85;90|2|my score had risen to 85|85.\nev|Ketuk kalimat yang menunjukkan perubahan sikap penulis terhadap bahasa Inggris.||-|I no longer saw English as a subject to fear|Tidak lagi takut pada bahasa Inggris."},{"region":"kerja","title":"Job Advertisement: Junior Social Media Assistant","type":"Job advertisement","p":["Lentera Coffee is a growing coffee shop chain with 12 branches in Java. We are looking for a creative and hardworking Junior Social Media Assistant to join our marketing team in Surabaya.","Responsibilities: create daily posts and short videos for our social media accounts; reply to customer messages politely within 24 hours; and prepare a simple monthly report on followers and engagement.","Requirements: a minimum of a vocational high school or diploma qualification; good communication skills in Indonesian and English; basic photo and video editing skills; and the ability to work in a team and meet deadlines. Experience is not required, as training will be provided.","We offer a competitive salary, health insurance, and free coffee every day. Send your CV, a short cover letter, and three examples of your social media content to recruitment@lenteracoffee.example by 30 June."],"q":"purpose|What is the purpose of the text?|To advertise coffee;To advertise a job vacancy;To describe a coffee shop;To report on social media|1|-|Teks ini iklan lowongan kerja.\ndetail|Where will the new employee work?|Jakarta;Surabaya;Bandung;Semarang|1|to join our marketing team in Surabaya|Surabaya.\ndetail|How quickly must customer messages be answered?|Within one hour;Within 12 hours;Within 24 hours;Within a week|2|reply to customer messages politely within 24 hours|Dalam 24 jam.\ntfng|Applicants must have at least two years of experience.|True;False;Not Given|1|Experience is not required|Salah, pengalaman tidak diperlukan.\nvocab|\"We offer a <b>competitive</b> salary.\" Here, competitive means ...|as good as or better than other companies;very low;paid every day;difficult to get|0|-|Competitive salary = gaji yang bersaing.\nev|Ketuk kalimat yang menjelaskan dokumen yang harus dikirim.||-|Send your CV, a short cover letter, and three examples of your social media content|CV, surat lamaran, dan tiga contoh konten."},{"region":"kota","title":"Getting Around Yogyakarta","type":"Travel guide text","p":["Yogyakarta is one of Indonesia's most popular destinations for students and tourists. Although the city is not very large, choosing the right transport can save you time and money.","The easiest way to travel in the city centre is by Trans Jogja, the city bus service. The buses are air-conditioned and cheap, but they can be slow during rush hour. For short trips, many visitors rent a bicycle or simply walk, especially around Malioboro and the Kraton.","If you want to visit places outside the city, such as Borobudur or the beaches of Gunungkidul, it is better to rent a motorbike or a car with a driver. Remember that you need a valid driving licence and a helmet if you ride a motorbike.","Arriving by train is also convenient. Yogyakarta's main station is in the city centre, only a short walk from Malioboro Street. Wherever you go, keep your valuables safe and always check prices before you take a ride."],"q":"main|What is the text mainly about?|The history of Yogyakarta;Transport options in and around Yogyakarta;Hotels in Yogyakarta;The beaches of Gunungkidul|1|-|Teks memandu pilihan transportasi di Yogyakarta.\ndetail|What is a disadvantage of Trans Jogja?|It is expensive;It has no air conditioning;It can be slow during rush hour;It only goes to Borobudur|2|they can be slow during rush hour|Lambat saat jam sibuk.\ndetail|What is recommended for visiting places outside the city?|Walking;Trans Jogja;A motorbike or a car with a driver;A bicycle|2|it is better to rent a motorbike or a car with a driver|Sewa motor atau mobil dengan sopir.\ninfer|Why is arriving by train convenient?|Trains are free;The station is close to Malioboro;Trains go to the beaches;There is no traffic|1|only a short walk from Malioboro Street|Stasiun dekat Malioboro.\nvocab|\"Keep your <b>valuables</b> safe.\" Valuables means ...|barang berharga;tiket;makanan;pakaian|0|-|Valuables = barang berharga.\nev|Ketuk kalimat yang menyebut syarat mengendarai motor.||-|you need a valid driving licence and a helmet|SIM yang berlaku dan helm."},{"region":"digital","title":"Think Before You Post","type":"Analytical exposition","p":["Social media allows us to share ideas, photos, and news with thousands of people in seconds. However, many young people post content without thinking about the consequences. I believe every user should think carefully before posting anything online.","First, what we post can stay online forever. Even if we delete a photo, someone may already have taken a screenshot. Universities and employers sometimes check applicants' social media accounts, so an embarrassing post today could affect our future.","Second, sharing too much personal information can be dangerous. Posting our home address, school name, or daily location can help strangers find us. Criminals also use such details for online scams and identity theft.","Third, careless posts can hurt others. A joke that seems funny to us may be offensive to someone else, and spreading unverified news can cause panic.","Therefore, before we click \"post\", we should ask ourselves: Is it true? Is it kind? Is it safe? A few seconds of thinking can protect both ourselves and other people."],"q":"main|What is the writer's main argument?|Social media should be banned;Users should think carefully before posting;Screenshots are illegal;Employers dislike social media|1|I believe every user should think carefully before posting anything online|Tesis ada di paragraf 1.\ndetail|Why can a deleted photo still be a problem?|It is stored in a museum;Someone may have taken a screenshot;It costs money;It goes to the police|1|someone may already have taken a screenshot|Orang lain mungkin sudah menangkap layar.\ndetail|What information does the writer say is dangerous to share?|Favourite films;Home address and daily location;Opinions about books;Photos of food|1|Posting our home address, school name, or daily location can help strangers find us|Alamat rumah dan lokasi harian.\nvocab|\"Spreading <b>unverified</b> news can cause panic.\" Unverified means ...|not checked to be true;very old;very popular;written in English|0|-|Unverified = belum dicek kebenarannya.\npurpose|What is the function of the questions in the last paragraph?|To test the reader's English;To give a simple checklist before posting;To start a new topic;To ask for comments|1|Is it kind?|Daftar periksa sederhana sebelum mengunggah.\nev|Ketuk kalimat yang menunjukkan bahwa unggahan bisa memengaruhi masa depan.||-|an embarrassing post today could affect our future|Unggahan memalukan bisa memengaruhi masa depan."},{"region":"tes","title":"Describing Trends: Internet Use in a Small Country","type":"IELTS Task 1-style report","p":["The line graph illustrates the percentage of households with internet access in a small country between 2010 and 2020, comparing urban and rural areas.","Overall, internet access increased significantly in both areas over the decade, although the gap between them narrowed considerably.","In 2010, around 45 percent of urban households had internet access, compared with only 10 percent of rural households. Over the following five years, the urban figure rose steadily to approximately 70 percent, while the rural figure climbed more slowly, reaching about 25 percent in 2015.","From 2015 onwards, however, rural access grew dramatically, largely as a result of a government programme that built mobile towers in remote regions. By 2020, nearly 65 percent of rural households were connected. Urban access, in contrast, levelled off at around 85 percent in the final two years.","In conclusion, while urban areas remained ahead throughout the period, the rapid growth in rural connectivity after 2015 substantially reduced the digital divide."],"q":"main|What does the report mainly describe?|Mobile phone prices;Changes in household internet access in urban and rural areas;The population of a small country;How mobile towers are built|1|-|Laporan grafik membandingkan akses internet kota dan desa.\ndetail|What percentage of rural households had internet access in 2010?|10 percent;25 percent;45 percent;65 percent|0|compared with only 10 percent of rural households|10 persen.\nvocab|The phrase \"<b>levelled off</b>\" in paragraph 4 means ...|stopped rising and stayed stable;fell sharply;rose dramatically;disappeared|0|-|Levelled off = berhenti naik dan stabil.\ninfer|What was the main reason for the sharp rise in rural access after 2015?|Cheaper laptops;A government programme building mobile towers;People moving to cities;Lower electricity prices|1|largely as a result of a government programme that built mobile towers in remote regions|Program pemerintah membangun menara seluler.\npurpose|What is the function of paragraph 2?|To give an overview of the main trends;To describe 2010 data in detail;To give the writer's opinion;To explain the methods|0|Overall, internet access increased significantly in both areas|Paragraf overview merangkum tren utama (wajib di IELTS Task 1).\nev|Ketuk kalimat yang menunjukkan bahwa kesenjangan digital berkurang.||-|substantially reduced the digital divide|Pertumbuhan desa yang cepat mengurangi kesenjangan."},{"region":"mhs","title":"Balancing Organisations and Studies","type":"Student guidance article","p":["Joining a student organisation is one of the most rewarding parts of university life. Organisations allow students to develop leadership, teamwork, and project management skills that are highly valued by employers. Activities such as community service programmes also give students the chance to apply academic knowledge to real social problems.","However, many students struggle to balance organisational duties with their coursework. Meetings, events, and late-night preparations can easily take time away from studying, and some students end up delaying their thesis or losing their scholarship because their grade point average drops below the required minimum.","Academic advisers recommend several strategies. First, students should limit themselves to one or two organisations in which they can contribute meaningfully, rather than joining many at a superficial level. Second, they should use a weekly planner that includes fixed study blocks, treating them as seriously as organisational meetings. Third, students should communicate openly with their team when exams or deadlines approach.","Ultimately, the goal is not to choose between academic success and personal development, but to manage time so that each supports the other."],"q":"main|What is the article mainly about?|How to win a scholarship;Balancing student organisations and studies;Writing a thesis;Community service programmes|1|-|Artikel membahas keseimbangan organisasi dan kuliah.\ndetail|What skills do organisations help develop?|Cooking and cleaning;Leadership, teamwork, and project management;Driving and swimming;Coding only|1|develop leadership, teamwork, and project management skills|Kepemimpinan, kerja sama tim, manajemen proyek.\ninfer|Why might a student lose a scholarship?|They join a community service programme;Their GPA falls below the minimum;They use a planner;They talk to their team|1|their grade point average drops below the required minimum|IPK turun di bawah batas minimum.\nvocab|The word \"<b>superficial</b>\" in paragraph 3 is closest in meaning to ...|shallow, not deep;very serious;official;expensive|0|-|Superficial = dangkal.\ndetail|What do advisers say about study blocks?|They should be optional;They should be treated as seriously as meetings;They should be at night only;They should replace meetings|1|treating them as seriously as organisational meetings|Diperlakukan seserius rapat organisasi.\nev|Ketuk kalimat yang memuat kesimpulan penulis.||-|the goal is not to choose between academic success and personal development|Tujuannya bukan memilih salah satu, tetapi mengelola waktu."},{"region":"ling","title":"Code-Switching in Multilingual Indonesia","type":"Academic passage","p":["In many Indonesian cities, it is common to hear speakers move between Indonesian, a regional language such as Javanese or Sundanese, and English within a single conversation. Linguists call this phenomenon code-switching. When the switch occurs between sentences, it is known as inter-sentential switching; when it occurs within a sentence, it is called intra-sentential switching.","For a long time, code-switching was viewed negatively, as evidence that speakers lacked full competence in either language. Sociolinguistic research has challenged this view. Studies show that fluent bilinguals often switch in systematic ways that follow grammatical constraints, and that switching serves important social functions.","For example, a speaker may switch to a regional language to show solidarity with a friend from the same region, or to English to sound professional or to express a concept for which no common Indonesian term exists. Switching can also mark a change in topic or signal humour. In pragmatic terms, the choice of code itself carries meaning beyond the literal words.","Today, code-switching is increasingly seen not as a deficiency but as a resource that reflects the rich linguistic repertoire of multilingual communities."],"q":"main|What is the passage mainly about?|The grammar of Javanese;Code-switching and its social functions;How to learn English;The history of Indonesian|1|-|Bacaan membahas alih kode dan fungsinya.\ndetail|What is intra-sentential switching?|Switching between sentences;Switching within a sentence;Speaking only one language;Translating a text|1|when it occurs within a sentence, it is called intra-sentential switching|Alih kode di dalam satu kalimat.\ndetail|How was code-switching traditionally viewed?|As a sign of high intelligence;As evidence of lacking competence;As a professional skill;As a form of poetry|1|as evidence that speakers lacked full competence in either language|Dianggap tanda kurang mampu berbahasa.\ninfer|Why might a speaker switch to a regional language with a friend?|To sound professional;To show solidarity;To change the topic;To avoid grammar rules|1|to show solidarity with a friend from the same region|Menunjukkan solidaritas.\nvocab|The word \"<b>repertoire</b>\" in the last paragraph refers to ...|the range of languages and styles a community uses;a list of songs;a grammar book;a type of test|0|-|Linguistic repertoire = ragam bahasa yang dikuasai.\nev|Ketuk kalimat yang menyatakan bahwa pilihan kode juga membawa makna.||-|the choice of code itself carries meaning beyond the literal words|Pilihan kode membawa makna di luar kata-kata."},{"region":"pend","title":"Formative Assessment in the Classroom","type":"Academic passage","p":["Educational researchers distinguish between two broad purposes of assessment. Summative assessment, such as a final exam, evaluates what students have learned at the end of a unit or course. Formative assessment, by contrast, takes place during learning and aims to improve it.","Formative assessment can take many forms: asking students to summarise a lesson in one sentence, using quick quizzes, observing group work, or giving written feedback on drafts. The key feature is that the information is used to adjust teaching and to help students understand what they need to do next.","An influential review by Paul Black and Dylan Wiliam in 1998 concluded that well-designed formative assessment can produce substantial gains in student achievement. Effective feedback, they argued, should focus on the task rather than on the student, and it should be specific enough for learners to act on. A comment such as \"Your argument needs evidence from the text\" is more useful than a grade alone.","Indonesia's Kurikulum Merdeka also emphasises assessment for learning, encouraging teachers to diagnose students' needs and to differentiate instruction accordingly."],"q":"main|What is the passage mainly about?|Final exams in Indonesia;Formative assessment and its role in improving learning;The life of Dylan Wiliam;How to write essays|1|-|Bacaan membahas asesmen formatif.\ndetail|What is the main purpose of formative assessment?|To give final grades;To improve learning while it happens;To rank schools;To select students for university|1|takes place during learning and aims to improve it|Memperbaiki proses belajar.\ndetail|According to Black and Wiliam, effective feedback should ...|focus on the student's personality;focus on the task and be specific;be given only at the end of the year;always include a grade|1|should focus on the task rather than on the student|Fokus pada tugas dan spesifik.\npurpose|Why does the author give the example \"Your argument needs evidence from the text\"?|To show what specific, useful feedback looks like;To criticise a student;To explain summative assessment;To describe a quiz|0|is more useful than a grade alone|Contoh umpan balik yang spesifik.\nvocab|The word \"<b>differentiate</b>\" in the last paragraph means ...|adapt teaching to different needs;make everything the same;remove;test|0|-|Diferensiasi = menyesuaikan pembelajaran dengan kebutuhan siswa.\nev|Ketuk kalimat yang menyebut ciri utama asesmen formatif.||-|The key feature is that the information is used to adjust teaching|Informasinya dipakai untuk menyesuaikan pengajaran."},{"region":"akun","title":"Why Accrual Accounting Matters","type":"Academic passage","p":["Businesses can record transactions using two main bases of accounting. Under the cash basis, revenue is recorded when cash is received and expenses are recorded when cash is paid. Under the accrual basis, revenue is recognised when it is earned and expenses when they are incurred, regardless of when cash changes hands.","Consider a consulting firm that completes a project in December but receives payment in January. Under the cash basis, the revenue would appear in January. Under the accrual basis, it is recorded in December, the period in which the service was provided, and an account receivable is created on the balance sheet.","Accrual accounting is required under international financial reporting standards for most companies because it follows the matching principle: expenses should be reported in the same period as the revenues they help to generate. This gives investors and creditors a more accurate picture of a company's performance in a given period.","However, accrual-based profits do not always mean that a company has cash available. A firm may report high profits while struggling to pay its suppliers if customers are slow to pay. For this reason, analysts examine the statement of cash flows alongside the income statement."],"q":"main|What is the passage mainly about?|How to open a bank account;The accrual basis of accounting and why it matters;The history of consulting firms;Tax rates for small businesses|1|-|Bacaan menjelaskan basis akrual dan pentingnya.\ndetail|Under the accrual basis, when is revenue recognised?|When cash is received;When it is earned;At the end of the year;When the invoice is paid|1|revenue is recognised when it is earned|Saat pendapatan diperoleh.\ninfer|In the example, in which month is revenue recorded under the accrual basis?|November;December;January;February|1|it is recorded in December, the period in which the service was provided|Desember.\nvocab|The word \"<b>incurred</b>\" in paragraph 1 is closest in meaning to ...|happened and became owed;cancelled;saved;borrowed from a bank|0|-|Incurred = terjadi/menjadi beban.\ndetail|Why do analysts look at the statement of cash flows?|Profits do not always mean cash is available;It replaces the income statement;It shows tax rates;It lists suppliers|0|accrual-based profits do not always mean that a company has cash available|Laba akrual belum tentu berarti kas tersedia.\nev|Ketuk kalimat yang menjelaskan prinsip penandingan (matching principle).||-|expenses should be reported in the same period as the revenues they help to generate|Beban dilaporkan pada periode yang sama dengan pendapatannya."},{"region":"hi","title":"ASEAN and the Principle of Non-Interference","type":"Academic passage","p":["The Association of Southeast Asian Nations (ASEAN) was founded in 1967 by Indonesia, Malaysia, the Philippines, Singapore, and Thailand. It expanded gradually, and in October 2025 Timor-Leste became its eleventh member. From the beginning, ASEAN has emphasised respect for sovereignty and non-interference in the internal affairs of member states.","Supporters argue that this principle, together with decision-making by consultation and consensus, often called the \"ASEAN Way\", has helped maintain peace among countries with very different political systems. Since its founding, there has been no major war between ASEAN members.","Critics, however, contend that non-interference limits ASEAN's ability to respond to crises within member states, such as serious human rights violations or political conflicts. Because decisions require consensus, a single member can block collective action.","In recent years, ASEAN has experimented with more flexible approaches, including issuing joint statements and appointing special envoys. Whether the organisation can balance respect for sovereignty with effective regional responsibility remains one of the central questions in Southeast Asian international relations."],"q":"main|What is the passage mainly about?|The history of Singapore;ASEAN's principle of non-interference and debates about it;Trade between Asian countries;The United Nations|1|-|Bacaan membahas prinsip non-intervensi ASEAN.\ndetail|Which country was NOT a founding member of ASEAN?|Indonesia;Thailand;Vietnam;Singapore|2|founded in 1967 by Indonesia, Malaysia, the Philippines, Singapore, and Thailand|Vietnam bukan pendiri.\ndetail|According to supporters, what has the \"ASEAN Way\" helped achieve?|Rapid economic growth;Peace among members;A single currency;A common army|1|has helped maintain peace among countries with very different political systems|Perdamaian antaranggota.\ninfer|Why can a single member block collective action?|It has more money;Decisions require consensus;It controls the secretariat;It has a larger army|1|Because decisions require consensus, a single member can block collective action|Keputusan butuh konsensus.\nvocab|The word \"<b>contend</b>\" in paragraph 3 is closest in meaning to ...|argue;deny;forget;celebrate|0|-|Contend = berpendapat/menyatakan.\nev|Ketuk kalimat yang menyebut pendekatan ASEAN yang lebih fleksibel.||-|including issuing joint statements and appointing special envoys|Pernyataan bersama dan utusan khusus."},{"region":"tambang","title":"Downstreaming Nickel in Indonesia","type":"Academic passage","p":["Indonesia holds some of the world's largest reserves of nickel, a metal used in stainless steel and increasingly in batteries for electric vehicles. For many years, the country exported large quantities of raw nickel ore, earning relatively little from each tonne.","To capture more value, the government introduced a policy known as downstreaming (hilirisasi). In 2020, it banned the export of raw nickel ore, requiring companies to process the ore domestically in smelters. The policy aims to attract investment, create jobs, and allow Indonesia to sell higher-value products such as nickel pig iron, ferronickel, and battery materials.","The policy has led to a rapid increase in smelter construction, particularly in Sulawesi and North Maluku, and nickel-related export earnings have risen sharply. However, it has also raised concerns. Many smelters rely on coal-fired power plants, which increases carbon emissions. Environmental groups have also reported deforestation and water pollution near mining and processing sites.","The European Union challenged the export ban at the World Trade Organization, arguing that it restricted trade. The debate illustrates the tension between a country's right to develop its industries and the rules of the global trading system, as well as the need to make mineral processing environmentally sustainable."],"q":"main|What is the passage mainly about?|How nickel is mined underground;Indonesia's nickel downstreaming policy and its effects;Electric vehicle design;The history of the WTO|1|-|Bacaan membahas kebijakan hilirisasi nikel.\ndetail|What did the government ban in 2020?|Nickel smelters;The export of raw nickel ore;Electric vehicles;Coal power plants|1|it banned the export of raw nickel ore|Ekspor bijih nikel mentah.\ndetail|What is one environmental concern mentioned?|Smelters rely on coal-fired power plants;Nickel is too cheap;There are too few jobs;Batteries are too heavy|0|Many smelters rely on coal-fired power plants|Smelter bergantung pada PLTU batu bara.\nvocab|The word \"<b>smelters</b>\" in paragraph 2 refers to ...|facilities that process ore into metal;trucks that carry ore;mining engineers;export documents|0|-|Smelter = fasilitas pengolahan/pemurnian bijih.\ninfer|Why did the EU challenge the ban at the WTO?|It wanted to buy raw nickel ore;It opposed electric vehicles;It wanted to build smelters in Sulawesi;It supported the policy|0|arguing that it restricted trade|Uni Eropa ingin tetap mendapat bijih mentah, sehingga menganggap larangan itu membatasi perdagangan.\nev|Ketuk kalimat yang menyebut tujuan kebijakan hilirisasi.||-|The policy aims to attract investment, create jobs|Menarik investasi, menciptakan lapangan kerja, menjual produk bernilai tinggi."},{"region":"sains","title":"Why Scientists Replicate Studies","type":"Academic passage","p":["A single scientific study, however well designed, rarely settles a question. Results can be influenced by chance, by small sample sizes, by errors in measurement, or by unconscious bias in how data are analysed. For this reason, replication, the repetition of a study by independent researchers, is a cornerstone of the scientific method.","When a finding is replicated successfully, confidence in it increases. When it is not, scientists must consider whether the original result was a false positive or whether differences in methods explain the outcome. Either way, the scientific community learns something.","In the 2010s, large projects in psychology and medicine attempted to replicate well-known published studies, and a substantial proportion could not be reproduced. This so-called \"replication crisis\" led to reforms. Researchers are now encouraged to pre-register their hypotheses and analysis plans before collecting data, to share their data openly, and to report results even when they do not support the hypothesis.","These practices make research more transparent and reduce the temptation to present only positive findings. In this sense, the replication crisis has ultimately strengthened science by reminding researchers that self-correction is one of its greatest strengths."],"q":"main|What is the passage mainly about?|How to design an experiment;The importance of replication in science;The history of psychology;Measurement errors in medicine|1|-|Bacaan menjelaskan pentingnya replikasi.\ndetail|What is replication?|Publishing a study twice;Repetition of a study by independent researchers;Reading many articles;Writing a hypothesis|1|the repetition of a study by independent researchers|Pengulangan penelitian oleh peneliti independen.\ndetail|What does pre-registration involve?|Stating hypotheses and analysis plans before collecting data;Paying a fee before publishing;Registering at a university;Collecting data twice|0|pre-register their hypotheses and analysis plans before collecting data|Mendaftarkan hipotesis dan rencana analisis lebih dulu.\nvocab|The word \"<b>cornerstone</b>\" in paragraph 1 means ...|an essential foundation;a small detail;a building material;an old tradition|0|-|Cornerstone = dasar yang esensial.\ninfer|What is the author's attitude toward the replication crisis?|It has destroyed trust in science;It has ultimately made science stronger;It is not important;It only affected medicine|1|the replication crisis has ultimately strengthened science|Penulis memandangnya positif.\nev|Ketuk kalimat yang menunjukkan bahwa kegagalan replikasi tetap bermanfaat.||-|Either way, the scientific community learns something|Komunitas ilmiah tetap belajar sesuatu."},{"region":"hukum","title":"The Presumption of Innocence","type":"Academic passage","p":["The presumption of innocence is one of the most fundamental principles of criminal law. It means that a person accused of a crime is considered innocent until proven guilty by a court. The principle is recognised in Article 11 of the Universal Declaration of Human Rights and in the criminal procedure laws of many countries, including Indonesia.","In practice, the presumption of innocence places the burden of proof on the prosecution. The defendant does not have to prove that he or she is innocent; rather, the state must present sufficient evidence to convince the court of the defendant's guilt. In many common law systems, the standard is proof \"beyond a reasonable doubt\".","The principle also affects how suspects should be treated before trial. Officials and the media are expected to avoid presenting suspects as if they had already been convicted. Pre-trial detention should be used only when necessary, for example when there is a risk that the suspect will flee or destroy evidence.","Critics note that in high-profile cases, public opinion and media coverage can effectively declare a person guilty long before a verdict is delivered. Protecting the presumption of innocence therefore requires not only legal rules but also responsible journalism and public awareness."],"q":"main|What is the passage mainly about?|How to become a lawyer;The presumption of innocence and its implications;The history of the Universal Declaration of Human Rights;Media freedom|1|-|Bacaan membahas asas praduga tak bersalah.\ndetail|Who carries the burden of proof in a criminal case?|The defendant;The prosecution;The media;The witnesses|1|places the burden of proof on the prosecution|Penuntut umum.\ndetail|When should pre-trial detention be used?|In every case;Only when necessary, such as risk of flight;Only for foreign suspects;After the verdict|1|Pre-trial detention should be used only when necessary|Hanya bila perlu.\nvocab|The word \"<b>verdict</b>\" in paragraph 4 means ...|the decision of a court;a police report;a newspaper article;a type of prison|0|-|Verdict = putusan pengadilan.\ninfer|Why does the author mention responsible journalism?|Media coverage can make the public see suspects as guilty before trial;Journalists decide court cases;Journalism is part of criminal law;Lawyers often become journalists|0|public opinion and media coverage can effectively declare a person guilty long before a verdict is delivered|Pemberitaan bisa \"memvonis\" sebelum putusan.\nev|Ketuk kalimat yang menyebut dasar hukum internasional asas ini.||-|recognised in Article 11 of the Universal Declaration of Human Rights|Pasal 11 DUHAM."}];

function gramFor(u){

function gramOrder(u){

function gObj(u,it,idx){

}
function gTiles(s){
  let toks=s.split(" ").map(t=>({t,key:false}));let guard=0;
  while(toks.length>9&&guard++<20){let best=-1,len=1e9;for(let i=0;i<toks.length-1;i++){const L=toks[i].t.length+toks[i+1].t.length;if(L<len){len=L;best=i;}}toks.splice(best,2,{t:toks[best].t+" "+toks[best+1].t,key:false});}
  const answer=toks.map(x=>x.t).join(" ");let sh=shuffle(toks),g=0;while(sh.map(x=>x.t).join(" ")===answer&&g++<12)sh=shuffle(toks);
  return {toks:sh,answer};
}
function gItem(u,it,idx){
  const o=gObj(u,it,idx);const base={o,k:it.k,it};
  if(it.k==="mc")return {...base,opts:it.opts,ans:it.ans};

}
let GUSED=null; // items already used in this level
function gPick(u,kinds,n){
  const all=UNITS[u].gi.map((it,i)=>[it,i]).filter(([it])=>kinds.includes(it.k));
  const used=GUSED&&GUSED.u===u?GUSED.set:new Set();
  const fresh=shuffle(all.filter(([,i])=>!used.has(i))),old=shuffle(all.filter(([,i])=>used.has(i)));
  const ch=fresh.concat(old).slice(0,n);ch.forEach(([,i])=>used.add(i));
  return ch.map(([it,i])=>gItem(u,it,i));
}
function buildGram(type,u){
  const N={rule:3,gmc:6,gtime:5,gerr:5,gord:4,gtr:4,gmix:6}[type]||5;
  let items;
  if(type==="rule"||type==="gmc")items=gPick(u,["mc"],N);
  else if(type==="gtime")items=gPick(u,["time"],N);
  else if(type==="gerr")items=gPick(u,["err"],N);
  else if(type==="gord")items=gPick(u,["ord"],N);
  else if(type==="gtr")items=gPick(u,["tr"],N);
  else if(type==="gmix"){const kinds=lvOf(u)==="sd"?["mc","ord"]:["mc","err","time","ord","tr"];items=shuffle(gPick(u,kinds,N));}
  if(!items||!items.length)items=gPick(u,["mc"],5);

}

function examUnits(lv,kind){return SECTIONS.filter(s=>s.lv===lv).flatMap(s=>s.units).filter(u=>UNITS[u]&&(kind==="vocab"?!isGram(u)&&!isRead(u):kind==="grammar"?isGram(u):isRead(u)));}
function exVocab(lv,n){
  const us=new Set(examUnits(lv,"vocab"));const pool=ALL.filter(o=>us.has(o.u));
  return sample(pool,Math.min(n,pool.length)).map(o=>{
    if(isExp(o)&&o.ex&&Math.random()<.6){const opts=shuffle([o].concat(distract(o,pool.filter(isExp),3,"f",ALL.filter(isExp))));
      return {skill:"vocab",kind:"Melengkapi kalimat",q:sent(o,'<span class="gblank">_____</span>'),opts:opts.map(x=>x.f),ans:opts.indexOf(o),why:`${esc(o.f)} = ${esc(o.idn)}. ${esc(o.d||"")}`};}
    if(Math.random()<.5){const opts=shuffle([o].concat(distract(o,pool,3,"idn")));
      return {skill:"vocab",kind:"Arti kata",q:`What does “<b>${esc(o.w)}</b>” mean?`,opts:opts.map(x=>x.idn),ans:opts.indexOf(o),why:`${esc(o.w)} = ${esc(o.idn)}.`};}
    const opts=shuffle([o].concat(distract(o,pool,3,"w")));
    return {skill:"vocab",kind:"Kata bahasa Inggris",q:`Bahasa Inggris dari “<b>${esc(o.idn)}</b>” adalah …`,opts:opts.map(x=>x.w),ans:opts.indexOf(o),why:`${esc(o.idn)} = ${esc(o.w)}.`};
  });
}
function exGramItem(u,it){
  if(it.k==="mc")return {skill:"grammar",kind:"Structure",topic:UNITS[u].idn,q:gBlank(it.q,'<span class="gblank">_____</span>'),opts:it.opts.slice(),ans:it.ans,why:esc(it.why)};
  if(it.k==="err"){const parts=it.segs.filter(x=>x.startsWith("[")).map(x=>x.slice(1,-1));let j=0;
    const q=it.segs.map(s=>s.startsWith("[")?`<u>${esc(s.slice(1,-1))}</u><sup>${"ABCD"[j++]}</sup>`:esc(s)).join("");
    return {skill:"grammar",kind:"Written Expression",topic:UNITS[u].idn,q:`${q}<div class="small muted" style="margin-top:6px">Bagian mana yang salah?</div>`,opts:parts.map((p,k)=>`${"ABCD"[k]}. ${p}`),ans:it.ans,why:`Perbaikan: <b>${esc(it.fix)}</b>. ${esc(it.why)}`};}
  if(it.k==="time"){const others=shuffle(Object.keys(ZONES).filter(z=>z!==it.zone)).slice(0,3);const zs=shuffle([it.zone,...others]);
    return {skill:"grammar",kind:"Tenses",topic:UNITS[u].idn,q:`“${esc(it.q)}”<div class="small muted" style="margin-top:6px">Kapan kejadian dalam kalimat ini terjadi?</div>`,opts:zs.map(z=>ZONES[z].l),ans:zs.indexOf(it.zone),why:`Tense: ${esc(ZONES[it.zone].t)}.`};}
  return null;
}
function exGrammar(lvs,n,kinds){
  const all=lvs.flatMap(lv=>examUnits(lv,"grammar")).flatMap(u=>UNITS[u].gi.filter(it=>kinds.includes(it.k)).map(it=>[u,it]));
  return sample(all,Math.min(n,all.length)).map(([u,it])=>exGramItem(u,it)).filter(Boolean);
}
function exReading(lv,n){
  const texts=shuffle(examUnits(lv,"reading").flatMap(u=>UNITS[u].texts));
  const out=[];
  for(const T of texts){
    if(out.length>=n)break;
    let qs=T.qs.slice();const room=n-out.length;
    if(qs.length>room){qs=qs.filter(q=>q.k!=="ev").slice(0,room);}
    qs.forEach(x=>{
      if(x.k==="ev"){out.push({skill:"reading",kind:KLABEL.ev,T,ev:true,q:x.q,ans:x.si,why:esc(x.why)});return;}
      let opts=x.opts.slice(),ans=x.ans;
      if(x.k!=="tfng"){const sh=shuffle(opts.map((o,k)=>[o,k]));opts=sh.map(y=>y[0]);ans=sh.findIndex(y=>y[1]===x.ans);}
      out.push({skill:"reading",kind:KLABEL[x.k],T,q:x.q,opts,ans,si:x.si,why:esc(x.why)});
    });
  }
  return out;
}
function buildExam(lv,P,skills){
  let items=[];
  if(P.toefl){
    const st=exGrammar(["kuliah","sma"],15,["mc"]).map(x=>({...x,part:"Structure"}));
    const we=exGrammar(["kuliah","sma"],25,["err"]).map(x=>({...x,part:"Written Expression"}));
    const rd=exReading("kuliah",50).map(x=>({...x,part:"Reading Comprehension"}));
    items=st.concat(we,rd);
  }else{
    const on=Object.keys(P.mix).filter(k=>skills.includes(k));
    const tot=Object.values(P.mix).reduce((a,b)=>a+b,0);const sub=on.reduce((a,k)=>a+P.mix[k],0)||1;
    const cnt={};let left=tot;on.forEach((k,i)=>{cnt[k]=i===on.length-1?left:Math.round(P.mix[k]*tot/sub);left-=cnt[k];});
    if(cnt.vocab)items=items.concat(exVocab(lv,cnt.vocab));
    if(cnt.grammar)items=items.concat(exGrammar([lv],cnt.grammar,lv==="sd"?["mc"]:["mc","err","time"]));
    if(cnt.reading)items=items.concat(exReading(lv,cnt.reading));
  }
  return items;
}

// ---------- unit (learn) ----------
function showUnit(u){
  if(isGram(u))return showGramUnit(u);
  if(isRead(u))return showReadUnit(u);
  const U=UNITS[u],s=sectionOf(u);
  setCrumbs([{label:"Peta",go:showMap},{label:s.idn,go:()=>showSection(s.id)},{label:"Unit "+u,go:()=>showUnit(u)}]);
  const groups=Object.entries(U.cats).map(([k,name])=>[name,U.list.filter(o=>o.c===k)]);
  const other=U.list.filter(o=>!o.c); if(other.length)groups.push(["Lainnya",other]);
  mount(`<section class="panel">
    <div class="row between"><div><span class="tag">UNIT ${u}</span><h2 style="margin-top:6px">${esc(U.idn)}</h2><p class="muted">${esc(U.en)}</p></div>
    <span class="stars" style="color:var(--hi);font-size:1.4rem">${starsHtml(progress[u]||0)}</span></div>
    <div class="example"><b>Cara belajar unit ini</b><ul class="howlist">
      <li>Pelajari dulu kartu-kartu kata di bawah.</li>
      <li>Jika sudah siap, mulai latihan ${orderFor(u).length} babak:</li>
      ${orderFor(u).map((g,k)=>`<li style="margin-left:1em">Babak ${k+1}: ${g.map(m=>esc(MODELS[m].name)).join(" / ")}${g[0]==="build"?" (7 soal)":""}</li>`).join("")}

// ungkapan yang bisa saling menggantikan tidak boleh jadi pengecoh satu sama lain
const SYN=[
 ["therefore","consequently","thus","as a result","hence","so"],
 ["however","nevertheless","nonetheless","on the other hand","in contrast","conversely","whereas","although","even though","despite","in spite of","though","while"],
 ["moreover","furthermore","in addition","besides","additionally","what is more","similarly","likewise"],
 ["for example","for instance","such as","a good example of this is"],
 ["overall","on the whole","to sum up","in conclusion","in summary","in short","to conclude","all things considered","in my opinion","to be honest"],
 ["due to","owing to","because of","as a result of","because"],
 ["as far as i know","if i remember correctly"],
 ["it is widely believed that","there is no doubt that","i'd say that","what i mean is","the main reason is that"],
 ["let me think about that","that's an interesting question"],
 ["merger","acquisition"],
 ["accuracy","precision"]];
const SYNG=new Map();SYN.forEach((g,i)=>g.forEach(w=>SYNG.set(w,i)));
const sameSyn=(a,b)=>{const x=SYNG.get(a.w.toLowerCase());return x!=null&&x===SYNG.get(b.w.toLowerCase());};
function distract(o,pool,n,key,backup){
  const seen=new Set([o[key]]),out=[];

}
function expItems(type,pool){
  const all=ALL.filter(isExp);let p=pool.filter(isExp);
  if(type==="order"){const p3=p.filter(o=>o.f.split(" ").length>=3);p=p3.length>=4?p3:p.filter(o=>o.f.split(" ").length>=2);}
  if(type==="cross"||type==="truefalse")p=p.filter(o=>o.x);

  if(p.length<4)return null;
  let ch=sample(p,p.length).filter((o,i,a)=>!a.slice(0,i).some(y=>sameSyn(o,y))).slice(0,itemsN()+1);if(ch.length<4)return null;const ex=ch.pop();

    if(type==="def"||type==="cloze"){const key=type==="def"?"w":"f";const opts=shuffle([o].concat(distract(o,p,3,key,all)));return {o,opts,ans:opts.indexOf(o),key};}
    if(type==="cross"){const opts=shuffle([o.f,o.x]);return {o,opts,wrongIdx:opts.indexOf(o.x)};}
    if(type==="truefalse"){const t=Math.random()<.5;return {o,isTrue:t,shown:t?o.f:o.x,ans:t?0:1};}
    if(type==="order"){const toks=o.f.split(" ").map((t,i)=>({t,i}));let sh=shuffle(toks);let g=0;while(sh.map(x=>x.t).join(" ")===o.f&&g++<12)sh=shuffle(toks);return {o,toks:sh};}

function mcqItems(type,pool,n){

function oddItem(pool){
  const groups={};pool.forEach(o=>{if(o.c)(groups[o.c]=groups[o.c]||[]).push(o);});
  const keys=Object.keys(groups).filter(k=>groups[k].length>=3);

  const A=pick(keys);const same=sample(groups[A],3);

function catName(u,k){const U=UNITS[u];return U&&U.cats[k]?U.cats[k]:k;}
function misspell(w){
  const vowels="aeiou";

    const a=w.split("");const i=1+Math.floor(Math.random()*(a.length-2));const r=Math.random();
    if(r<.3){[a[i],a[i+1]]=[a[i+1],a[i]];}

    else if(r<.7){a.splice(i,0,a[i]);}
    else if(vowels.includes(a[i])){a[i]=pick(vowels.replace(a[i],"").split(""));}
    else {const j=a.findIndex((c,k)=>k>0&&vowels.includes(c));if(j<0)continue;a[j]=pick(vowels.replace(a[j],"").split(""));}

function maskWord(w){

function buildRound(type,pool){

  if(type==="memo")return buildMemo(pool);
  if(type==="mean")return buildMean(pool);
  if(type==="flash")return buildFlash(pool);
  if(type==="scramble")return buildScramble(pool);
  if(type==="build")return buildSentence(pool);
  if(type==="blitz")return buildBlitz(pool);
  if(["def","match","cloze","cross","truefalse","order","halves"].includes(type))return expItems(type,pool);
  if(["name","chain","xword"].includes(type))return buildNew(type,pool);

  if(type==="missing"){const ch=sample(pool,itemsN()+1);const ex=ch.pop();return {type,items:ch.map(o=>({o,mask:maskWord(o.w)})),ex:{o:ex,mask:maskWord(ex.w)}};}

  if(type==="sort"){
    const groups={};pool.forEach(o=>{if(o.c)(groups[`${o.u}|${o.c}`]=groups[`${o.u}|${o.c}`]||[]).push(o);});
    const keys=shuffle(Object.keys(groups).filter(k=>groups[k].length>=3)).slice(0,3);
    if(keys.length<2)return null;
    const per=keys.length===2?4:3;
    const words=[];keys.forEach(k=>sample(groups[k],per).forEach(o=>words.push(o)));

    const p=pool.filter(o=>/^[A-Za-z]+$/.test(o.w)&&o.w.length>=3&&o.w.length<=9);

    const grid=Array.from({length:size},()=>Array(size).fill(null));
    const dirs=[[0,1],[1,0],[1,1]];const placed=[];
    for(const o of ch){
      let ok=false;
      for(let t=0;t<200&&!ok;t++){
        const [dr,dc]=pick(dirs);const L=o.w.length;
        const r0=Math.floor(Math.random()*(size-(dr?L:0)+ (dr?0:0)) ), c0=Math.floor(Math.random()*(size-(dc?L:0)));
        if(r0<0||c0<0)continue;
        let fits=true;
        const W=o.w.toLowerCase();
        for(let k=0;k<L;k++){const r=r0+dr*k,c=c0+dc*k;if(r>=size||c>=size){fits=false;break;}const v=grid[r][c];if(v&&v!==W[k]){fits=false;break;}}
        if(!fits)continue;
        const cells=[];for(let k=0;k<L;k++){const r=r0+dr*k,c=c0+dc*k;grid[r][c]=W[k];cells.push(r*size+c);}
        placed.push({o,cells});ok=true;
      }
    }
    if(placed.length<4)return null;
    const abc="abcdefghijklmnopqrstuvwxyz";
    for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(!grid[r][c])grid[r][c]=abc[Math.floor(Math.random()*26)];
    return {type,size,grid,placed,ex:placed[0]};
  }
}

// ---------- word search ----------
function renderSearch(){
  const R=RUN.R;const N=R.size;
  R.found=new Set([0]);R.revealed=new Set();R.start=null;
  const cellOwner=new Map();
  const draw=()=>{
    const foundCells=new Set();R.placed.forEach((p,i)=>{if(R.found.has(i)||R.revealed.has(i))p.cells.forEach(c=>foundCells.add(c));});
    const exCells=new Set(R.placed[0].cells);
    const done=R.placed.every((p,i)=>R.found.has(i)||R.revealed.has(i));
    mount(`<div style="display:flex;flex-direction:column;gap:12px">${hud()}<section class="qcard">${head()}
      <p class="instr">${esc(howStr("search"))}</p>
      <div class="search-wrap">
        <div class="grid" style="grid-template-columns:repeat(${N},auto)" role="grid" aria-label="Kotak huruf">${R.grid.flat().map((ch,i)=>`<button type="button" class="cell ${exCells.has(i)?"ex":foundCells.has(i)?"found":""} ${R.start===i?"sel":""}" data-i="${i}" aria-label="Baris ${Math.floor(i/N)+1} kolom ${i%N+1}: ${ch}">${ch}</button>`).join("")}</div>
        <ul class="clues">${R.placed.map((p,i)=>{const st=i===0?"done":R.found.has(i)?"done":R.revealed.has(i)?"miss":"";
          return `<li class="${st}">${p.o.e?`<span class="emo" aria-hidden="true">${p.o.e}</span>`:`<span class="emo" aria-hidden="true">·</span>`}<span>${esc(p.o.idn)}${st?` → <b>${esc(p.o.w)}</b>`:` <span class="muted small">(${p.o.w.length} huruf)</span>`}${i===0?' <span class="tag">contoh</span>':""}</span></li>`;}).join("")}</ul>
      </div>
      <div class="row" id="fb">${done?`<div class="fb ok" style="flex:1"><div><b class="v">Selesai!</b> Kamu menemukan ${R.placed.length-1-R.revealed.size} dari ${R.placed.length-1} kata.</div><button type="button" class="btn sm" id="next">Selesai babak</button></div>`:`<button type="button" class="linkbtn" id="giveup">Menyerah, tunjukkan sisa kata</button>`}</div>
    </section></div>`);
    SCR().querySelectorAll(".cell").forEach(b=>b.onclick=()=>tap(+b.dataset.i));
    if(done){$("#next").onclick=roundDone;$("#next").focus({preventScroll:true});}
    else $("#giveup").onclick=()=>{R.placed.forEach((p,i)=>{if(!R.found.has(i)&&!R.revealed.has(i)){R.revealed.add(i);record(p.o,false);}});draw();};
  };
  const tap=i=>{
    if(R.start===null){R.start=i;draw();SCR().querySelector(`.cell[data-i="${i}"]`)?.focus({preventScroll:true});return;}
    const a=R.start,b=i;R.start=null;
    const key=(x,y)=>x.join(",")===y.join(",");
    let hit=-1;
    R.placed.forEach((p,k)=>{if(R.found.has(k)||R.revealed.has(k))return;const c=p.cells;if((c[0]===a&&c[c.length-1]===b)||(c[0]===b&&c[c.length-1]===a))hit=k;});
    if(hit>=0){R.found.add(hit);record(R.placed[hit].o,true);draw();}
    else {draw();[a,b].forEach(x=>{const el=SCR().querySelector(`.cell[data-i="${x}"]`);if(el){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),400);}});}
  };
  draw();
}

// ---------- additional models: dikte, beri nama, urutkan, rantai, teka-teki silang ----------
const lw=o=>o.w.toLowerCase();
const singleWord=o=>/^[A-Za-z]+$/.test(o.w);
function buildNew(type,pool){
  if(type==="name"){
    let p=pool.filter(o=>o.w.length<=22);
    if(type==="name"){const f=p.filter(o=>o.idn.toLowerCase().split(" (")[0]!==lw(o));if(f.length>=6)p=f;}
    if(p.length<4)return null;
    const ch=sample(p,Math.min(itemsN()+1,p.length));const ex=ch.pop();
    return {type,items:ch.map(o=>({o})),ex:{o:ex}};
  }
  if(type==="chain"){
    let p=pool.filter(o=>singleWord(o)&&o.w.length>=3&&o.w.length<=9);const f=p.filter(clueOk);if(f.length>=8)p=f;if(p.length<5)return null;
    const ch=sample(p,6);const placed=[];let str="";
    ch.forEach(o=>{placed.push({o,start:str.length,end:str.length+o.w.length-1});str+=lw(o);});
    return {type,str,placed,ex:placed[0]};
  }
  if(type==="xword")return buildCrossword(pool);
  return null;
}
const clueOk=o=>o.idn.toLowerCase().split(" (")[0]!==lw(o);
function buildCrossword(pool){
  let p=pool.filter(o=>singleWord(o)&&o.w.length>=3&&o.w.length<=9);const f=p.filter(clueOk);if(f.length>=10)p=f;
  if(p.length<5)return null;
  const key=(r,c)=>r+","+c;
  for(let attempt=0;attempt<70;attempt++){
    const cand=sample(p,Math.min(20,p.length)).sort((a,b)=>b.w.length-a.w.length);
    const grid=new Map();const placed=[];
    const canPlace=(W,r,c,dr,dc)=>{
      if(grid.has(key(r-dr,c-dc))||grid.has(key(r+dr*W.length,c+dc*W.length)))return 0;
      let cross=0;
      for(let k=0;k<W.length;k++){
        const rr=r+dr*k,cc=c+dc*k;const cell=grid.get(key(rr,cc));
        if(cell){if(cell.ch!==W[k]||cell.dirs.has(dr?"d":"a"))return 0;cross++;}
        else if(grid.has(key(rr+dc,cc+dr))||grid.has(key(rr-dc,cc-dr)))return 0;
      }
      return cross;
    };
    const put=(o,W,r,c,dr,dc)=>{
      const cells=[];
      for(let k=0;k<W.length;k++){const rr=r+dr*k,cc=c+dc*k,kk=key(rr,cc);let cell=grid.get(kk);if(!cell){cell={ch:W[k],dirs:new Set()};grid.set(kk,cell);}cell.dirs.add(dr?"d":"a");cells.push([rr,cc]);}
      placed.push({o,W,r,c,dr,dc,cells});
    };
    put(cand[0],lw(cand[0]),0,0,0,1);
    for(const o of cand.slice(1)){
      if(placed.length>=7)break;
      const W=lw(o);if(placed.some(pl=>pl.W===W))continue;
      const opts=[];
      for(const pl of placed){
        const ndr=pl.dr?0:1,ndc=pl.dr?1:0;
        pl.cells.forEach(([pr,pc],pi)=>{for(let k=0;k<W.length;k++){if(W[k]!==pl.W[pi])continue;const r=pr-ndr*k,c=pc-ndc*k;if(canPlace(W,r,c,ndr,ndc))opts.push([r,c,ndr,ndc]);}});
      }
      if(opts.length){const [r,c,dr,dc]=pick(opts);put(o,W,r,c,dr,dc);}
    }
    if(placed.length<5&&!(attempt>=40&&placed.length>=4))continue;
    let minR=Infinity,minC=Infinity,maxR=-Infinity,maxC=-Infinity;
    for(const k of grid.keys()){const [r,c]=k.split(",").map(Number);minR=Math.min(minR,r);minC=Math.min(minC,c);maxR=Math.max(maxR,r);maxC=Math.max(maxC,c);}
    const rows=maxR-minR+1,cols=maxC-minC+1;
    if(rows>13||cols>13)continue;
    placed.forEach(pl=>{pl.r-=minR;pl.c-=minC;pl.cells=pl.cells.map(([r,c])=>[r-minR,c-minC]);});
    const cells={};for(const [k,v] of grid){const [r,c]=k.split(",").map(Number);cells[key(r-minR,c-minC)]=v.ch;}
    const starts=[...new Set(placed.map(pl=>key(pl.r,pl.c)))].sort((a,b)=>{const [ar,ac]=a.split(",").map(Number),[br,bc]=b.split(",").map(Number);return ar-br||ac-bc;});
    placed.forEach(pl=>pl.num=starts.indexOf(key(pl.r,pl.c))+1);
    return {type:"xword",rows,cols,cells,placed,ex:{}};
  }
  return null;
}
function splitHalves(o){
  if(!o.ex)return null;
  const full=o.ex.replace("___",o.f);const i=o.ex.indexOf("___");
  const before=o.ex.slice(0,i).trim(),after=o.ex.slice(i+3).trim();
  const aw=after.split(/\s+/).filter(Boolean);
  let l,r;
  if(!before){if(aw.length<3)return null;const m=Math.ceil(aw.length/2);l=(o.f+" "+aw.slice(0,m).join(" ")).trim();r=aw.slice(m).join(" ");}
  else if(aw.length>=2){l=(before+" "+o.f).trim();r=after;}
  else{l=before;r=(o.f+" "+after).trim();}
  if(!l||!r||(l+" "+r).replace(/\s+/g," ")!==full.replace(/\s+/g," "))return null;

function renderChain(){
  const R=RUN.R;R.found=new Set([0]);R.revealed=new Set();R.start=null;
  const draw=()=>{
    const done=R.placed.every((p,i)=>R.found.has(i)||R.revealed.has(i));
    const mark=new Map();R.placed.forEach((p,i)=>{if(R.found.has(i)||R.revealed.has(i))for(let k=p.start;k<=p.end;k++)mark.set(k,i===0?"ex":"found");});
    mount(`<div style="display:flex;flex-direction:column;gap:12px">${hud()}<section class="qcard">${head()}
      <p class="instr">${esc(howStr("chain"))}</p>
      <div class="chainrow" role="group" aria-label="Rantai huruf">${[...R.str].map((ch,i)=>`<button type="button" class="cell ${mark.get(i)||""} ${R.start===i?"sel":""}" data-i="${i}" aria-label="Huruf ke-${i+1}: ${ch}">${ch}</button>`).join("")}</div>
      <ul class="clues">${R.placed.map((p,i)=>{const st=i===0||R.found.has(i)?"done":R.revealed.has(i)?"miss":"";return `<li class="${st}">${p.o.e?`<span class="emo" aria-hidden="true">${p.o.e}</span>`:`<span class="emo" aria-hidden="true">·</span>`}<span>${esc(p.o.idn)}${st?` → <b>${esc(p.o.w)}</b>`:` <span class="muted small">(${p.o.w.length} huruf)</span>`}${i===0?' <span class="tag">contoh</span>':""}</span></li>`;}).join("")}</ul>
      <div class="row" id="fb">${done?`<div class="fb ok" style="flex:1"><div><b class="v">Selesai!</b> ${R.placed.length-1-R.revealed.size} dari ${R.placed.length-1} kata ditemukan.</div><button type="button" class="btn sm" id="next">Selesai babak</button></div>`:`<button type="button" class="linkbtn" id="giveup">Menyerah, tunjukkan sisa kata</button>`}</div>
    </section></div>`);
    SCR().querySelectorAll(".chainrow .cell").forEach(b=>b.onclick=()=>tap(+b.dataset.i));
    if(done){$("#next").onclick=roundDone;$("#next").focus({preventScroll:true});}
    else $("#giveup").onclick=()=>{R.placed.forEach((p,i)=>{if(!R.found.has(i)&&!R.revealed.has(i)){R.revealed.add(i);record(p.o,false);}});draw();};
  };
  const tap=i=>{
    if(R.start===null){R.start=i;draw();SCR().querySelector(`.chainrow .cell[data-i="${i}"]`)?.focus({preventScroll:true});return;}
    const a=Math.min(R.start,i),b=Math.max(R.start,i);R.start=null;
    const hit=R.placed.findIndex((p,k)=>!R.found.has(k)&&!R.revealed.has(k)&&p.start===a&&p.end===b);
    if(hit>=0){R.found.add(hit);record(R.placed[hit].o,true);}
    draw();
    if(hit<0)[a,b].forEach(x=>{const el=SCR().querySelector(`.chainrow .cell[data-i="${x}"]`);if(el){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),400);}});
  };
  draw();
}
function renderXword(){
  const R=RUN.R;
  const owner={};R.placed.forEach((pl,i)=>pl.cells.forEach(([r,c])=>{(owner[r+","+c]=owner[r+","+c]||[]).push(i);}));
  const nums={};R.placed.forEach(pl=>nums[pl.r+","+pl.c]=pl.num);

  let dir="a";

      if(e.key==="Backspace"&&!el.value){const pv=inp(dir==="a"?r+","+(c-1):(r-1)+","+c);if(pv){pv.focus();e.preventDefault();}}
      const mv={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[e.key];
      if(mv){const n=inp((r+mv[0])+","+(c+mv[1]));if(n){dir=mv[0]?"d":"a";n.focus();e.preventDefault();}}

  });
  SCR().querySelectorAll(".xclues li").forEach(li=>li.onclick=()=>{const pl=R.placed[+li.dataset.i];dir=pl.dr?"d":"a";const first=pl.cells.find(([r,c])=>!inp(r+","+c).value)||pl.cells[0];inp(first[0]+","+first[1])?.focus();});

    SCR().querySelectorAll(".xcell input").forEach(el=>{const want=R.cells[el.dataset.k];el.classList.add(el.value===want?"good":"bad");el.value=want;el.disabled=true;});
    $("#fb").innerHTML=`<div class="fb ${RUN.rc===RUN.rt?"ok":"no"}" style="flex:1"><div><b class="v">${RUN.rc===RUN.rt?"Sempurna!":"Selesai."}</b> ${RUN.rc}/${RUN.rt} kata benar.</div><button type="button" class="btn sm" id="next">Selesai babak</button></div>`;
    $("#next").onclick=roundDone;$("#next").focus({preventScroll:true});
  };
  $("#check").onclick=()=>finish(false);$("#giveup").onclick=()=>finish(true);
  const firstPl=R.placed.slice().sort((a,b)=>a.num-b.num)[0];dir=firstPl.dr?"d":"a";inp(firstPl.r+","+firstPl.c)?.focus({preventScroll:true});
}

function buildLabel(pool){

  const opts=DIAGRAMS.map(d=>({d,pts:d.pts.filter(([w])=>byW.has(w))})).filter(x=>x.pts.length>=4);
  if(!opts.length)return null;
  const {d,pts}=pick(opts);
  const ch=sample(pts,Math.min(7,pts.length)).sort((a,b)=>a[2]-b[2]||a[1]-b[1]).map(([w,x,y],i)=>({o:byW.get(w),x,y,n:i+1}));
  return {type:"label",d,pts:ch,ex:ch[Math.floor(Math.random()*ch.length)]};
}

  const m=MODELS[RUN.types[RUN.ri]];
  mount(`<div style="display:flex;flex-direction:column;gap:12px">${hud()}<section class="qcard">
