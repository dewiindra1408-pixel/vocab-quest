<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: single centered column; screens swap (peta → wilayah → unit → babak → hasil). */
  --bg:#EDF0F7; --surface:#FFFFFF; --ink:#141B2E; --muted:#5B6479;
  --accent:#2B4BDB; --accent-ink:#FFFFFF; --hi:#FFC83D; --good:#17895B; --bad:#C8423B;
  --line:#D6DBE8; --soft:#E3E8F5;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1424; --surface:#182036; --ink:#E9EDF7; --muted:#9AA3B8;
    --accent:#7D93FF; --accent-ink:#0F1424; --hi:#FFC83D; --good:#3CC48A; --bad:#F07068;
    --line:#2A3450; --soft:#202a45; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1424; --surface:#182036; --ink:#E9EDF7; --muted:#9AA3B8;
  --accent:#7D93FF; --accent-ink:#0F1424; --hi:#FFC83D; --good:#3CC48A; --bad:#F07068;
  --line:#2A3450; --soft:#202a45; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.hidden{display:none !important}
.muted{color:var(--muted)}
.small{font-size:.88rem}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.brand h1 span{background:var(--hi);color:#141B2E;padding:0 .2em;border-radius:6px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:11px 20px;font-family:var(--display);font-weight:700;font-size:1rem;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:.92rem}
.tag{font-size:.78rem;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--muted);font-weight:700}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* map */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.region{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:120px;position:relative}
.region .emo{font-size:1.8rem;line-height:1}
.region strong{font-family:var(--display);font-size:1.05rem}
.region.open{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.region.locked{opacity:.55;cursor:not-allowed}
.region .badge{position:absolute;top:10px;right:10px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side .panel{gap:10px}

/* units */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.unit{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.unit .num{font-family:var(--display);font-weight:800;font-size:.85rem;color:var(--muted)}
.unit strong{font-family:var(--display);font-size:1.1rem}
.unit .stars{letter-spacing:2px;color:var(--hi);font-size:1.1rem}
.stars .off{color:var(--line)!important}
.unit.locked{opacity:.5;cursor:not-allowed}
.unit:not(.locked):hover{border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* learn */
.catblock{display:flex;flex-direction:column;gap:8px}
.catblock h3{font-size:1rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:96px}
.card .emo{font-size:1.6rem;line-height:1.1;min-height:1.8rem}
.card .noemo{font-family:var(--display);font-weight:800;color:var(--muted);font-size:1.1rem;min-height:1.8rem}
.card b{font-family:var(--display);font-size:1.05rem}
.card span{font-size:.85rem;color:var(--muted)}
.card:hover{border-color:var(--accent)}

/* play */
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.stat strong{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qhead h2{font-size:1.25rem}
.instr{color:var(--muted)}
.lvcard{min-height:190px}.lvcard.current{outline:4px solid var(--hi)}
body.lv-sd{font-size:1.08rem}
body.lv-sd .opt{min-height:62px;font-size:1.12rem}
body.lv-sd .prompt .emo,body.lv-sd .card .emo{font-size:2.6rem}
body.lv-sd .btn{font-size:1.08rem;padding:12px 22px}
.bigword{font-size:1.8rem;font-weight:800;letter-spacing:.01em}
.flash-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.flash-card{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--accent);border-radius:14px;padding:14px;text-align:center}
.flash-card .emo{font-size:1.8rem}
.tok.letter{min-width:2.4em;font-size:1.2rem;font-weight:800;text-transform:lowercase}
.howlist{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.howlist li::marker{color:var(--accent)}
.memo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.memo-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;color:var(--ink);font:inherit}
.memo-card .emo{font-size:1.8rem}.memo-card.done{cursor:default;border-color:var(--accent)}
.memo-hint{font-family:ui-monospace,Menlo,monospace;font-size:1.3rem;letter-spacing:.08em;margin:6px 0}
.buildline{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;border-bottom:3px solid var(--accent);padding:6px 2px;align-items:center}
.buildline button{border:1px solid var(--accent);background:var(--soft);border-radius:8px;padding:4px 10px;font-weight:700;color:var(--ink);font:inherit;font-weight:700}
.buildline button.key,.tok.key{background:var(--hi);color:#141B2E;border-color:#141B2E}
.blitz-time{font-family:var(--display,inherit);font-size:2.4rem;font-weight:800;color:var(--accent)}
.blitz-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-size:1.5rem;padding:22px;border:2px dashed var(--line);border-radius:16px;text-align:center}
.blitz-card .emo{font-size:2rem}.blitz-mean{color:var(--accent);font-weight:700}
.flash-ok{animation:fok .35s}.flash-no{animation:fno .35s}
@keyframes fok{from{background:rgba(59,165,92,.25)}to{background:transparent}}
@keyframes fno{from{background:rgba(214,69,69,.25)}to{background:transparent}}
.instr i{font-style:normal;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;display:block;color:var(--muted);opacity:.85}
.example{border:2px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:.95rem}
.example b{font-family:var(--display)}
.prompt{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--display);font-weight:700;font-size:1.5rem}
.prompt .emo{font-size:3.4rem;line-height:1}
.prompt .cue-txt{font-size:1.4rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:center;min-height:56px;font-size:1.05rem}
.opt kbd{font-family:var(--display);font-size:.78rem;background:var(--soft);border-radius:6px;padding:1px 7px;color:var(--muted);flex:none}
.opt .emo{font-size:1.8rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;border:2px solid;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.fb.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.fb.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.fb b{font-family:var(--display)}
.fb.ok .v{color:var(--good)} .fb.no .v{color:var(--bad)}
.letters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.letters .fixed,.letters input{width:42px;height:50px;border-radius:10px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.35rem;text-transform:lowercase}
.letters .fixed{display:grid;place-items:center;background:var(--soft)}
.letters .gap{width:16px}
.letters input{border:2px solid var(--accent);background:var(--surface);color:var(--ink)}
.letters input.bad{border-color:var(--bad)} .letters input.good{border-color:var(--good)}
.typed{font-family:var(--display);font-size:1.3rem;padding:10px 14px;border-radius:12px;border:2px solid var(--accent);background:var(--surface);color:var(--ink);width:100%;max-width:360px}
.misspelt{font-family:var(--display);font-weight:800;font-size:2rem;text-decoration:underline wavy var(--bad);text-underline-offset:6px}

/* sort */
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.chip[aria-pressed="true"]{background:var(--hi);color:#141B2E}
.chip.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.bucket{border:2px dashed var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:120px;background:var(--surface)}
.bucket.ready{border-color:var(--accent);border-style:solid}
.bucket h3{font-size:.98rem}
.bucket .placed{display:flex;flex-wrap:wrap;gap:6px}
.bucket .placed span{background:color-mix(in srgb,var(--good) 15%,var(--surface));border:1px solid var(--good);border-radius:999px;padding:2px 10px;font-size:.9rem}
.bucket .placed span.ex{border-style:dashed}

/* search */
.search-wrap{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.grid{display:grid;gap:3px;user-select:none;touch-action:manipulation}
.cell{width:34px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700;font-size:1.05rem;text-transform:uppercase;padding:0}
.cell.sel{background:var(--hi);color:#141B2E;border-color:var(--hi)}
.cell.found{background:color-mix(in srgb,var(--good) 25%,var(--surface));border-color:var(--good)}
.cell.ex{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.cell.flash{background:color-mix(in srgb,var(--bad) 25%,var(--surface))}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.clues li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.clues li .emo{font-size:1.5rem;width:1.8rem;text-align:center}
.clues li.done{border-color:var(--good)}
.clues li.done b{color:var(--good)}
.clues li.miss b{color:var(--bad)}

/* result */
.bigstars{font-size:2.6rem;letter-spacing:6px;color:var(--hi)}
.bigstars .off{color:var(--line)}
.miss-list{display:flex;flex-wrap:wrap;gap:8px}
.miss-list .chip{box-shadow:none;font-weight:400;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;text-align:left}
.miss-list b{font-family:var(--display)}
select{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
footer{color:var(--muted);font-size:.82rem;text-align:center}
.explist{display:flex;flex-direction:column;gap:8px}
.exprow{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;text-align:left;display:grid;grid-template-columns:minmax(150px,1fr) 2fr;gap:4px 14px}
.exprow:hover{border-color:var(--accent)}
.exprow b{font-family:var(--display);font-size:1.05rem}
.exprow .m{color:var(--muted);font-size:.88rem}
.exprow .s{font-size:.92rem}
.exprow mark,.sent mark,.fb mark{background:var(--hi);color:#141B2E;border-radius:4px;padding:0 3px}
.defn{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.35;margin:0}
.sent{font-size:1.3rem;line-height:1.7}
.sent .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);margin:0 4px}
.sent u{text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px;font-weight:700}
.xopt{border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:2px 10px;font-weight:700;margin:2px}
.xopt.struck{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--bad);opacity:.7}
.xopt.keep{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.build{display:inline-flex;flex-wrap:wrap;gap:6px;min-width:120px;min-height:40px;border-bottom:3px solid var(--accent);padding:2px 4px;vertical-align:middle}
.build button{border:1px solid var(--accent);background:var(--soft);border-radius:8px;padding:2px 10px;font-weight:700}
.toks{display:flex;flex-wrap:wrap;gap:8px}
.tok{border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:6px 14px;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.tok:disabled{opacity:.2;box-shadow:none}
.matchgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;align-items:start}
.mcol{display:flex;flex-direction:column;gap:8px}
.mitem{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left}
.mitem[aria-pressed="true"]{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 22%,var(--surface))}
.mitem.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface));cursor:default}
.mitem .n{font-family:var(--display);font-weight:800;color:var(--good);margin-right:6px}
.note{border-left:4px solid var(--hi);padding:6px 12px;background:var(--soft);border-radius:6px;font-size:.92rem}


.xwrap{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.xscroll{overflow-x:auto;max-width:100%}
.xgrid{display:grid;gap:2px;--xc:34px}
.xcell{position:relative;width:var(--xc);height:var(--xc)}
.xcell input{width:100%;height:100%;border:2px solid var(--ink);border-radius:4px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.05rem;text-transform:uppercase;background:var(--surface);color:var(--ink);padding:0}
.xcell input.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.xcell input.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.xn{position:absolute;top:1px;left:3px;font-size:.6rem;font-weight:700;pointer-events:none;color:var(--muted)}
.xblank{width:var(--xc);height:var(--xc)}
.xclues h3{font-size:.95rem;margin:4px 0}
.xclues li{cursor:pointer}
.xclues li b:first-child{font-family:var(--display);min-width:1.4em}
.chainrow{display:flex;flex-wrap:wrap;gap:3px}

.labelwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.dg{width:100%;height:auto;max-height:440px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.dg .f{fill:var(--soft);stroke:var(--ink);stroke-width:2}
.dg .l{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dg .k,.dg .t{fill:var(--ink)}
.dg .g{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dg .lo{stroke:var(--ink);stroke-width:20;stroke-linecap:round}
.dg .li{stroke:var(--soft);stroke-width:16;stroke-linecap:round}
.dg .c{fill:var(--hi);opacity:.35}
.dg .fr{fill:none;stroke:var(--accent);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.dg .w{stroke-width:6}
.dg .ch{fill:none;stroke:var(--muted);stroke-width:3;stroke-dasharray:4 3}
.dg .rf{fill:var(--bad)}
.dg .hl{fill:var(--hi);stroke:var(--ink);stroke-width:2}
.dg .ind{fill:#F29F2B}
.dg .dash{stroke-dasharray:6 4}
.dg .gr{fill:color-mix(in srgb,var(--good) 16%,var(--surface))}
.dg .tree{fill:var(--good)}
.dg .trunk{fill:var(--muted)}
.dg .thin{stroke-width:1.2}
.dg .cord{fill:none;stroke:var(--ink);stroke-width:3}
.dg .pad{fill:var(--line)}
.dg .mk{cursor:pointer;outline:none}
.dg .mk circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.dg .mk text{fill:var(--accent-ink);font:700 13px var(--display);pointer-events:none}
.dg .mk.ready circle{fill:var(--hi);stroke:var(--ink)}
.dg .mk.ready text{fill:#141B2E}
.dg .mk.ok circle{fill:var(--good)}
.dg .mk:focus-visible circle{stroke:var(--hi);stroke-width:4}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.legend li{display:flex;gap:8px;align-items:baseline;border-bottom:1px dashed var(--line);padding:3px 0}
.legend li b{font-family:var(--display);min-width:1.4em}
.legend li.done{color:var(--good)}
@media (max-width:620px){
  .labelwrap{grid-template-columns:1fr}
  .xwrap{grid-template-columns:1fr}
  .xgrid{--xc:27px}
  .xcell input{font-size:.9rem}
  .exprow{grid-template-columns:1fr}
  .matchgrid{grid-template-columns:1fr}
  .side{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .search-wrap{grid-template-columns:1fr}
  .cell{width:29px;height:29px;font-size:.92rem}
  .letters .fixed,.letters input{width:34px;height:44px;font-size:1.15rem}
  .prompt .emo{font-size:2.8rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
.ico{width:1.15em;height:1.15em;vertical-align:-0.15em;fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}.ico .f{fill:var(--soft)}.ico .k{fill:var(--ink);stroke:none}.ico .t{stroke-width:1.4}.ico .w{stroke-width:4}.ico .fl{fill:#F2C14E}
.rulecard{border:2px solid var(--line);border-left:6px solid var(--hi);border-radius:12px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.rulecard h3{margin:0;font-size:1.1rem}
.formula{display:flex;flex-wrap:wrap;gap:8px}.formula code{background:var(--soft);border-radius:8px;padding:4px 10px;font-size:.95rem}
.gex{display:flex;flex-direction:column;gap:6px}.gex div{display:flex;flex-direction:column}
.trap{margin:0;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.gq{font-size:1.2rem;line-height:1.9}.gblank{display:inline-block;min-width:4em;border-bottom:2px solid var(--accent);color:transparent}
.gsent .opt.gpart{display:inline-flex;min-height:0;padding:2px 8px;margin:2px 3px;gap:6px;font-size:1.1rem;vertical-align:baseline;text-decoration:underline;text-underline-offset:4px}
.gsent .opt.gpart kbd{font-size:.65rem;padding:0 5px}
.zopt>span{display:flex;flex-direction:column;gap:4px;width:100%}.zsvg{width:100%;max-width:220px;height:auto;color:var(--ink,currentColor)}
.rdwrap{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
.passage{max-height:64vh;overflow:auto;border:2px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);line-height:1.75;position:sticky;top:8px;font-size:1.02rem}
.passage p{margin:0 0 .8em}.ptitle{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.sbtn{all:unset;cursor:pointer;border-radius:5px;padding:1px 2px;box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 55%,transparent)}
.sbtn:hover:not(:disabled){background:var(--soft)}.sbtn:focus-visible{outline:2px solid var(--accent)}.sbtn:disabled{cursor:default;box-shadow:none}
.passage .right{background:color-mix(in srgb,var(--good) 25%,transparent);border-radius:5px}.passage .wrong{background:color-mix(in srgb,var(--bad) 20%,transparent);border-radius:5px}
.passage .evid{background:color-mix(in srgb,var(--hi) 50%,transparent);border-radius:5px}
.rq{display:flex;flex-direction:column;gap:10px}.rq .tag{align-self:flex-start}.phint{display:none;margin:-6px 0 0}.rqtext{font-size:1.1rem;font-weight:600;margin:0}
.rside{display:flex;flex-direction:column;gap:12px}.rside .opts{grid-template-columns:1fr}.rside .opts.tf3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:760px){.rdwrap{grid-template-columns:1fr}.passage{max-height:42vh;position:static}.phint{display:block}}
.exgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.excard{border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer;background:var(--surface)}
.excard:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}.excard input{align-self:flex-start}
.opt.chosen{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.passage .sbtn.chosen{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.exnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.exnav button{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;font-weight:700;font-size:.9rem}
.exnav button.done{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-color:var(--accent)}
.exnav button.flag{background:color-mix(in srgb,var(--hi) 60%,var(--surface));border-color:var(--hi)}
.exnav button.cur{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface))}.legend.flag{border-color:var(--hi);background:var(--hi)}
#etime.low{color:var(--bad)}
.exscore{display:flex;flex-direction:column;align-items:center;justify-content:center;width:110px;height:110px;border-radius:50%;border:6px solid var(--accent);font-family:var(--display)}.exscore strong{font-size:2.2rem;line-height:1}
.exbars{display:flex;flex-direction:column;gap:8px}.exbar{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:10px;align-items:center}
.exrev{display:flex;flex-direction:column;gap:10px;padding-left:1.4em}.exrev li{border-left:4px solid var(--good);padding:6px 10px;background:var(--surface);border-radius:6px;display:flex;flex-direction:column;gap:4px}
.exrev li.no{border-left-color:var(--bad)}.exrev.onlywrong li.ok{display:none}.exq{font-size:1rem}
.v.ok{color:var(--good);font-weight:700}.v.no{color:var(--bad);font-weight:700}
.printhead{display:none}
@media (max-width:560px){.exbar{grid-template-columns:1fr}}
@media print{header.top,footer,.noprint,#crumbs{display:none!important}.printhead{display:block;font-weight:700;margin-bottom:8px}.exrev li{break-inside:avoid}.exrev.onlywrong li.ok{display:flex}body{background:#fff}}
[hidden]{display:none!important}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.linkbtn:hover{color:var(--accent)}
.disc h3{font-size:1rem;margin:4px 0 0}
</style>
</head>

function examUnits(lv,kind){return SECTIONS.filter(s=>s.lv===lv).flatMap(s=>s.units).filter(u=>UNITS[u]&&(kind==="vocab"?!isGram(u)&&!isRead(u):kind==="grammar"?isGram(u):isRead(u)));}
function exVocab(lv,n){
  const us=new Set(examUnits(lv,"vocab"));const pool=ALL.filter(o=>us.has(o.u));
  return sample(pool,Math.min(n,pool.length)).map(o=>{
    if(isExp(o)&&o.ex&&Math.random()<.6){const opts=shuffle([o].concat(distract(o,pool.filter(isExp),3,"f",ALL.filter(isExp))));
      return {skill:"vocab",kind:"Melengkapi kalimat",q:sent(o,'<span class="gblank">_____</span>'),opts:opts.map(x=>x.f),ans:opts.indexOf(o),why:`${esc(o.f)} = ${esc(o.idn)}. ${esc(o.d||"")}`};}
    if(Math.random()<.5){const opts=shuffle([o].concat(distract(o,pool,3,"idn")));
      return {skill:"vocab",kind:"Arti kata",q:`What does “<b>${esc(o.w)}</b>” mean?`,opts:opts.map(x=>x.idn),ans:opts.indexOf(o),why:`${esc(o.w)} = ${esc(o.idn)}.`};}
    const opts=shuffle([o].concat(distract(o,pool,3,"w")));
    return {skill:"vocab",kind:"Kata bahasa Inggris",q:`Bahasa Inggris dari “<b>${esc(o.idn)}</b>” adalah …`,opts:opts.map(x=>x.w),ans:opts.indexOf(o),why:`${esc(o.idn)} = ${esc(o.w)}.`};
  });
}
function exGramItem(u,it){
  if(it.k==="mc")return {skill:"grammar",kind:"Structure",topic:UNITS[u].idn,q:gBlank(it.q,'<span class="gblank">_____</span>'),opts:it.opts.slice(),ans:it.ans,why:esc(it.why)};
  if(it.k==="err"){const parts=it.segs.filter(x=>x.startsWith("[")).map(x=>x.slice(1,-1));let j=0;
    const q=it.segs.map(s=>s.startsWith("[")?`<u>${esc(s.slice(1,-1))}</u><sup>${"ABCD"[j++]}</sup>`:esc(s)).join("");
    return {skill:"grammar",kind:"Written Expression",topic:UNITS[u].idn,q:`${q}<div class="small muted" style="margin-top:6px">Bagian mana yang salah?</div>`,opts:parts.map((p,k)=>`${"ABCD"[k]}. ${p}`),ans:it.ans,why:`Perbaikan: <b>${esc(it.fix)}</b>. ${esc(it.why)}`};}
  if(it.k==="time"){const others=shuffle(Object.keys(ZONES).filter(z=>z!==it.zone)).slice(0,3);const zs=shuffle([it.zone,...others]);
    return {skill:"grammar",kind:"Tenses",topic:UNITS[u].idn,q:`“${esc(it.q)}”<div class="small muted" style="margin-top:6px">Kapan kejadian dalam kalimat ini terjadi?</div>`,opts:zs.map(z=>ZONES[z].l),ans:zs.indexOf(it.zone),why:`Tense: ${esc(ZONES[it.zone].t)}.`};}

}
function exGrammar(lvs,n,kinds){
  const all=lvs.flatMap(lv=>examUnits(lv,"grammar")).flatMap(u=>UNITS[u].gi.filter(it=>kinds.includes(it.k)).map(it=>[u,it]));
  return sample(all,Math.min(n,all.length)).map(([u,it])=>exGramItem(u,it)).filter(Boolean);
}
function exReading(lv,n){
  const texts=shuffle(examUnits(lv,"reading").flatMap(u=>UNITS[u].texts));
  const out=[];
  for(const T of texts){
    if(out.length>=n)break;
    let qs=T.qs.slice();const room=n-out.length;
    if(qs.length>room){qs=qs.filter(q=>q.k!=="ev").slice(0,room);}
    qs.forEach(x=>{
      if(x.k==="ev"){out.push({skill:"reading",kind:KLABEL.ev,T,ev:true,q:x.q,ans:x.si,why:esc(x.why)});return;}
      let opts=x.opts.slice(),ans=x.ans;
      if(x.k!=="tfng"){const sh=shuffle(opts.map((o,k)=>[o,k]));opts=sh.map(y=>y[0]);ans=sh.findIndex(y=>y[1]===x.ans);}
      out.push({skill:"reading",kind:KLABEL[x.k],T,q:x.q,opts,ans,si:x.si,why:esc(x.why)});
    });
  }
  return out;
}
function buildExam(lv,P,skills){
  let items=[];
  if(P.toefl){
    const st=exGrammar(["kuliah","sma"],15,["mc"]).map(x=>({...x,part:"Structure"}));
    const we=exGrammar(["kuliah","sma"],25,["err"]).map(x=>({...x,part:"Written Expression"}));
    const rd=exReading("kuliah",50).map(x=>({...x,part:"Reading Comprehension"}));
    items=st.concat(we,rd);
  }else{
    const on=Object.keys(P.mix).filter(k=>skills.includes(k));
    const tot=Object.values(P.mix).reduce((a,b)=>a+b,0);const sub=on.reduce((a,k)=>a+P.mix[k],0)||1;
    const cnt={};let left=tot;on.forEach((k,i)=>{cnt[k]=i===on.length-1?left:Math.round(P.mix[k]*tot/sub);left-=cnt[k];});
    if(cnt.vocab)items=items.concat(exVocab(lv,cnt.vocab));
    if(cnt.grammar)items=items.concat(exGrammar([lv],cnt.grammar,lv==="sd"?["mc"]:["mc","err","time"]));
    if(cnt.reading)items=items.concat(exReading(lv,cnt.reading));
  }
  return items;
}

      ${body}
      <div class="row between"><button type="button" class="btn ghost" id="eprev" ${E.cur?"":"disabled"}>← Sebelumnya</button>
      ${E.cur<N-1?`<button type="button" class="btn" id="enext">Berikutnya →</button>`:`<button type="button" class="btn" id="efin2">Selesai ujian</button>`}</div>
    </section>
    <section class="panel"><div class="row between"><b>Navigasi soal</b><span class="muted small"><span class="legend done"></span> terjawab · <span class="legend flag"></span> ragu-ragu</span></div>
      <div class="exnav">${E.items.map((x,i)=>`<button type="button" class="${E.ans[i]!==null?"done":""} ${E.flag.has(i)?"flag":""} ${i===E.cur?"cur":""}" data-i="${i}" aria-label="Soal ${i+1}">${i+1}</button>`).join("")}</div>
      <div class="row"><button type="button" class="btn ghost" id="efin">Selesai ujian</button></div><div id="econf"></div></section>
  </div>`);
  SCR().querySelectorAll(".exopts .opt").forEach(b=>b.onclick=()=>examPick(+b.dataset.k));
  SCR().querySelectorAll("#psg .sbtn").forEach(b=>b.onclick=()=>examPick(+b.dataset.s));
  SCR().querySelectorAll(".exnav button").forEach(b=>b.onclick=()=>{E.cur=+b.dataset.i;renderExam();});
  $("#eflag").onchange=e=>{e.target.checked?E.flag.add(E.cur):E.flag.delete(E.cur);renderExam();};
  $("#eprev").onclick=()=>{if(E.cur){E.cur--;renderExam();}};
  if($("#enext"))$("#enext").onclick=()=>{E.cur++;renderExam();};
  const askFin=()=>{const un=N-E.ans.filter(x=>x!==null).length;
    $("#econf").innerHTML=`<div class="fb no" style="margin-top:10px"><div>${un?`Masih ada <b>${un}</b> soal belum dijawab. `:""}${E.flag.size?`Ada <b>${E.flag.size}</b> soal ragu-ragu. `:""}Yakin ingin mengakhiri ujian?</div><div class="row"><button type="button" class="btn sm" id="eyes">Ya, selesai</button><button type="button" class="btn ghost sm" id="eno">Lanjut mengerjakan</button></div></div>`;

function askLeave(){
  const box=$("#econf");if(!box){showMap();return;}

  $("#lyes").onclick=()=>{clearInterval(window.__exT);EXAM=null;showMap();};$("#lno").onclick=()=>{box.innerHTML="";};box.scrollIntoView({block:"center"});
}
function examPick(k){if(!EXAM||EXAM.done)return;EXAM.ans[EXAM.cur]=k;const box=$("#psg");const st=box?box.scrollTop:0;renderExam();const b2=$("#psg");if(b2)b2.scrollTop=st;}
document.addEventListener("keydown",e=>{
  if(!EXAM||EXAM.done||!document.getElementById("etime")||e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==="INPUT")return;
  const it=EXAM.items[EXAM.cur];const n=+e.key;
  if(!it.ev&&n>=1&&n<=it.opts.length){e.preventDefault();examPick(n-1);}
  else if(e.key==="ArrowRight"&&EXAM.cur<EXAM.items.length-1){EXAM.cur++;renderExam();}
  else if(e.key==="ArrowLeft"&&EXAM.cur>0){EXAM.cur--;renderExam();}
});
function cefrOf(lv,pct){
  if(lv==="kuliah")return pct>=90?"C1":pct>=70?"B2":pct>=50?"B1":"A2";
  const B={sd:["Pre-A1","Pre-A1","A1"],smp:["Pre-A1","A1","A2"],sma:["A1","A2","B1"]}[lv];
  return pct>=80?B[2]:pct>=50?B[1]:B[0];
}

  mount(`<section class="panel exres">

      <div class="exscore"><strong>${pct}</strong><small>dari 100</small></div></div>
    <p><b>${ok}</b> dari ${N} jawaban benar.</p>
    <div class="exbars">${Object.entries(by).map(([k,[a,b]])=>{const p=Math.round(a/b*100);return `<div class="exbar"><span>${esc(k)}</span><div class="bar"><i style="width:${p}%"></i></div><b>${a}/${b} · ${p}%</b></div>`;}).join("")}</div>
    <div class="example"><b>Perkiraan level CEFR: ${cefr}</b><div class="small muted">Perkiraan kasar berdasarkan hasil latihan ini, bukan hasil tes resmi. Rentang jenjang ${esc(J.name)}: ${esc(J.cefr)}.</div>
      <ul class="howlist small">${Object.entries(by).filter(([,[a,b]])=>a/b<.7).map(([k])=>`<li>Perkuat bagian <b>${esc(k)}</b>: ulangi unit-unitnya di peta.</li>`).join("")||"<li>Semua bagian sudah di atas 70%. Pertahankan!</li>"}</ul></div>
    <div class="row noprint"><button type="button" class="btn" id="exAgain">Ujian lagi</button><button type="button" class="btn ghost" id="exPrint">Cetak / simpan PDF</button><button type="button" class="btn ghost" id="exMap">Ke peta</button>
      <label class="toggle"><input type="checkbox" id="exOnlyWrong"> Pembahasan: hanya yang salah</label></div>

    <ol class="exrev">${E.items.map((it,i)=>`<li class="${res[i]?"ok":"no"}"><div class="row" style="gap:6px"><span class="tag">${esc(it.part||SKILL[it.skill])}</span><span class="tag">${esc(it.kind)}</span>${res[i]?'<span class="v ok">✓ Benar</span>':'<span class="v no">✗ Salah</span>'}</div>
      ${it.T?`<div class="small muted">Bacaan: ${esc(it.T.title)}</div>`:""}
      <div class="exq">${it.q}</div>
      <div class="small">Jawabanmu: ${ansTxt(it,E.ans[i])}</div>${res[i]?"":`<div class="small">Jawaban benar: <b>${ansTxt(it,it.ans)}</b></div>`}

  </section>`);

// ---------- round builders ----------
// ungkapan yang bisa saling menggantikan tidak boleh jadi pengecoh satu sama lain
const SYN=[
 ["therefore","consequently","thus","as a result","hence","so"],
 ["however","nevertheless","nonetheless","on the other hand","in contrast","conversely","whereas","although","even though","despite","in spite of","though","while"],
 ["moreover","furthermore","in addition","besides","additionally","what is more","similarly","likewise"],
 ["for example","for instance","such as","a good example of this is"],
 ["overall","on the whole","to sum up","in conclusion","in summary","in short","to conclude","all things considered","in my opinion","to be honest"],
 ["due to","owing to","because of","as a result of","because"],
 ["as far as i know","if i remember correctly"],
 ["it is widely believed that","there is no doubt that","i'd say that","what i mean is","the main reason is that"],
 ["let me think about that","that's an interesting question"],
 ["merger","acquisition"],
 ["accuracy","precision"]];
const SYNG=new Map();SYN.forEach((g,i)=>g.forEach(w=>SYNG.set(w,i)));
const sameSyn=(a,b)=>{const x=SYNG.get(a.w.toLowerCase());return x!=null&&x===SYNG.get(b.w.toLowerCase());};
function distract(o,pool,n,key,backup){
  const seen=new Set([o[key]]),out=[];
  const src=shuffle(pool).concat(shuffle(backup||ALL));
  for(const x of src){ if(out.length>=n)break; if(!seen.has(x[key])&&!sameSyn(o,x)&&!out.some(y=>sameSyn(x,y))){seen.add(x[key]);out.push(x);} }
  return out;
}
function expItems(type,pool){
  const all=ALL.filter(isExp);let p=pool.filter(isExp);
  if(type==="order"){const p3=p.filter(o=>o.f.split(" ").length>=3);p=p3.length>=4?p3:p.filter(o=>o.f.split(" ").length>=2);}
  if(type==="cross"||type==="truefalse")p=p.filter(o=>o.x);
  if(type==="halves"){const seen=new Set();const prs=shuffle(p).map(splitHalves).filter(x=>x&&!seen.has(x.r)&&seen.add(x.r));if(prs.length<5)return null;const ch2=prs.slice(0,6);const ex2=ch2.pop();return {type,pairs:ch2.slice(0,5),ex:ex2};}
  if(p.length<4)return null;
  let ch=sample(p,p.length).filter((o,i,a)=>!a.slice(0,i).some(y=>sameSyn(o,y))).slice(0,itemsN()+1);if(ch.length<4)return null;const ex=ch.pop();
  const make=o=>{
    if(type==="def"||type==="cloze"){const key=type==="def"?"w":"f";const opts=shuffle([o].concat(distract(o,p,3,key,all)));return {o,opts,ans:opts.indexOf(o),key};}
    if(type==="cross"){const opts=shuffle([o.f,o.x]);return {o,opts,wrongIdx:opts.indexOf(o.x)};}
    if(type==="truefalse"){const t=Math.random()<.5;return {o,isTrue:t,shown:t?o.f:o.x,ans:t?0:1};}
    if(type==="order"){const toks=o.f.split(" ").map((t,i)=>({t,i}));let sh=shuffle(toks);let g=0;while(sh.map(x=>x.t).join(" ")===o.f&&g++<12)sh=shuffle(toks);return {o,toks:sh};}
  };
  if(type==="match")return {type,pairs:ch.slice(0,Math.min(5,ch.length)).map(o=>({o,l:o.d,r:o.w})),ex:{o:ex}};
  return {type,items:ch.map(make),ex:make(ex)};
}
function mcqItems(type,pool,n){
  const chosen=sample(pool,n+1); const ex=chosen.pop();
  const make=o=>{const opts=shuffle([o].concat(distract(o,pool,3,"w")));return {o,opts,ans:opts.indexOf(o)};};
  return {items:chosen.map(make),ex:make(ex)};
}
function oddItem(pool){
  const groups={};pool.forEach(o=>{if(o.c)(groups[o.c]=groups[o.c]||[]).push(o);});
  const keys=Object.keys(groups).filter(k=>groups[k].length>=3);
  if(!keys.length||Object.keys(groups).length<2)return null;
  const A=pick(keys);const same=sample(groups[A],3);
  const others=pool.filter(o=>o.c&&o.c!==A);const odd=pick(others);
  const opts=shuffle(same.concat([odd]));
  return {o:odd,opts,ans:opts.indexOf(odd),cat:A,u:odd.u};
}
function catName(u,k){const U=UNITS[u];return U&&U.cats[k]?U.cats[k]:k;}
function misspell(w){
  const vowels="aeiou";
  for(let t=0;t<30;t++){
    const a=w.split("");const i=1+Math.floor(Math.random()*(a.length-2));const r=Math.random();
    if(r<.3){[a[i],a[i+1]]=[a[i+1],a[i]];}
    else if(r<.5){a.splice(i,1);}
    else if(r<.7){a.splice(i,0,a[i]);}
    else if(vowels.includes(a[i])){a[i]=pick(vowels.replace(a[i],"").split(""));}
    else {const j=a.findIndex((c,k)=>k>0&&vowels.includes(c));if(j<0)continue;a[j]=pick(vowels.replace(a[j],"").split(""));}
    const s=a.join("");
    if(s!==w&&!ALL.some(x=>x.w===s))return s;
  }
  return w.slice(0,-1);
}
function maskWord(w){
  const idx=[...w].map((c,i)=>/[a-zA-Z]/.test(c)?i:-1).filter(i=>i>=0);
  const n=Math.max(1,Math.round(idx.length*.4));
  const cand=idx.length>3?idx.slice(1):idx;
  return new Set(sample(cand,Math.min(n,cand.length)));
}
function buildRound(type,pool){
  if(type==="read")return buildRead(BUILDU,READI++);
  if(type==="gctx")return buildCtx(BUILDU);
  if(MODELS[type]&&MODELS[type].gram)return buildGram(type,BUILDU);
  if(type==="memo")return buildMemo(pool);
  if(type==="mean")return buildMean(pool);
  if(type==="flash")return buildFlash(pool);
  if(type==="scramble")return buildScramble(pool);
  if(type==="build")return buildSentence(pool);
  if(type==="blitz")return buildBlitz(pool);
  if(["def","match","cloze","cross","truefalse","order","halves"].includes(type))return expItems(type,pool);
  if(["name","chain","xword"].includes(type))return buildNew(type,pool);
  if(type==="label")return buildLabel(pool);
  if(type==="pick"){const r=mcqItems(type,pool,itemsN());return {type,...r};}
  if(type==="odd"){const items=[];let g=0;while(items.length<4&&g++<40){const it=oddItem(pool);if(it&&!items.some(x=>x.o===it.o))items.push(it);}const ex=oddItem(pool);return items.length?{type,items,ex}:null;}
  if(type==="missing"){const ch=sample(pool,itemsN()+1);const ex=ch.pop();return {type,items:ch.map(o=>({o,mask:maskWord(o.w)})),ex:{o:ex,mask:maskWord(ex.w)}};}
  if(type==="spell"){const p=pool.filter(o=>isWord(o)&&o.w.length>=4);if(p.length<4)return null;const ch=sample(p,Math.min(itemsN()+1,p.length));const ex=ch.pop();return {type,items:ch.map(o=>({o,bad:misspell(o.w)})),ex:{o:ex,bad:misspell(ex.w)}};}
  if(type==="sort"){
    const groups={};pool.forEach(o=>{if(o.c)(groups[`${o.u}|${o.c}`]=groups[`${o.u}|${o.c}`]||[]).push(o);});
    const keys=shuffle(Object.keys(groups).filter(k=>groups[k].length>=3)).slice(0,3);
    if(keys.length<2)return null;
    const per=keys.length===2?4:3;
    const words=[];keys.forEach(k=>sample(groups[k],per).forEach(o=>words.push(o)));
    const ex=words[0];
    return {type,keys,words:shuffle(words.slice(1)),ex};
  }
  if(type==="search"){
    const p=pool.filter(o=>/^[A-Za-z]+$/.test(o.w)&&o.w.length>=3&&o.w.length<=9);
    const ch=sample(p,7);if(ch.length<4)return null;
    const size=Math.max(9,Math.max(...ch.map(o=>o.w.length))+1);
    const grid=Array.from({length:size},()=>Array(size).fill(null));
    const dirs=[[0,1],[1,0],[1,1]];const placed=[];
    for(const o of ch){
      let ok=false;
      for(let t=0;t<200&&!ok;t++){
        const [dr,dc]=pick(dirs);const L=o.w.length;
        const r0=Math.floor(Math.random()*(size-(dr?L:0)+ (dr?0:0)) ), c0=Math.floor(Math.random()*(size-(dc?L:0)));
        if(r0<0||c0<0)continue;
        let fits=true;
        const W=o.w.toLowerCase();
        for(let k=0;k<L;k++){const r=r0+dr*k,c=c0+dc*k;if(r>=size||c>=size){fits=false;break;}const v=grid[r][c];if(v&&v!==W[k]){fits=false;break;}}
        if(!fits)continue;
        const cells=[];for(let k=0;k<L;k++){const r=r0+dr*k,c=c0+dc*k;grid[r][c]=W[k];cells.push(r*size+c);}
        placed.push({o,cells});ok=true;
      }
    }
    if(placed.length<4)return null;
    const abc="abcdefghijklmnopqrstuvwxyz";
    for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(!grid[r][c])grid[r][c]=abc[Math.floor(Math.random()*26)];
    return {type,size,grid,placed,ex:placed[0]};
  }
}

// ---------- runs ----------
let RUN=null;
const ORDERS={sd:[["pick","mean"],["odd","sort"],["missing","scramble"],["flash"],["build"],["gctx"]],pic:[["pick","mean","flash"],["memo"],["sort","odd","label"],["missing","spell","name","scramble"],["search","xword","chain"],["build"],["gctx"],["blitz"]],exp:[["def","match"],["memo"],["cloze","cross","halves"],["truefalse"],["order"],["build"],["gctx"],["blitz"]],mix:[["pick","mean"],["memo"],["def","match","halves"],["cross","truefalse"],["sort","order","xword"],["build"],["gctx"],["blitz"]]};
let BUILDU=null;
function startLevel(u){
  const pool=UNITS[u].list;BUILDU=u;READI=0;GUSED={u,set:new Set()};
  const types=[],pre=[];
  orderFor(u).forEach(g=>{
    let opts=g.map(t=>[t,buildRound(t,pool)]).filter(x=>x[1]);
    if(!opts.length&&isGram(u))opts=[["gmc",buildGram("gmc",u)]];
    if(!opts.length&&g[0]==="gctx")return;
    if(!opts.length){for(const t of ["odd","sort","spell","missing","pick"]){if(types.includes(t))continue;const R=buildRound(t,pool);if(R){opts=[[t,R]];break;}}}
    if(!opts.length)opts=[["pick",buildRound("pick",pool)]];
    const [t,R]=opts.find(x=>x[0]==="label")||pick(opts);types.push(t);pre.push(R);});
  RUN={mode:"level",unit:u,pool,types,pre,ri:0,correct:0,total:0,missed:new Map()};
  nextRound();
}
function startFree(model,u){

}
function startReview(){

function crumbsForRun(){

function nextRound(){
  if(RUN.ri>=RUN.types.length)return showResult();

  if(RUN.mode==="review"&&pool.length<4)pool=pool.concat(sample(ALL.filter(o=>!pool.includes(o)),4));

    R.note=`Unit ini tidak punya cukup bahan untuk ${MODELS[orig].name}, jadi diganti ${MODELS[fb].name}.`;
  }
  if(RUN.mode==="review"){R.items=R.items.filter(it=>RUN.pool.includes(it.o)).concat(R.items.filter(it=>!RUN.pool.includes(it.o))).slice(0,Math.max(1,Math.min(R.items.length,RUN.pool.length)));}
  RUN.R=R;RUN.qi=0;RUN.rc=0;RUN.rt=0;
  crumbsForRun();
  renderIntro();
}
function record(o,ok){
  RUN.total++;RUN.rt++;STATS.answered++;if(ok)STATS.correct++;
  if(ok){RUN.correct++;RUN.rc++;if(RUN.mode==="review")removeReview(o);}
  else {RUN.missed.set(o.u+"|"+o.w,o);addReview(o);}
  saveAll();
}
function hud(){
  const label=RUN.mode==="level"?`${RUN.ri+1}/${RUN.types.length}`:RUN.mode==="review"?"Ulang":"Bebas";
  const pct=RUN.mode==="level"?(RUN.ri/RUN.types.length*100):0;
  return `<div class="hud"><div class="stat"><small>Babak</small><strong>${label}</strong></div><div class="stat"><small>Benar</small><strong>${RUN.correct}/${RUN.total}</strong></div><div class="stat"><small>Unit</small><strong>${RUN.unit||"Campur"}</strong></div></div>
  ${RUN.mode==="level"?`<div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>`:""}`;
}
function head(){
  const m=MODELS[RUN.R.type];
  return `<div class="qhead"><h2>${esc(m.name)}</h2><span class="tag">Keterampilan: ${esc(m.skill)}</span></div>`;
}
function exampleHtml(){
  const R=RUN.R,ex=R.ex;if(R.read)return rExample(R);if(R.gram)return gExample(R);if(!ex)return "";
  switch(R.type){
    case "pick":return `${cue(ex.o)} → <b>${esc(ex.o.w)}</b>`;
    case "odd":return `${ex.opts.map(o=>o===ex.o?`<b><u>${esc(o.w)}</u></b>`:esc(o.w)).join(", ")} → <b>${esc(ex.o.w)}</b> bukan kelompok ${esc(catName(ex.u,ex.cat))}`;
    case "missing":return `${cue(ex.o)}: ${[...ex.o.w].map((c,i)=>ex.mask.has(i)?"_":c).join("")} → <b>${esc(ex.o.w)}</b>`;
    case "spell":return `<s>${esc(ex.bad)}</s> → <b>${esc(ex.o.w)}</b>`;
    case "sort":return `<b>${esc(ex.w)}</b> sudah diletakkan di kelompok ${esc(catName(ex.u,ex.c))}.`;
    case "search":return `Kata <b>${esc(ex.o.w)}</b> sudah ditandai di kotak sebagai contoh.`;
    case "def":return `“${esc(ex.o.d)}” → <b>${esc(ex.o.w)}</b>`;
    case "match":return `“${esc(ex.o.d)}” ↔ <b>${esc(ex.o.w)}</b>`;
    case "halves":return `${esc(ex.l)} … <b>${esc(ex.r)}</b>`;
    case "name":return `${cue(ex.o)} → <b>${esc(ex.o.w)}</b>`;
    case "chain":return `Kata <b>${esc(ex.o.w)}</b> sudah ditandai di rantai sebagai contoh.`;
    case "xword":return `Petunjuk “apel (5)” diisi A·P·P·L·E.`;
    case "label":return `Nomor ${ex.n} pada gambar ${esc(RUN.R.d.title.toLowerCase())} sudah diberi label <b>${esc(ex.o.w)}</b>.`;
    case "cloze":return `<span class="sent" style="font-size:1rem">${sent(ex.o,"<mark>"+esc(ex.o.f)+"</mark>")}</span>`;
    case "cross":return `${sent(ex.o,`[<b>${esc(ex.o.f)}</b> / <s>${esc(ex.o.x)}</s>]`)}`;
    case "truefalse":return `${sent(ex.o,"<u>"+esc(ex.shown)+"</u>")} → <b>${ex.isTrue?"Benar":"Salah"}</b>${ex.isTrue?"":` (yang tepat: ${esc(ex.o.f)})`}`;
    case "order":return `${ex.toks.map(x=>esc(x.t)).join(" · ")} → <b>${esc(ex.o.f)}</b>`;
    case "mean":return `<b>${esc(ex.o.w)}</b> → ${cue(ex.o)}`;
    case "flash":return `${ex.words.map(o=>esc(o.w)).join(" → ")} → (disembunyikan) → ketuk dengan urutan yang sama.`;
    case "scramble":return `${cue(ex.o)}: <code>${esc(ex.letters.join(" "))}</code> → <b>${esc(ex.o.w.toLowerCase())}</b>`;
    case "memo":return `Pelajari: ${cue(ex.o)} = <b>${esc(ex.o.w)}</b>. Lalu ketik dari ingatan: <code>${esc(memoHint(ex.o.w))}</code> → <b>${esc(ex.o.w)}</b>`;
    case "build":return `${ex.toks.map(x=>x.key?`<b>${esc(x.t)}</b>`:esc(x.t)).join(" · ")}<br>→ <b>${esc(ex.answer)}</b>`;
    case "blitz":return `<b>${esc(ex.o.w)}</b> = ${esc(ex.shown)} → <b>${ex.match?"✓ Cocok":"✗ Tidak cocok"}</b>`;
  }
}
function roundSize(){const R=RUN.R;if(R.type==="blitz"||R.type==="memo")return 0;if(R.items)return R.items.length;if(R.pairs)return R.pairs.length;return 0;}
function renderIntro(){

    <section class="qcard">${head()}
      <div class="instr"><i>${esc(m.skill)}</i><ul class="howlist">${[].concat(m.how).map(x=>`<li>${esc(x)}</li>`).join("")}${roundSize()?`<li>Jumlah soal di babak ini: <b>${roundSize()}</b>.</li>`:""}</ul></div>
      ${RUN.R.note?`<p class="note">${esc(RUN.R.note)}</p>`:""}
      <div class="example">${RUN.R.type==="rule"||RUN.R.read?exampleHtml():`<span class="tag">Contoh</span> ${exampleHtml()}`}</div>
      <div class="row"><button type="button" class="btn" id="go">Mulai babak</button></div>
    </section></div>`);
  $("#go").onclick=renderPlay;$("#go").focus({preventScroll:true});
}
function renderPlay(){
  if(RUN.R.read)return renderRItem();
  if(RUN.R.gram)return renderGItem();
  const t=RUN.R.type;
  if(t==="sort")return renderSort();
  if(t==="match"||t==="halves")return renderMatch();

// ---------- item-by-item games ----------
function shell(inner){
  return `<div style="display:flex;flex-direction:column;gap:12px">${hud()}<section class="qcard">${head()}
    <div class="row between"><span class="muted small">Soal ${RUN.qi+1} dari ${RUN.R.items.length}</span></div>${inner}<div id="fb"></div></section></div>`;
}
function renderItem(){
  if(RUN.R.read)return renderRItem();
  if(RUN.R.gram)return renderGItem();
  if(RUN.R.type==="build")return renderBuildItem();
  if(RUN.R.type==="scramble")return renderScramble();
  if(RUN.R.type==="flash")return renderFlash();
  const R=RUN.R,it=R.items[RUN.qi],t=R.type;RUN.answered=false;
  let inner="";
  if(t==="mean"){inner=`<div class="prompt"><span class="bigword">${esc(it.o.w)}</span></div><div class="opts">${it.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><kbd>${k+1}</kbd><span>${o.e?`<span class="emo" aria-hidden="true">${o.e}</span> `:""}${esc(o.idn)}</span></button>`).join("")}</div>`;}
  if(t==="pick"){inner=`<div class="prompt">${cue(it.o,true)}</div><div class="opts">${it.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(o.w)}</span></button>`).join("")}</div>`;}
  if(t==="odd"){inner=`<p class="muted">Kata mana yang tidak sekelompok?</p><div class="opts">${it.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(o.w)}</span></button>`).join("")}</div>`;}
  if(t==="missing"){inner=`<div class="prompt">${cue(it.o,true)}</div><div class="letters" id="letters">${[...it.o.w].map((c,i)=>c===" "?`<span class="gap"></span>`:it.mask.has(i)?`<input maxlength="1" data-i="${i}" aria-label="Huruf ke-${i+1}" autocomplete="off" autocapitalize="off" spellcheck="false">`:`<span class="fixed">${esc(c)}</span>`).join("")}</div><div><button type="button" class="btn" id="check">Cek jawaban</button></div>`;}
  if(t==="def"){inner=`<p class="defn">“${esc(it.o.d)}”</p><div class="opts">${it.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(o.w)}</span></button>`).join("")}</div>`;}
  if(t==="cloze"){inner=`<p class="sent">${sent(it.o,'<span class="blank"></span>')}</p><div class="opts">${it.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(o.f)}</span></button>`).join("")}</div>`;}
  if(t==="cross"){inner=`<p class="sent">${sent(it.o,`[${it.opts.map((x,k)=>`<button type="button" class="xopt" data-k="${k}" aria-label="Coret ${esc(x)}">${esc(x)}</button>`).join(" / ")}]`)}</p><p class="muted small">Ketuk pilihan yang salah (atau tekan 1/2).</p>`;}
  if(t==="truefalse"){inner=`<p class="sent">${sent(it.o,"<u>"+esc(it.shown)+"</u>")}</p><div class="tfrow"><button type="button" class="opt" data-k="0"><kbd>1</kbd><span>✓ Benar</span></button><button type="button" class="opt" data-k="1"><kbd>2</kbd><span>✗ Salah</span></button></div>`;}
  if(t==="order"){it.built=[];inner=`<p class="sent" id="osent"></p><div class="toks" id="toks"></div><div class="row"><button type="button" class="btn ghost" id="oclear">Hapus</button><button type="button" class="btn" id="check" disabled>Cek jawaban</button></div>`;}
  if(t==="name"){inner=`<div class="prompt">${cue(it.o,true)}</div><p class="muted small">${it.o.w.length} karakter${it.o.w.includes(" ")?", lebih dari satu kata":""}</p><div class="row"><input class="typed" id="typed" aria-label="Kata bahasa Inggris" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ketik kata bahasa Inggrisnya"><button type="button" class="btn" id="check">Cek</button></div>`;}
  if(t==="spell"){inner=`<div class="prompt"><span class="misspelt">${esc(it.bad)}</span></div><p class="muted">Petunjuk: ${cue(it.o)}</p><div class="row"><input class="typed" id="typed" aria-label="Ejaan yang benar" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ketik ejaan yang benar"><button type="button" class="btn" id="check">Cek</button></div>`;}
  mount(shell(inner));
  SCR().querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerOpt(+b.dataset.k));
  SCR().querySelectorAll(".xopt").forEach(b=>b.onclick=()=>answerCross(+b.dataset.k));
  if(t==="order")drawOrder();
  if(t==="missing"){
    const ins=[...SCR().querySelectorAll("#letters input")];
    ins.forEach((inp,j)=>{inp.oninput=()=>{inp.value=inp.value.toLowerCase().replace(/[^a-z]/g,"");if(inp.value&&ins[j+1])ins[j+1].focus();};
      inp.onkeydown=e=>{if(e.key==="Backspace"&&!inp.value&&ins[j-1]){ins[j-1].focus();}if(e.key==="Enter"){e.preventDefault();checkMissing();}};});
    ins[0].focus();$("#check").onclick=checkMissing;
  }
  if(t==="spell"||t==="name"){const inp=$("#typed");inp.focus();inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();checkSpell();}};$("#check").onclick=checkSpell;}
  if(!["missing","spell","order","name"].includes(t)){const f=SCR().querySelector(".opt, .xopt");if(f)f.focus({preventScroll:true});}
}
function feedback(ok,o,extra){
  RUN.answered=true;
  if(isExp(o)&&o.ex)extra=(extra?extra+"<br>":"")+sent(o,"<mark>"+esc(o.f)+"</mark>");
  const last=RUN.qi>=RUN.R.items.length-1;
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><div><span class="v"><b>${ok?"Benar!":"Belum tepat."}</b></span> <b>${esc(o.w)}</b> · ${esc(o.idn)}${extra?`<div class="small muted">${extra}</div>`:""}</div>
  <div class="row"><button type="button" class="btn sm" id="next">${last?"Selesai babak":"Lanjut"}</button></div></div>`;
  
  $("#next").onclick=()=>{if(last)roundDone();else{RUN.qi++;renderItem();}};
  $("#next").focus({preventScroll:true});
}
function answerOpt(k){
  if(RUN.R.read)return rAnswer(k);
  if(RUN.R.gram)return gAnswer(k);
  if(RUN.answered)return;
  const it=RUN.R.items[RUN.qi];const btns=SCR().querySelectorAll(".opt");
  btns.forEach(b=>b.disabled=true);btns[it.ans].classList.add("right");
  const ok=k===it.ans;if(!ok)btns[k].classList.add("wrong");
  record(it.o,ok);
  let extra="";
  if(RUN.R.type==="odd")extra=`${esc(it.o.w)} termasuk ${esc(catName(it.o.u,it.o.c))}; tiga lainnya ${esc(catName(it.u,it.cat))}.`;
  if(RUN.R.type==="truefalse")extra=it.isTrue?"Ungkapan itu dipakai dengan tepat.":`“${esc(it.shown)}” tidak tepat di kalimat ini.`;
  if(RUN.R.type==="def"||RUN.R.type==="cloze")extra=esc(it.o.d);
  feedback(ok,it.o,extra);
}
function answerCross(k){
  if(RUN.answered)return;
  const it=RUN.R.items[RUN.qi];const btns=[...SCR().querySelectorAll(".xopt")];
  btns.forEach(b=>b.disabled=true);
  btns[it.wrongIdx].classList.add("struck");btns[1-it.wrongIdx].classList.add("keep");
  const ok=k===it.wrongIdx;record(it.o,ok);
  feedback(ok,it.o,ok?"":`Yang harus dicoret: “${esc(it.o.x)}”.`);
}
function drawOrder(){
  const it=RUN.R.items[RUN.qi];
  $("#osent").innerHTML=sent(it.o,`<span class="build">${it.built.map((ti,j)=>`<button type="button" data-j="${j}" ${RUN.answered?"disabled":""} aria-label="Hapus ${esc(it.toks[ti].t)}">${esc(it.toks[ti].t)}</button>`).join("")}</span>`);
  $("#toks").innerHTML=it.toks.map((x,k)=>`<button type="button" class="tok" data-k="${k}" ${it.built.includes(k)||RUN.answered?"disabled":""}>${esc(x.t)}</button>`).join("");
  SCR().querySelectorAll("#toks .tok").forEach(b=>b.onclick=()=>{it.built.push(+b.dataset.k);drawOrder();SCR().querySelector("#toks .tok:not(:disabled)")?.focus({preventScroll:true});});
  SCR().querySelectorAll("#osent .build button").forEach(b=>b.onclick=()=>{it.built.splice(+b.dataset.j,1);drawOrder();});
  $("#check").disabled=RUN.answered||it.built.length!==it.toks.length;
  $("#oclear").disabled=RUN.answered;
  $("#oclear").onclick=()=>{it.built=[];drawOrder();};
  $("#check").onclick=()=>{if(RUN.answered)return;const v=it.built.map(k=>it.toks[k].t).join(" ");const ok=v===it.o.f;record(it.o,ok);drawOrder();feedback(ok,it.o,ok?"":`Susunanmu: ${esc(v)}`);};
  if(!RUN.answered&&!SCR().querySelector("#toks .tok:not(:disabled)"))$("#check").focus({preventScroll:true});
}
function checkMissing(){
  if(RUN.answered)return;
  const it=RUN.R.items[RUN.qi];const ins=[...SCR().querySelectorAll("#letters input")];
  let ok=true;ins.forEach(inp=>{const i=+inp.dataset.i;const good=inp.value===it.o.w[i].toLowerCase();if(!good){ok=false;inp.value=it.o.w[i];inp.classList.add("bad");}else inp.classList.add("good");inp.disabled=true;});
  $("#check").disabled=true;record(it.o,ok);feedback(ok,it.o);
}
function checkSpell(){
  if(RUN.answered)return;
  const it=RUN.R.items[RUN.qi];const v=$("#typed").value.trim().toLowerCase().replace(/\s+/g," ").replace(/[’]/g,"'");
  if(!v){$("#typed").focus();return;}
  const ok=v===it.o.w.toLowerCase();$("#typed").disabled=true;$("#check").disabled=true;record(it.o,ok);
  feedback(ok,it.o,ok?"":`Jawabanmu: ${esc(v)}`);
}

// ---------- sort ----------
function renderSort(){
  const R=RUN.R;R.sel=null;R.placed=R.placed||{};R.wrong=new Set();R.left=R.words.slice();
  const draw=()=>{
    mount(`<div style="display:flex;flex-direction:column;gap:12px">${hud()}<section class="qcard">${head()}
      <p class="instr">${esc(howStr("sort"))}</p>
      <div class="chips" id="chips">${R.left.map((o,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="${R.sel===i}">${esc(o.w)}</button>`).join("")||`<span class="muted">Semua kata sudah dikelompokkan.</span>`}</div>
      <div class="buckets">${R.keys.map(k=>{const [u,c]=k.split("|");const inB=R.words.filter(o=>R.placed[o.u+"|"+o.w]===k);const exHere=R.ex.u+"|"+R.ex.c===k;
        return `<button type="button" class="bucket ${R.sel!==null?"ready":""}" data-k="${k}"><h3>${esc(catName(+u,c))}</h3><div class="placed">${exHere?`<span class="ex">${esc(R.ex.w)}</span>`:""}${inB.map(o=>`<span>${esc(o.w)}</span>`).join("")}</div></button>`;}).join("")}</div>
      <div id="fb"></div></section></div>`);
    SCR().querySelectorAll(".chip").forEach(b=>b.onclick=()=>{R.sel=+b.dataset.i;draw();SCR().querySelector(`.chip[data-i="${R.sel}"]`)?.focus({preventScroll:true});});
    SCR().querySelectorAll(".bucket").forEach(b=>b.onclick=()=>{
      if(R.sel===null)return;const o=R.left[R.sel];const k=b.dataset.k;
      if(o.u+"|"+o.c===k){R.placed[o.u+"|"+o.w]=k;R.left.splice(R.sel,1);record(o,!R.wrong.has(o));R.sel=null;draw();
        if(!R.left.length){$("#fb").innerHTML=`<div class="fb ok"><div><b class="v">Selesai!</b> ${RUN.rc}/${RUN.rt} kata benar pada percobaan pertama.</div><button type="button" class="btn sm" id="next">Selesai babak</button></div>`;$("#next").onclick=roundDone;$("#next").focus({preventScroll:true});}
        else SCR().querySelector(".chip")?.focus({preventScroll:true});
      } else {R.wrong.add(o);const chip=SCR().querySelector(`.chip[data-i="${R.sel}"]`);if(chip){chip.classList.remove("shake");void chip.offsetWidth;chip.classList.add("shake");}
        $("#fb").innerHTML=`<div class="fb no"><div><b class="v">Belum tepat.</b> ${esc(o.w)} (${esc(o.idn)}) bukan kelompok itu. Coba kelompok lain.</div></div>`;}
    });
  };
  draw();
}

// ---------- match definitions ----------
function renderMatch(){
  const R=RUN.R;R.sel=null;R.done=new Set();R.wrong=new Set();
  R.left=R.left||shuffle(R.pairs);R.right=R.right||shuffle(R.pairs);
  const draw=msg=>{
    const all=R.done.size===R.pairs.length;
    mount(`<div style="display:flex;flex-direction:column;gap:12px">${hud()}<section class="qcard">${head()}
      <p class="instr">${esc(howStr(R.type))}</p>
      <div class="matchgrid">
        <div class="mcol" aria-label="Kolom kiri">${R.left.map((o,i)=>{const d=R.done.has(o);return `<button type="button" class="mitem ${d?"done":""}" data-l="${i}" aria-pressed="${R.sel===i}" ${d?"disabled":""}>${d?`<span class="n">✓</span>`:""}${esc(o.l)}</button>`;}).join("")}</div>
        <div class="mcol" aria-label="Kolom kanan">${R.right.map((o,i)=>{const d=R.done.has(o);return `<button type="button" class="mitem ${d?"done":""}" data-r="${i}" ${d?"disabled":""}><b>${esc(o.r)}</b></button>`;}).join("")}</div>
      </div>
      <div id="fb">${all?`<div class="fb ok"><div><b class="v">Selesai!</b> ${RUN.rc}/${RUN.rt} pasangan benar pada percobaan pertama.</div><button type="button" class="btn sm" id="next">Selesai babak</button></div>`:msg||""}</div>
    </section></div>`);
    SCR().querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{R.sel=+b.dataset.l;draw();SCR().querySelector(`[data-l="${R.sel}"]`)?.focus({preventScroll:true});});
    SCR().querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
      if(R.sel===null){draw(`<div class="fb no"><div>Pilih definisinya dulu (kolom kiri).</div></div>`);return;}
      const L=R.left[R.sel],P=R.right[+b.dataset.r];
      if(L===P){R.done.add(L);record(L.o,!R.wrong.has(L));R.sel=null;draw();if(R.done.size===R.pairs.length){$("#next").onclick=roundDone;$("#next").focus({preventScroll:true});}}
      else{R.wrong.add(L);draw(`<div class="fb no"><div><b class="v">Belum cocok.</b> “${esc(P.r)}” bukan pasangannya. Coba lagi.</div></div>`);}
    });
  };
  draw();
}

// ---------- word search ----------
function renderSearch(){
  const R=RUN.R;const N=R.size;
  R.found=new Set([0]);R.revealed=new Set();R.start=null;
  const cellOwner=new Map();
  const draw=()=>{
    const foundCells=new Set();R.placed.forEach((p,i)=>{if(R.found.has(i)||R.revealed.has(i))p.cells.forEach(c=>foundCells.add(c));});
    const exCells=new Set(R.placed[0].cells);
    const done=R.placed.every((p,i)=>R.found.has(i)||R.revealed.has(i));
    mount(`<div style="display:flex;flex-direction:column;gap:12px">${hud()}<section class="qcard">${head()}
      <p class="instr">${esc(howStr("search"))}</p>
      <div class="search-wrap">
        <div class="grid" style="grid-template-columns:repeat(${N},auto)" role="grid" aria-label="Kotak huruf">${R.grid.flat().map((ch,i)=>`<button type="button" class="cell ${exCells.has(i)?"ex":foundCells.has(i)?"found":""} ${R.start===i?"sel":""}" data-i="${i}" aria-label="Baris ${Math.floor(i/N)+1} kolom ${i%N+1}: ${ch}">${ch}</button>`).join("")}</div>
        <ul class="clues">${R.placed.map((p,i)=>{const st=i===0?"done":R.found.has(i)?"done":R.revealed.has(i)?"miss":"";
          return `<li class="${st}">${p.o.e?`<span class="emo" aria-hidden="true">${p.o.e}</span>`:`<span class="emo" aria-hidden="true">·</span>`}<span>${esc(p.o.idn)}${st?` → <b>${esc(p.o.w)}</b>`:` <span class="muted small">(${p.o.w.length} huruf)</span>`}${i===0?' <span class="tag">contoh</span>':""}</span></li>`;}).join("")}</ul>
      </div>
      <div class="row" id="fb">${done?`<div class="fb ok" style="flex:1"><div><b class="v">Selesai!</b> Kamu menemukan ${R.placed.length-1-R.revealed.size} dari ${R.placed.length-1} kata.</div><button type="button" class="btn sm" id="next">Selesai babak</button></div>`:`<button type="button" class="linkbtn" id="giveup">Menyerah, tunjukkan sisa kata</button>`}</div>
    </section></div>`);
    SCR().querySelectorAll(".cell").forEach(b=>b.onclick=()=>tap(+b.dataset.i));
    if(done){$("#next").onclick=roundDone;$("#next").focus({preventScroll:true});}
    else $("#giveup").onclick=()=>{R.placed.forEach((p,i)=>{if(!R.found.has(i)&&!R.revealed.has(i)){R.revealed.add(i);record(p.o,false);}});draw();};
  };
  const tap=i=>{
    if(R.start===null){R.start=i;draw();SCR().querySelector(`.cell[data-i="${i}"]`)?.focus({preventScroll:true});return;}
    const a=R.start,b=i;R.start=null;
    const key=(x,y)=>x.join(",")===y.join(",");
    let hit=-1;
    R.placed.forEach((p,k)=>{if(R.found.has(k)||R.revealed.has(k))return;const c=p.cells;if((c[0]===a&&c[c.length-1]===b)||(c[0]===b&&c[c.length-1]===a))hit=k;});
    if(hit>=0){R.found.add(hit);record(R.placed[hit].o,true);draw();}
    else {draw();[a,b].forEach(x=>{const el=SCR().querySelector(`.cell[data-i="${x}"]`);if(el){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),400);}});}
  };
  draw();
}

// ---------- additional models: dikte, beri nama, urutkan, rantai, teka-teki silang ----------
const lw=o=>o.w.toLowerCase();
const singleWord=o=>/^[A-Za-z]+$/.test(o.w);
function buildNew(type,pool){
  if(type==="name"){
    let p=pool.filter(o=>o.w.length<=22);
    if(type==="name"){const f=p.filter(o=>o.idn.toLowerCase().split(" (")[0]!==lw(o));if(f.length>=6)p=f;}
    if(p.length<4)return null;
    const ch=sample(p,Math.min(itemsN()+1,p.length));const ex=ch.pop();
    return {type,items:ch.map(o=>({o})),ex:{o:ex}};
  }
  if(type==="chain"){
    let p=pool.filter(o=>singleWord(o)&&o.w.length>=3&&o.w.length<=9);const f=p.filter(clueOk);if(f.length>=8)p=f;if(p.length<5)return null;
    const ch=sample(p,6);const placed=[];let str="";
    ch.forEach(o=>{placed.push({o,start:str.length,end:str.length+o.w.length-1});str+=lw(o);});
    return {type,str,placed,ex:placed[0]};
  }
  if(type==="xword")return buildCrossword(pool);
  return null;
}
const clueOk=o=>o.idn.toLowerCase().split(" (")[0]!==lw(o);
function buildCrossword(pool){
  let p=pool.filter(o=>singleWord(o)&&o.w.length>=3&&o.w.length<=9);const f=p.filter(clueOk);if(f.length>=10)p=f;
  if(p.length<5)return null;
  const key=(r,c)=>r+","+c;
  for(let attempt=0;attempt<70;attempt++){
    const cand=sample(p,Math.min(20,p.length)).sort((a,b)=>b.w.length-a.w.length);
    const grid=new Map();const placed=[];
    const canPlace=(W,r,c,dr,dc)=>{
      if(grid.has(key(r-dr,c-dc))||grid.has(key(r+dr*W.length,c+dc*W.length)))return 0;
      let cross=0;
      for(let k=0;k<W.length;k++){
        const rr=r+dr*k,cc=c+dc*k;const cell=grid.get(key(rr,cc));
        if(cell){if(cell.ch!==W[k]||cell.dirs.has(dr?"d":"a"))return 0;cross++;}
        else if(grid.has(key(rr+dc,cc+dr))||grid.has(key(rr-dc,cc-dr)))return 0;
      }
      return cross;
    };
    const put=(o,W,r,c,dr,dc)=>{
      const cells=[];
      for(let k=0;k<W.length;k++){const rr=r+dr*k,cc=c+dc*k,kk=key(rr,cc);let cell=grid.get(kk);if(!cell){cell={ch:W[k],dirs:new Set()};grid.set(kk,cell);}cell.dirs.add(dr?"d":"a");cells.push([rr,cc]);}
      placed.push({o,W,r,c,dr,dc,cells});
    };
    put(cand[0],lw(cand[0]),0,0,0,1);
    for(const o of cand.slice(1)){
      if(placed.length>=7)break;
      const W=lw(o);if(placed.some(pl=>pl.W===W))continue;
      const opts=[];
      for(const pl of placed){
        const ndr=pl.dr?0:1,ndc=pl.dr?1:0;
        pl.cells.forEach(([pr,pc],pi)=>{for(let k=0;k<W.length;k++){if(W[k]!==pl.W[pi])continue;const r=pr-ndr*k,c=pc-ndc*k;if(canPlace(W,r,c,ndr,ndc))opts.push([r,c,ndr,ndc]);}});
      }
      if(opts.length){const [r,c,dr,dc]=pick(opts);put(o,W,r,c,dr,dc);}
    }
    if(placed.length<5&&!(attempt>=40&&placed.length>=4))continue;
    let minR=Infinity,minC=Infinity,maxR=-Infinity,maxC=-Infinity;
    for(const k of grid.keys()){const [r,c]=k.split(",").map(Number);minR=Math.min(minR,r);minC=Math.min(minC,c);maxR=Math.max(maxR,r);maxC=Math.max(maxC,c);}
    const rows=maxR-minR+1,cols=maxC-minC+1;
    if(rows>13||cols>13)continue;
    placed.forEach(pl=>{pl.r-=minR;pl.c-=minC;pl.cells=pl.cells.map(([r,c])=>[r-minR,c-minC]);});
    const cells={};for(const [k,v] of grid){const [r,c]=k.split(",").map(Number);cells[key(r-minR,c-minC)]=v.ch;}
    const starts=[...new Set(placed.map(pl=>key(pl.r,pl.c)))].sort((a,b)=>{const [ar,ac]=a.split(",").map(Number),[br,bc]=b.split(",").map(Number);return ar-br||ac-bc;});
    placed.forEach(pl=>pl.num=starts.indexOf(key(pl.r,pl.c))+1);
    return {type:"xword",rows,cols,cells,placed,ex:{}};
  }
  return null;
}
function splitHalves(o){
  if(!o.ex)return null;
  const full=o.ex.replace("___",o.f);const i=o.ex.indexOf("___");
  const before=o.ex.slice(0,i).trim(),after=o.ex.slice(i+3).trim();
  const aw=after.split(/\s+/).filter(Boolean);
  let l,r;
  if(!before){if(aw.length<3)return null;const m=Math.ceil(aw.length/2);l=(o.f+" "+aw.slice(0,m).join(" ")).trim();r=aw.slice(m).join(" ");}
  else if(aw.length>=2){l=(before+" "+o.f).trim();r=after;}
  else{l=before;r=(o.f+" "+after).trim();}
  if(!l||!r||(l+" "+r).replace(/\s+/g," ")!==full.replace(/\s+/g," "))return null;
  return {o,l,r};
}
function renderChain(){
  const R=RUN.R;R.found=new Set([0]);R.revealed=new Set();R.start=null;
  const draw=()=>{
    const done=R.placed.every((p,i)=>R.found.has(i)||R.revealed.has(i));
    const mark=new Map();R.placed.forEach((p,i)=>{if(R.found.has(i)||R.revealed.has(i))for(let k=p.start;k<=p.end;k++)mark.set(k,i===0?"ex":"found");});
    mount(`<div style="display:flex;flex-direction:column;gap:12px">${hud()}<section class="qcard">${head()}
      <p class="instr">${esc(howStr("chain"))}</p>
      <div class="chainrow" role="group" aria-label="Rantai huruf">${[...R.str].map((ch,i)=>`<button type="button" class="cell ${mark.get(i)||""} ${R.start===i?"sel":""}" data-i="${i}" aria-label="Huruf ke-${i+1}: ${ch}">${ch}</button>`).join("")}</div>
      <ul class="clues">${R.placed.map((p,i)=>{const st=i===0||R.found.has(i)?"done":R.revealed.has(i)?"miss":"";return `<li class="${st}">${p.o.e?`<span class="emo" aria-hidden="true">${p.o.e}</span>`:`<span class="emo" aria-hidden="true">·</span>`}<span>${esc(p.o.idn)}${st?` → <b>${esc(p.o.w)}</b>`:` <span class="muted small">(${p.o.w.length} huruf)</span>`}${i===0?' <span class="tag">contoh</span>':""}</span></li>`;}).join("")}</ul>
      <div class="row" id="fb">${done?`<div class="fb ok" style="flex:1"><div><b class="v">Selesai!</b> ${R.placed.length-1-R.revealed.size} dari ${R.placed.length-1} kata ditemukan.</div><button type="button" class="btn sm" id="next">Selesai babak</button></div>`:`<button type="button" class="linkbtn" id="giveup">Menyerah, tunjukkan sisa kata</button>`}</div>
    </section></div>`);
    SCR().querySelectorAll(".chainrow .cell").forEach(b=>b.onclick=()=>tap(+b.dataset.i));
    if(done){$("#next").onclick=roundDone;$("#next").focus({preventScroll:true});}
    else $("#giveup").onclick=()=>{R.placed.forEach((p,i)=>{if(!R.found.has(i)&&!R.revealed.has(i)){R.revealed.add(i);record(p.o,false);}});draw();};
  };
  const tap=i=>{
    if(R.start===null){R.start=i;draw();SCR().querySelector(`.chainrow .cell[data-i="${i}"]`)?.focus({preventScroll:true});return;}
    const a=Math.min(R.start,i),b=Math.max(R.start,i);R.start=null;
    const hit=R.placed.findIndex((p,k)=>!R.found.has(k)&&!R.revealed.has(k)&&p.start===a&&p.end===b);
    if(hit>=0){R.found.add(hit);record(R.placed[hit].o,true);}
    draw();
    if(hit<0)[a,b].forEach(x=>{const el=SCR().querySelector(`.chainrow .cell[data-i="${x}"]`);if(el){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),400);}});
  };
  draw();
}
function renderXword(){
  const R=RUN.R;
  const owner={};R.placed.forEach((pl,i)=>pl.cells.forEach(([r,c])=>{(owner[r+","+c]=owner[r+","+c]||[]).push(i);}));
  const nums={};R.placed.forEach(pl=>nums[pl.r+","+pl.c]=pl.num);
  let grid=`<div class="xgrid" style="grid-template-columns:repeat(${R.cols},var(--xc))">`;
  for(let r=0;r<R.rows;r++)for(let c=0;c<R.cols;c++){const k=r+","+c;
    grid+=R.cells[k]?`<div class="xcell">${nums[k]?`<span class="xn">${nums[k]}</span>`:""}<input maxlength="1" data-k="${k}" aria-label="Kotak baris ${r+1} kolom ${c+1}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`:`<div class="xblank"></div>`;}
  grid+="</div>";
  const clues=down=>R.placed.map((pl,i)=>({pl,i})).filter(x=>!!x.pl.dr===down).sort((a,b)=>a.pl.num-b.pl.num).map(({pl,i})=>`<li data-i="${i}"><b>${pl.num}</b>${pl.o.e?`<span class="emo" aria-hidden="true">${pl.o.e}</span>`:""}<span>${esc(pl.o.idn)} <span class="muted small">(${pl.W.length})</span><span class="ans"></span></span></li>`).join("");
  mount(`<div style="display:flex;flex-direction:column;gap:12px">${hud()}<section class="qcard">${head()}
    <p class="instr">${esc(howStr("xword"))}</p>
    <div class="xwrap"><div class="xscroll">${grid}</div>
      <div class="xclues"><h3>Mendatar</h3><ul class="clues">${clues(false)}</ul><h3>Menurun</h3><ul class="clues">${clues(true)}</ul></div></div>
    <div class="row" id="fb"><button type="button" class="btn" id="check">Cek jawaban</button><button type="button" class="linkbtn" id="giveup">Tunjukkan jawaban</button></div>
  </section></div>`);
  let dir="a";
  const inp=k=>SCR().querySelector(`.xcell input[data-k="${k}"]`);
  SCR().querySelectorAll(".xcell input").forEach(el=>{
    el.onfocus=()=>{const ds=owner[el.dataset.k].map(i=>R.placed[i].dr?"d":"a");if(!ds.includes(dir))dir=ds[0];};
    el.oninput=()=>{el.value=el.value.toLowerCase().replace(/[^a-z]/g,"");if(el.value){const [r,c]=el.dataset.k.split(",").map(Number);const n=inp(dir==="a"?r+","+(c+1):(r+1)+","+c);if(n)n.focus();}};
    el.onkeydown=e=>{const [r,c]=el.dataset.k.split(",").map(Number);
      if(e.key==="Backspace"&&!el.value){const pv=inp(dir==="a"?r+","+(c-1):(r-1)+","+c);if(pv){pv.focus();e.preventDefault();}}
      const mv={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[e.key];
      if(mv){const n=inp((r+mv[0])+","+(c+mv[1]));if(n){dir=mv[0]?"d":"a";n.focus();e.preventDefault();}}
      if(e.key==="Enter"){e.preventDefault();finish(false);}};
  });
  SCR().querySelectorAll(".xclues li").forEach(li=>li.onclick=()=>{const pl=R.placed[+li.dataset.i];dir=pl.dr?"d":"a";const first=pl.cells.find(([r,c])=>!inp(r+","+c).value)||pl.cells[0];inp(first[0]+","+first[1])?.focus();});
  let finished=false;
  const finish=reveal=>{
    if(finished)return;finished=true;
    R.placed.forEach((pl,i)=>{const ok=!reveal&&pl.cells.every(([r,c])=>inp(r+","+c).value===R.cells[r+","+c]);record(pl.o,ok);
      const li=SCR().querySelector(`.xclues li[data-i="${i}"]`);li.classList.add(ok?"done":"miss");li.querySelector(".ans").innerHTML=` → <b>${esc(pl.o.w)}</b>`;});
    SCR().querySelectorAll(".xcell input").forEach(el=>{const want=R.cells[el.dataset.k];el.classList.add(el.value===want?"good":"bad");el.value=want;el.disabled=true;});
    $("#fb").innerHTML=`<div class="fb ${RUN.rc===RUN.rt?"ok":"no"}" style="flex:1"><div><b class="v">${RUN.rc===RUN.rt?"Sempurna!":"Selesai."}</b> ${RUN.rc}/${RUN.rt} kata benar.</div><button type="button" class="btn sm" id="next">Selesai babak</button></div>`;
    $("#next").onclick=roundDone;$("#next").focus({preventScroll:true});
  };
  $("#check").onclick=()=>finish(false);$("#giveup").onclick=()=>finish(true);
  const firstPl=R.placed.slice().sort((a,b)=>a.num-b.num)[0];dir=firstPl.dr?"d":"a";inp(firstPl.r+","+firstPl.c)?.focus({preventScroll:true});
}

function buildLabel(pool){
  const byW=new Map(pool.map(o=>[lw(o),o]));
  const opts=DIAGRAMS.map(d=>({d,pts:d.pts.filter(([w])=>byW.has(w))})).filter(x=>x.pts.length>=4);
  if(!opts.length)return null;
  const {d,pts}=pick(opts);
  const ch=sample(pts,Math.min(7,pts.length)).sort((a,b)=>a[2]-b[2]||a[1]-b[1]).map(([w,x,y],i)=>({o:byW.get(w),x,y,n:i+1}));
  return {type:"label",d,pts:ch,ex:ch[Math.floor(Math.random()*ch.length)]};
}

// ---------- babak baru: Hafalan Kilat, Bentuk Kalimat, Tantangan 60 Detik ----------
const normAns=v=>v.trim().toLowerCase().replace(/\s+/g," ").replace(/[’‘]/g,"'");
function buildMemo(pool){
  let p=pool.filter(o=>o.w.length<=40);if(p.length<4)return null;
  const ch=sample(p,Math.min(7,p.length));const ex=ch.pop();
  return {type:"memo",words:ch.slice(0,6),ex:{o:ex}};
}
function tilesFor(o){
  const s=o.s;let toks=s.split(" ");
  const key=(isExp(o)?o.f:o.w).toLowerCase();const kw=key.split(" ").length;
  let ki=-1;
  for(let i=0;i+kw<=toks.length;i++){const seg=toks.slice(i,i+kw).join(" ").toLowerCase().replace(/[.,!?;:"“”]/g,"");if(seg===key||(kw===1&&seg.startsWith(key))){ki=i;break;}}
  let tiles=[];
  for(let i=0;i<toks.length;i++){
    if(i===ki){tiles.push({t:toks.slice(i,i+kw).join(" "),key:true});i+=kw-1;}
    else tiles.push({t:toks[i],key:false});
  }
  // gabungkan kepingan pendek bila terlalu banyak
  let guard=0;
  while(tiles.length>9&&guard++<20){
    let best=-1,len=1e9;
    for(let i=0;i<tiles.length-1;i++){if(tiles[i].key||tiles[i+1].key)continue;const L=tiles[i].t.length+tiles[i+1].t.length;if(L<len){len=L;best=i;}}
    if(best<0)break;tiles.splice(best,2,{t:tiles[best].t+" "+tiles[best+1].t,key:false});
  }
  const answer=tiles.map(x=>x.t).join(" ");
  let sh=shuffle(tiles),g=0;while(sh.map(x=>x.t).join(" ")===answer&&g++<12)sh=shuffle(tiles);
  return {o,toks:sh,answer};
}
function buildSentence(pool){
  const p=pool.filter(o=>o.s);if(p.length<7)return null;
  const ch=sample(p,Math.min(8,p.length));const ex=ch.length>7?ch.pop():ch[0];
  return {type:"build",items:ch.slice(0,7).map(tilesFor),ex:tilesFor(ex)};
}
function buildBlitz(pool){
  const p=pool.filter(o=>o.idn);if(p.length<4)return null;
  const R={type:"blitz",pool:p,secs:60};R.ex=blitzPair(R);return R;
}
function blitzPair(R){
  const o=pick(R.pool);const match=Math.random()<.5;
  let shown=o.idn;
  if(!match){const others=R.pool.filter(x=>x.idn!==o.idn&&!sameSyn(x,o));shown=others.length?pick(others).idn:o.idn;}
  return {o,shown,match:shown===o.idn};
}
